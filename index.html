  for (let i = 0; i < nx * (PATH ? 1 : COPIES + 1); i++) { // one spare period so the strip always covers the view while scrolling (a bent strip closes on itself)
    for (let j = 0; j < Z.length - 1; j++) {
      const p00 = vtx(i, j), p10 = vtx(i + 1, j), p01 = vtx(i, j + 1), p11 = vtx(i + 1, j + 1);
      const tris = diagA(i, j) ? [[p00, p01, p10], [p10, p01, p11]] : [[p00, p01, p11], [p00, p11, p10]];
      tris.forEach((tri, t) => {
        const c = faceCol[((i % nx) * (Z.length - 1) + j) * 2 + t];
        tri.forEach((v) => { pos.push(...v); col.push(c.r, c.g, c.b); });
      });
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 }));
  mesh.receiveShadow = true;
  return { mesh, heightAt };
}

// Racetrack cross-section in the stand frame (zs = z*S, metres; the horse runs at zs = 0 near the
// inner rail). JRA courses put the dirt course inside the turf; the back straight mirrors the home one
// at the turns' diameter, which follows from the circumference and the straight length.
// A dirt-only course (NAR tracks such as Oi: `dirtOnly: true`) has one course: the horse's lane is dirt and
// there is no inner course, so the infield starts at its inner rail.
// `innerTurf` (Morioka): the dirt is the outer course the horse runs on and the turf course lies inside it.
// Below, "turf" means the horse's own (outer) course and "dirt" the inner one, whatever their surfaces.
function trackLayout(loc) {
  const dirtOnly = !!loc.dirtOnly, innerTurf = !!loc.innerTurf, f = loc.facts ?? {}, gap = 1.4, off = 2.6;
  const mainDirt = dirtOnly || innerTurf;
  const turfW = mainDirt ? loc.dirt?.widthM ?? 25 : loc.turf?.widthM ?? 30, dirtW = dirtOnly ? 0 : innerTurf ? loc.turf?.widthM ?? 25 : loc.dirt?.widthM ?? 25;
  const circ = mainDirt ? f.dirtCircM : f.turfCircM, straight = mainDirt ? f.dirtStraightM : f.turfStraightM;
  const D = circ && straight ? clamp((circ - 2 * straight) / Math.PI, 220, 420) : 320;
  const inner = -off, outer = inner + turfW, dOut = dirtOnly ? inner : inner - gap, dIn = dOut - dirtW;
  const bInner = inner - D, bdOut = dirtOnly ? bInner : bInner + gap, bdIn = bdOut + dirtW, bOuter = bInner - turfW;
  const standFront = outer + 14;
  const rails = dirtOnly ? [inner, outer, bInner, bOuter] : [inner, outer, dOut, dIn, bInner, bdOut, bdIn, bOuter];
  return { dirtOnly, innerTurf, mainDirt, turfW, dirtW, D, inner, outer, dOut, dIn, bInner, bdOut, bdIn, bOuter, standFront, rails };
}

// Paddock (parade ring) cross-section in the stand frame, like a racetrack's: zs = metres from the centre line
// of the walking lane, + outward (the rail, the spectators, the terraces), - inward (the centre lawn).
function paddockLayout(loc) {
  const P = loc.path ?? {}, rail = loc.rail ?? {}, T = loc.terraces ?? {}, G = loc.ground ?? {};
  const hw = (P.laneWidthM ?? 4) / 2, apron = G.innerApronM ?? 0.35, strip = G.outerStripM ?? 0, flowers = G.flowersM ?? 0;
  const railZ = hw + (rail.gapM ?? 0.6), t0 = railZ + (T.distM ?? 2.5), rows = T.rows ?? 0, step = T.stepM ?? 0.8, rise = T.riseM ?? 0.4;
  // terraces may stand along part of the ring only: span = [from, to] metres along the path from the start of the near straight
  const span = T.span ?? null, inSpan = (x) => !span || (wrap01((x - span[0]) / W) * W <= span[1] - span[0]);
  return { hw, apron, strip, flowers, bed: hw + strip + flowers, railZ, t0, rows, step, rise, tEnd: t0 + rows * step, span, inSpan, inner: -(P.radiusM ?? 16) * 0.55 };
}

// Beach cross-section: the sea on one side of the horse's line (its edge at sea.waterlineZ, the sign says which
// side), a band of wet sand the surf runs over, dry sand rising gently to grassy dunes and a pine windbreak (防風林).
function beachLayout(loc) {
  const sea = loc.sea ?? {}, sand = loc.sand ?? {}, du = loc.dunes ?? {};
  const wl = sea.waterlineZ ?? -6, sg = Math.sign(wl) || -1; // sg: the sea's side of the horse's line
  return { wl, sg, wetW: sand.wetWidthM ?? 5, duneDist: du.distM ?? 30, duneH: du.heightM ?? [2, 6], sea, sand, du,
    toSea: (z) => (z - wl) * sg,                  // metres out to sea from the waterline (negative on the sand)
    inland: (z) => -sg * z,                        // metres inland of the horse's line
    beachY: (z) => -sg * z * 0.025 };              // the beach rises gently away from the sea
}

const GROUND = {
  // beach: sea, foam line, wet and dry sand with wind ripples, dunes
  beach(loc) {
    const Y = beachLayout(loc), k = TAU / W, s = Y.sand, se = Y.sea;
    const wet = colorOf(s.wet ?? '#8f7d63'), dry = colorOf(s.dry ?? '#cdb994'), grass = colorOf(Y.du.grass ?? '#7d8a4e');
    const foam = colorOf(se.foam ?? '#e8ecea'), shallow = colorOf(se.color ?? '#5f8f96'), deep = colorOf(se.deep ?? '#2f5a72');
    const marks = [Y.wl, Y.wl + Y.sg * 0.8, Y.wl + Y.sg * 3, Y.wl + Y.sg * 9, Y.wl + Y.sg * 25, Y.wl - Y.sg * Y.wetW, -Y.sg * Y.duneDist, -Y.sg * (Y.duneDist + 14)];
    return {
      dx: 2, Z: rowsWith(marks, 640), seed: 41, jit: 0.025,
      height(x, z, rnd) {
        const d = Y.toSea(z), inland = Y.inland(z);
        if (d > 0) return Y.beachY(Y.wl) - 0.06 - Math.min(d, 20) * 0.01; // the sea, just below the waterline
        const [h0, h1] = Y.duneH, roll = 0.5 + 0.5 * Math.sin(k * harm(37) * x + z * 0.05) * Math.cos(k * harm(83) * x - z * 0.031);
        const dune = smoothstep(Y.duneDist, Y.duneDist + 14, inland) * (h0 + (h1 - h0) * roll);
        return Y.beachY(z) + dune + (inland > Y.duneDist + 2 ? (rnd() - 0.5) * 0.3 : 0);
      },
      color(x, z, rnd) {
        const d = Y.toSea(z), inland = Y.inland(z);
        if (d > 0) return d < 0.8 ? foam.clone() : shallow.clone().lerp(deep, Math.min(1, d / 25)).offsetHSL(0, 0, (rnd() - 0.5) * 0.04);
        if (d > -Y.wetW) return wet.clone().lerp(dry, (-d / Y.wetW) ** 2 * 0.6).offsetHSL(0, 0, (rnd() - 0.5) * 0.02);
        if (inland > Y.duneDist + 3) return dry.clone().lerp(grass, rnd() < 0.55 ? 0.75 : 0.15);
        return dry.clone().offsetHSL(0, 0, (Math.floor(z / 0.9) % 2 ? 0.012 : -0.008) + (rnd() - 0.5) * 0.02); // wind ripples
      },
    };
  },
  // the original scene: sandy trail, mixed grass, rolling hills
  country() {
    const k = TAU / W;
    const sand = PAL.sand.map(colorOf), grass = PAL.grass.map(colorOf), golden = colorOf(PAL.golden), track = colorOf(PAL.track);
    return {
      dx: 1.8, Z: mirrorRows(ROWS), seed: 7,
      height(x, z, rnd) {
        const az = Math.abs(z);
        const roll = Math.sin(k * harm(27) * x + z * 0.11) * 0.5 + Math.sin(k * harm(11) * x - z * 0.23 + 1.3) * 0.3 + Math.sin(k * harm(60) * x + 2.1) * 0.4;
        const hill = 0.5 + 0.5 * Math.sin(k * harm(36) * x + z * 0.05 + 0.7) * Math.cos(k * harm(90) * x - z * 0.031);
        return smoothstep(2.8, 10, az) * (0.22 * roll + (rnd() - 0.5) * 0.12) + smoothstep(14, 55, az) * 4.2 * hill;
      },
      color(x, z, rnd) {
        const az = Math.abs(z);
        const patch = 0.5 + 0.5 * Math.sin(k * harm(17) * x + z * 0.21) * Math.cos(k * harm(8) * x - z * 0.13);
        const g = pick(grass, rnd).clone().lerp(golden, patch * 0.55);
        const s = pick(sand, rnd).clone();
        if (az < 0.9) s.lerp(track, 0.35 + rnd() * 0.25);
        return az < 1.7 ? s : az < 2.6 ? (rnd() < 0.5 ? s : g) : g;
      },
    };
  },
  // lush stud-farm grass with a worn lane where the horses walk
  pasture(loc) {
    const k = TAU / W, G = loc.ground ?? {};
    const grass = (G.grass ?? ['#6f9a45', '#77a24b', '#689043', '#80a852', '#5f8a3e']).map(colorOf);
    const lush = colorOf(G.lush ?? '#4d7c35'), path = colorOf(G.path ?? '#a08c63'), clover = colorOf('#a3c46f');
    const pads = (loc.extras ?? []).filter((e) => e.mode === 'grazer'); // keep the ground flat where horses stand
    const pad = (x, z) => pads.reduce((m, e) => Math.max(m, 1 - smoothstep(2.6, 5, Math.hypot(wrapCentered(x - e.x), z - e.z))), 0);
    return {
      dx: 1.8, Z: mirrorRows([...ROWS, 125, 165]), seed: 17,
      height(x, z, rnd) {
        if (pad(x, z) >= 1) return 0;
        const az = Math.abs(z), keep = 1 - pad(x, z);
        const roll = Math.sin(k * harm(31) * x + z * 0.09) * 0.45 + Math.sin(k * harm(13) * x - z * 0.19 + 0.4) * 0.25;
        const hill = 0.5 + 0.5 * Math.sin(k * harm(45) * x + z * 0.04 + 1.1) * Math.cos(k * harm(130) * x - z * 0.027);
        return keep * (smoothstep(2.4, 9, az) * (0.16 * roll + (rnd() - 0.5) * 0.06) + smoothstep(18, 62, az) * 6.5 * hill);
      },
      color(x, z, rnd) {
        const az = Math.abs(z);
        const patch = 0.5 + 0.5 * Math.sin(k * harm(19) * x + z * 0.17) * Math.cos(k * harm(7) * x - z * 0.11);
        const g = pick(grass, rnd).clone().lerp(lush, patch * 0.5);
        if (rnd() < 0.08) g.lerp(clover, 0.5);
        if (az < 0.8) return path.clone().lerp(g, 0.2 + rnd() * 0.3);
        if (az < 1.7) return rnd() < 0.5 ? path.clone().lerp(g, 0.65) : g;
        return g;
      },
    };
  },
  // paddock: the walking lane round a mown centre lawn, a rail, paving and terraces for the crowd; bent round
  // the ring by path mode (the strip stops at `inner`, and buildPathCentre fills the middle of the lawn)
  paddock(loc, S) {
    const Y = paddockLayout(loc), g = loc.ground ?? {};
    const lane = colorOf(g.lane ?? '#a08a68'), edging = colorOf(g.edging ?? '#cfc8b8'), lawn = colorOf(g.centre ?? '#5f8f3e'), soil = colorOf(g.bed ?? '#6b5a44');
    const outer = colorOf(g.outer ?? '#a9a69e'), step = colorOf(loc.terraces?.colors?.step ?? '#bdb8ad'), grass = colorOf(loc.lawn ?? '#6f9047');
    const zs = [-Y.hw - Y.apron, -Y.hw, -Y.hw / 2, 0, Y.hw / 2, Y.hw, Y.hw + Y.strip, Y.bed, Y.railZ + 0.4, Y.t0, Y.tEnd];
    for (let z = -Y.hw - Y.apron - 1.6; z > Y.inner + 0.5; z -= 2.2) zs.push(z);
    zs.push(Y.inner, ...[4, 10, 20, 35, 60, 100, 160, 260].map((d) => Y.tEnd + d));
    return {
      dx: 1.2, Z: [...new Set(zs.map((z) => z * S))].sort((a, b) => a - b), seed: 31, jit: 0.03,
      height: () => 0,
      color(x, z, rnd) {
        const zs = z * S;
        if (zs > Y.tEnd + 25) return grass.clone().lerp(outer, rnd() * 0.3);
        if (zs >= Y.t0 && zs <= Y.tEnd && Y.rows && Y.inSpan(x)) return step.clone();
        if (zs > Y.railZ + 0.4) return outer.clone().offsetHSL(0, 0, (rnd() - 0.5) * 0.03);
        if (zs > Y.hw + Y.strip) return soil.clone().offsetHSL(0, 0, (rnd() - 0.5) * 0.04); // flower bed and hedge
        if (zs > Y.hw) return edging.clone();
        if (zs >= -Y.hw) return lane.clone().offsetHSL(0, 0, (Math.abs(zs) < Y.hw / 2 ? -0.025 : 0) + (rnd() - 0.5) * 0.03); // the walked line is darker
        if (zs >= -Y.hw - Y.apron) return edging.clone();
        return lawn.clone().offsetHSL(0, 0, Math.floor(x / 3) % 2 ? 0.02 : -0.01); // mowing stripes
      },
    };
  },
  // racetrack: striped turf, dirt course inside, infield lawn and ponds, apron in front of the stands
  track(loc, S) {
    const T = trackLayout(loc), k = TAU / W, night = !!loc.time?.night;
    // the horse's own course: turf, or the sand of a dirt-only track (harrowed in faint bands)
    const turf = colorOf(T.mainDirt ? loc.dirt?.color ?? '#c9bea6' : loc.turf?.color ?? '#5f8f3a'), turfB = turf.clone().offsetHSL(0, T.mainDirt ? 0 : 0.02, T.mainDirt ? 0.02 : 0.035);
    const dirt = colorOf(T.innerTurf ? loc.turf?.color ?? '#5f8f3a' : loc.dirt?.color ?? '#b9a58a'), verge = colorOf(loc.verge ?? '#6b8f45');
    const lawn = colorOf(loc.lawn ?? '#6f9a46'), apron = colorOf(loc.apron ?? '#bdb9ae'), outside = colorOf(loc.outside ?? '#7d8a62');
    const water = colorOf(loc.water ?? '#4f7f97'), worn = turf.clone().lerp(dirt, 0.18);
    const ponds = (loc.infield ?? []).filter((f) => f.type === 'pond').map((p) => ({ x: (p.xFrac ?? 0.3) * W, ...p }));
    const inPond = (x, zs, m = 0) => ponds.some((p) => wrap01((x - p.x + m) / W) * W < p.sizeM[0] + 2 * m && zs < -p.distM + m && zs > -p.distM - p.sizeM[1] - m);
    const turfAt = (x, zs, rnd) => {
      const c = (Math.floor(x / 8) % 2 ? turf : turfB).clone();
      return Math.abs(zs - T.inner) < 3.2 && rnd() < 0.6 ? c.lerp(worn, 0.5) : c; // the rail lane is worn
    };
    const marks = [...T.rails, T.standFront].map((zs) => zs * S);
    return {
      dx: 4, Z: rowsWith(marks, 640), seed: 27, jit: 0.025,
      height(x, z) {
        const zs = z * S;
        if (inPond(x, zs)) return -0.4;
        return smoothstep(Math.abs(T.bOuter) + 30, 640, Math.abs(zs)) * 10 * (0.5 + 0.5 * Math.sin(k * harm(130) * x + zs * 0.013));
      },
      color(x, z, rnd) {
        const c = trackColor(x, z, rnd), zs = z * S;
        // under floodlights the courses glow and the infield and surroundings fall off into the dark
        return night && (zs < T.inner - 8 && zs > T.bInner + 8 || zs > T.standFront + 10) ? c.multiplyScalar(0.5) : c;
      },
    };
    function trackColor(x, z, rnd) {
      {
        const zs = z * S;
        if (zs > T.outer) return zs < T.standFront ? apron.clone() : outside.clone().lerp(apron, rnd() * 0.5);
        if (zs >= T.inner) return turfAt(x, zs, rnd);
        if (zs > T.dOut) return verge.clone();
        if (zs >= T.dIn) return dirt.clone().offsetHSL(0, 0, (rnd() - 0.5) * 0.03);
        if (zs > T.bdIn) {
          if (inPond(x, zs)) return water.clone().offsetHSL(0, 0, (rnd() - 0.5) * 0.04);
          if (inPond(x, zs, 3)) return colorOf('#8c8f72');
          return lawn.clone().lerp(turfB, rnd() * 0.3);
        }
        if (zs >= T.bdOut) return dirt.clone().offsetHSL(0, 0, (rnd() - 0.5) * 0.03);
        if (zs > T.bInner) return verge.clone();
        if (zs >= T.bOuter) return turfAt(x, zs, rnd);
        return outside.clone().lerp(lawn, rnd() * 0.4);
      }
    }
  },
};

// Instanced props, laid out over one world period and repeated like the ground. Props receive but do not cast shadows: the shadow
// map only covers the horse, so a scrolling caster's shadow would pop in and out at its edge.
function makeKit(loc, heightAt, S) {
  const rnd = mulberry32(loc.seed ?? 2024), sets = [];
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9 });
  const tintMat = new THREE.MeshStandardMaterial({ flatShading: true, roughness: 0.9 });
  const colored = (geo, h, amt = 0.05) => paint(geo, flat(hex(h), rnd, amt));
  const addSet = (geo, material, items) => {
    if (!items.length) return;
    // laid out once over COPIES+1 periods (like the ground); each frame only the mesh offset moves
    const reps = PATH ? 1 : COPIES + 1;
    const mesh = new THREE.InstancedMesh(geo, material, items.length * reps);
    items.forEach((it, i) => {
      for (let c = 0; c < reps; c++) {
        if (PATH && !it.world) { // bent round the walking path: follow its heading, stretch along it on the outside of bends
          const m = PATH.map(it.x, it.z);
          _p.set(m.x, it.y, m.z);
          _q.setFromAxisAngle(Y_AXIS, m.phi).multiply(it.q);
          _s.set((it.sx ?? 1) * it.s * (it.sx ? m.stretch : 1), it.s, it.s);
          mesh.setMatrixAt(i * reps + c, _m.compose(_p, _q, _s));
        } else {
          _p.set(it.x + c * W, it.y, it.z);
          _s.set((it.sx ?? 1) * it.s, it.s, it.s);
          mesh.setMatrixAt(i * reps + c, _m.compose(_p, it.q, _s));
        }
        mesh.setColorAt(i * reps + c, it.color ?? WHITE_C);
      }
    });
    mesh.receiveShadow = true;
    mesh.frustumCulled = false;
    sets.push({ mesh, items });
  };
  const item = (x, z, s, rotY = rnd() * TAU, sink = 0, extra = {}) => ({
    x, z, y: heightAt(x, z) - sink, s, q: new THREE.Quaternion().setFromEuler(new THREE.Euler(extra.tilt ?? 0, rotY, extra.tiltZ ?? 0)), ...extra,
  });
  return { rnd, sets, mat, tintMat, colored, addSet, item, heightAt, S };
}

// A fence/rail line along x: posts every ~gap metres, one board per height in o.rails.
function fenceLine(k, z, o) {
  const { rnd, item, colored, mat, addSet } = k;
  const n = Math.round(W / o.gap), gap = W / n, postH = o.postH ?? 1.1, r = o.postR ?? 0.055, wob = o.wobble ?? 0.06, tint = o.tint ?? 0.3;
  const postGeo = colored(jitter(new THREE.CylinderGeometry(r, r * 1.25, postH + 0.2, o.postSeg ?? 5), r * 0.22, 301).translate(0, postH / 2 - 0.1, 0), o.post);
  const railGeo = colored(jitter(new THREE.BoxGeometry(1, o.boardH ?? 0.075, o.boardD ?? 0.045), 0.008, 302), o.rail);
  const posts = [], rails = [];
  const shadeOf = () => new THREE.Color().setScalar(1 - tint / 2 + rnd() * tint);
  for (let i = 0; i < n; i++) {
    const x = i * gap;
    posts.push(item(x, z, 1, rnd() * TAU, 0.05, { tilt: (rnd() - 0.5) * wob, tiltZ: (rnd() - 0.5) * wob, color: shadeOf() }));
    for (const y of o.rails) {
      const it = item(x + gap / 2, z, 1, 0, -y + (rnd() - 0.5) * wob * 0.6, { tiltZ: (rnd() - 0.5) * wob * 0.6, color: shadeOf() });
      it.sx = gap + 0.12;
      rails.push(it);
    }
  }
  addSet(postGeo, mat, posts);
  addSet(railGeo, mat, rails);
}

function rockSet(k, count, zOf) {
  const { rnd, item, colored, mat, addSet } = k;
  const rockGeo = colored(jitter(new THREE.DodecahedronGeometry(1, 0), 0.22, 303).scale(1, 0.62, 0.85), 0xffffff, 0.08);
  const rocks = [];
  for (let i = 0; i < count; i++) {
    const z = zOf(rnd), s = (Math.abs(z) < 6 ? 0.08 + rnd() * 0.14 : 0.15 + rnd() * 0.6) * (rnd() < 0.1 ? 2 : 1);
    rocks.push(item(rnd() * W, z, s, rnd() * TAU, s * 0.25, { color: colorOf(PAL.rock[i % 3]) }));
  }
  addSet(rockGeo, mat, rocks);
}

// grass tufts (5 leaning blades), tinted per instance
function tuftGeo(rnd) {
  const blades = [];
  for (let b = 0; b < 5; b++) {
    const a = (b / 5) * TAU + rnd();
    const bl = new THREE.ConeGeometry(0.035, 0.34 + rnd() * 0.16, 3, 1).translate(0, 0.17, 0);
    bl.rotateZ(Math.cos(a) * 0.35).rotateX(Math.sin(a) * 0.35).translate(Math.cos(a) * 0.05, 0, Math.sin(a) * 0.05);
    blades.push(paint(bl, flat(0xffffff, rnd, 0.1)));
  }
  return merge(blades);
}
function tuftSet(k, count, zOf, colors, golden = PAL.golden) {
  const { rnd, item, mat, addSet } = k;
  const tufts = [];
  for (let i = 0; i < count; i++) {
    const gc = colorOf(colors[i % colors.length]).lerp(colorOf(golden), rnd() * 0.5).multiplyScalar(0.8);
    tufts.push(item(rnd() * W, zOf(rnd), 0.7 + rnd() * 0.8, rnd() * TAU, 0.02, { color: gc }));
  }
  addSet(tuftGeo(rnd), mat, tufts);
}

function flowerSet(k, count, zOf, colors) {
  const { rnd, item, tintMat, addSet } = k;
  const flowers = [];
  for (let i = 0; i < count; i++) flowers.push(item(rnd() * W, zOf(rnd), 0.7 + rnd() * 0.6, rnd() * TAU, 0, { color: colorOf(colors[i % colors.length]) }));
  addSet(new THREE.OctahedronGeometry(0.05, 0).translate(0, 0.22, 0), tintMat, flowers);
}

// trees: round broadleaf + conifer; canopies take the instance colour, trunks stay bark-brown
// `blossom`: canopy colours for flowering broadleaf trees (cherry); conifers keep their leaves.
function treeSet(k, count, zOf, leaves, { conifer = 0.38, autumn = 0.22, size = [0.55, 0.55], blossom = null, bloom = 0.75, at = null } = {}) {
  const { rnd, item, colored, mat, addSet } = k;
  const trunkG = (h) => colored(jitter(new THREE.CylinderGeometry(0.1, 0.16, h, 5), 0.02, 310).translate(0, h / 2, 0), PAL.bark);
  const white = (geo) => colored(geo, 0xffffff, 0.08);
  const broad = merge([
    white(jitter(new THREE.IcosahedronGeometry(1, 0), 0.18, 311).scale(1.5, 1.25, 1.5).translate(0, 2.4, 0)),
    white(jitter(new THREE.IcosahedronGeometry(1, 0), 0.18, 312).scale(1.05, 0.95, 1.05).translate(0.35, 3.35, 0.1)),
  ]);
  const con = merge([
    white(jitter(new THREE.ConeGeometry(1.2, 2.4, 6), 0.12, 313).translate(0, 1.9, 0)),
    white(jitter(new THREE.ConeGeometry(0.85, 1.9, 6), 0.1, 314).translate(0, 3.2, 0)),
  ]);
  const broadItems = [], conItems = [];
  for (let i = 0; i < count; i++) {
    const leaf = rnd() < autumn ? PAL.autumn[i % 3] : leaves[i % leaves.length];
    const [x, z, world] = at ? [...at(rnd), true] : [rnd() * W, zOf(rnd), false]; // `at`: a point in ring coordinates (path mode)
    const it = item(x, z, size[0] + rnd() * size[1], rnd() * TAU, 0.1, { color: colorOf(leaf), world });
    const isConifer = rnd() < conifer;
    // index-based so a blossom list never shifts the random layout of the trees
    if (blossom && !isConifer && ((i * 7919) % 100) / 100 < bloom) it.color = colorOf(blossom[i % blossom.length]);
    (isConifer ? conItems : broadItems).push(it);
  }
  const barkOf = (items) => items.map((it) => ({ ...it, color: new THREE.Color().setScalar(0.85 + rnd() * 0.3) }));
  addSet(trunkG(1.6), mat, barkOf(broadItems));
  addSet(broad, mat, broadItems);
  addSet(trunkG(0.9), mat, barkOf(conItems));
  addSet(con, mat, conItems);
}

// Hokkaido birch: white bark with dark marks, a slim light-green crown
function birchSet(k, count, zOf) {

  const items = [];
  for (let i = 0; i < count; i++) items.push(item(rnd() * W, zOf(rnd), 0.75 + rnd() * 0.5, rnd() * TAU, 0.1, { color: colorOf(pick(['#9cbf5e', '#8db454', '#a9c76a'], rnd)) }));

// Steeplechase fences in the infield (Nakayama's 大竹柵 brush fence and 大生垣 hedge, 1.6 m high)
function jumpSet(k, f, T) {
  const { rnd, item, colored, mat, addSet, S } = k;
  const brush = colored(jitter(new THREE.BoxGeometry(16, 1.6, 2.05, 8, 2, 2), 0.16, 501).translate(0, 0.8, 0), 0x55603a, 0.1);
  const hedge = colored(jitter(new THREE.BoxGeometry(16, 1.6, 2.4, 8, 2, 2), 0.2, 502).translate(0, 0.8, 0), 0x3d6b33, 0.07);

  for (let i = 0; i < (f.count ?? 4); i++) {

    (i % 2 ? Hs : B).push(item(((i + rnd() * 0.5) / (f.count ?? 4)) * W, zs * S, 1, Math.PI / 2 + (rnd() < 0.5 ? 0.55 : -0.55), 0.05));

// Grandstand: a stepped seating bowl, a glazed block of floors behind it, fins and a roof canopy.
// Built along x (centred), seats rising away from the track (+z); placed at the stand front, once per period.
// At night the glazed floors glow (returned separately as `lit`, drawn with an unlit material).
function standGeometry(st, rnd, night = false) {
  const len = st.lengthM, floors = st.floors ?? 6, fl = 4.3, H = 6 + floors * fl;
  const c = { body: 0xd9d6cf, roof: 0xe9ecee, glass: 0x7f97a8, seats: 0x8b9aa6, ...Object.fromEntries(Object.entries(st.colors ?? {}).map(([k, v]) => [k, hex(v)])) };
  const parts = [], lit = [];
  const box = (w, h, d, x, y, z, fn, list = parts) => list.push(paint(noUV(new THREE.BoxGeometry(w, h, d, list === lit ? Math.max(1, Math.round(w / 9)) : 1).translate(x, y, z)), fn));
  const by = (hexv, amt = 0.03) => flat(hexv, rnd, amt);
  const steps = 9, stepD = 2.3, rise = 1.25;
  for (let i = 0; i < steps; i++) box(len, rise * (i + 1), stepD, 0, (rise * (i + 1)) / 2, i * stepD + stepD / 2, (q, n) => shade(n.y > 0.5 ? c.seats : 0xbab6ac, rnd, 0.04));
  const z0 = steps * stepD, depth = st.depthM ?? 24;
  box(len, H, depth, 0, H / 2, z0 + depth / 2 + 0.6, by(c.body));
  for (let f = 0; f < floors; f++) {
    const y0 = rise * steps + 1 + f * fl;
    if (y0 + fl > H) break;
    if (night) box(len, fl - 1.1, 0.6, 0, y0 + (fl - 1.1) / 2, z0 + 0.3, () => shade(rnd() < 0.8 ? 0xffe3ad : 0x8a8f9a, rnd, 0.08), lit);
    else box(len, fl - 1.1, 0.6, 0, y0 + (fl - 1.1) / 2, z0 + 0.3, by(c.glass, 0.05));
    box(len, 1.1, 0.9, 0, y0 + fl - 0.55, z0 + 0.35, by(c.body));
  }
  for (let x = -len / 2 + 6; x < len / 2; x += 18) box(0.9, H - 2, 1.4, x, (H - 2) / 2 + 2, z0 + 0.2, by(c.body));
  const roofD = z0 + depth + 6;
  box(len + 6, 1.1, roofD, 0, H + 1.6, roofD / 2 - 6, by(c.roof));
  for (let x = -len / 2 + 9; x < len / 2; x += 36) box(0.7, H + 1.6 - rise * steps, 0.7, x, (H + 1.6 + rise * steps) / 2, 1.2, by(c.body)); // canopy columns
  return { geo: merge(parts), lit: lit.length ? merge(lit) : null };
}

// Floodlight masts (night racing): a grey pole with a tilted bank of lamps that glows (unlit material),
// in rows in front of the stands and beyond the back straight, aimed at the track.
function floodlightSet(k, F, T) {
  const { item, colored, mat, addSet, S } = k, h = F.heightM ?? 30, per = Math.max(1, Math.round((F.count ?? 10) / 2));
  const pole = colored(new THREE.CylinderGeometry(0.28, 0.45, h, 6).translate(0, h / 2, 0), hex(F.poleColor ?? '#b8bcc0'), 0.03);
  const frame = colored(new THREE.BoxGeometry(7.2, 4.4, 0.7).rotateX(-0.5).translate(0, h + 1.4, -0.4), 0x5d6168, 0.03);
  const lampMat = new THREE.MeshBasicMaterial({ vertexColors: true, fog: false });
  const lamps = paint(noUV(new THREE.BoxGeometry(6.6, 3.8, 0.2, 6, 4, 1).rotateX(-0.5).translate(0, h + 1.4, -0.82)), flat(hex(F.color ?? '#f4f2ea'), k.rnd, 0.06));
  const masts = [];
  for (let i = 0; i < per; i++) {
    const x = ((i + 0.5) / per) * W;
    masts.push(item(x, (T.outer + 9) * S, 1, S > 0 ? 0 : Math.PI, 0));         // in front of the stands, facing the track
    masts.push(item(x + W / per / 2, (T.bOuter - 10) * S, 1, S > 0 ? Math.PI : 0, 0)); // beyond the back straight, facing back
  }
  addSet(pole, mat, masts);
  addSet(frame, mat, masts);
  addSet(lamps, lampMat, masts);
}

// Paddock terraces: one solid block per row of steps, rising away from the ring (bent round it in path mode).
function terraceSet(k, Y, loc) {
  const { S, rnd, item, colored, mat, addSet } = k, T = loc.terraces ?? {}, seg = 2.5;
  const [x0, x1] = Y.span ?? [0, W], n = Math.max(1, Math.round((x1 - x0) / seg)), g = (x1 - x0) / n, at = (i) => x0 + i * g + g / 2;
  const nosing = colored(new THREE.BoxGeometry(1, 0.05, 0.16), hex(T.colors?.nosing ?? '#8e8a84'), 0.02), noses = [];
  for (let r = 0; r < Y.rows; r++) {
    const h = (r + 1) * Y.rise, zr = Y.t0 + (r + 0.5) * Y.step;
    const geo = colored(new THREE.BoxGeometry(1, h, Y.step + 0.02).translate(0, h / 2, 0), hex(T.colors?.step ?? '#bdb8ad'), 0.02);
    addSet(geo, mat, Array.from({ length: n }, (_, i) => item(at(i), zr * S, 1, 0, 0, { sx: g * 1.04, color: new THREE.Color().setScalar(0.95 + rnd() * 0.06) })));
    for (let i = 0; i < n; i++) noses.push(item(at(i), (zr - Y.step / 2 + 0.08) * S, 1, 0, -h, { sx: g * 1.04 }));
  }
  addSet(nosing, mat, noses);
  if (T.roof) { // a deck or canopy over the back rows: soffit, a fascia band along its front edge, slim columns
    const R = T.roof, d = R.depthM ?? 6, y = R.heightM ?? Y.rows * Y.rise + 3, zc = (Y.tEnd - d / 2 + 0.5) * S, zf = (Y.tEnd - d + 0.5) * S;
    const roof = colored(new THREE.BoxGeometry(1, 0.5, d).translate(0, y + 0.25, 0), hex(R.color ?? '#e4e4e0'), 0.02);
    const fascia = colored(new THREE.BoxGeometry(1, 0.9, 0.2).translate(0, y + 0.3, 0), hex(R.fascia ?? R.color ?? '#e4e4e0'), 0.03);
    const col = colored(new THREE.BoxGeometry(0.3, y, 0.3).translate(0, y / 2, 0), hex(R.color ?? '#e4e4e0'), 0.02);
    addSet(roof, mat, Array.from({ length: n }, (_, i) => item(at(i), zc, 1, 0, 0, { sx: g * 1.06 })));
    addSet(fascia, mat, Array.from({ length: n }, (_, i) => item(at(i), zf, 1, 0, 0, { sx: g * 1.06 })));
    addSet(col, mat, Array.from({ length: Math.ceil(n / 3) }, (_, i) => item(at(i * 3), (Y.tEnd - d + 1.2) * S, 1, 0, 0)));
  }
}

// Spectators: a body in the instance colour, trousers, a face and hair; rows along the rail and one per terrace step.
function crowdSet(k, Y, loc) {
  const { S, rnd, item, mat, addSet } = k, colors = (loc.terraces?.colors?.crowd ?? ['#2b2d33', '#f2f0ea', '#3a4a6a', '#6a6f78', '#a33a3a', '#c9b48a', '#2f5a45']).map(colorOf);
  const coat = paint(noUV(new THREE.CylinderGeometry(0.15, 0.17, 0.6, 5).translate(0, 1.1, 0)), flat(0xffffff, rnd, 0.04)); // takes the instance colour
  const rest = merge([
    paint(noUV(new THREE.CylinderGeometry(0.12, 0.1, 0.8, 4).translate(0, 0.4, 0)), flat(0x34343c, rnd, 0.06)),
    paint(noUV(new THREE.IcosahedronGeometry(0.1, 0).translate(0, 1.52, 0)), flat(0xd8b493, rnd, 0.06)),
    paint(noUV(new THREE.IcosahedronGeometry(0.105, 0).scale(1, 0.55, 1).translate(0, 1.6, -0.01)), flat(0x2a2420, rnd, 0.08)), // hair
  ]);
  const people = [];
  const row = (zs, y, perM, gaps, span = null) => {
    for (let x = 0; x < W; x += 1 / perM) {
      if (rnd() < gaps || (span && !Y.inSpan(x))) continue;
      people.push(item(x + (rnd() - 0.5) * 0.3, (zs + (rnd() - 0.5) * 0.25) * S, 0.92 + rnd() * 0.16, (S > 0 ? 0 : Math.PI) + (rnd() - 0.5) * 0.8, -y, { color: pick(colors, rnd) }));
    }
  };
  row(Y.railZ + 0.5, 0, 1.5, 0.4);                         // pressed against the rail all round
  row(Y.railZ + 1.2, 0, 1, 0.6);
  for (let r = 0; r < Y.rows; r++) row(Y.t0 + (r + 0.5) * Y.step, (r + 1) * Y.rise, 1, 0.5 + 0.04 * r, true);
  addSet(coat, mat, people);
  addSet(rest, mat, people.map((it) => ({ ...it, color: new THREE.Color().setScalar(0.85 + rnd() * 0.25) })));
}

function ringSpot(S, bearingDeg, distM) {
  const b = (bearingDeg ?? 0) * DEG, x = Math.sin(b) * distM, z = -S * Math.cos(b) * distM;
  return { x, z, rotY: Math.atan2(-x, -z) };
}

function paddockProps(k, loc) {
  const { S, rnd, item, colored, mat, addSet } = k, Y = paddockLayout(loc), P = PATH;
  const rl = loc.rail ?? {}, railC = rl.color ?? '#f2f0ea', railH = rl.heightM ?? 1.1;
  fenceLine(k, Y.railZ * S, { gap: 1.8, post: railC, rail: rl.top ?? railC, rails: [0.12, railH - 0.04], postH: railH, postR: 0.035, postSeg: 4, boardH: 0.07, boardD: 0.07, wobble: 0.002, tint: 0.04 });
  if (rl.drape) fenceLine(k, (Y.railZ + 0.06) * S, { gap: 1.8, post: rl.drape, rail: rl.drape, rails: [railH * 0.55], postH: 0.02, postR: 0.01, boardH: railH * 0.7, boardD: 0.025, wobble: 0.004, tint: 0.08 });
  const hd = loc.hedge; // a clipped box hedge: inside the lane round the lawn, or outside it in front of the rail
  if (hd) {
    const h = hd.heightM ?? 0.9, outer = hd.side === 'outer', z0 = outer ? Y.bed + 0.05 : -Y.hw - Y.apron - 0.6, z1 = outer ? Y.railZ - 0.15 : -Y.hw - Y.apron - 0.05;
    const w = Math.max(0.3, z1 - z0), zc = ((z0 + z1) / 2) * S, c = hd.color ?? '#3f6a32';
    fenceLine(k, zc, { gap: 2, post: c, rail: c, rails: [h * 0.3], postH: 0.04, postR: 0.01, boardH: h * 0.6, boardD: w, wobble: 0.01, tint: 0.12 });
    if (hd.tiers === 2) fenceLine(k, zc + (outer ? 0.12 : -0.12) * S, { gap: 2, post: c, rail: c, rails: [h * 0.8], postH: 0.04, postR: 0.01, boardH: h * 0.4, boardD: w * 0.55, wobble: 0.01, tint: 0.12 });
  }
  if (Y.flowers) flowerSet(k, Math.round(W * Y.flowers * 9), (r) => S * (Y.hw + Y.strip + 0.1 + r() * (Y.flowers - 0.2)), loc.flowers ?? ['#d8263a', '#f29a1c', '#f2c81e', '#e8648c', '#5a6ad0']);
  terraceSet(k, Y, loc);
  crowdSet(k, Y, loc);
  // trees round the ring, kept off the side the terraces face (ring coordinates, outside the rail and the crowd)
  const tr = loc.trees ?? {}, hM = tr.heightM ?? [8, 14], leaf = tr.leaf ?? loc.leaf ?? PAL.leaf, sz = [hM[0] / 4.3, (hM[1] - hM[0]) / 4.3];
  const span = Y.span, around = (r) => {
    let x = r() * W;
    if (span) x = span[1] + 8 + r() * (W - (span[1] - span[0]) - 16);
    const m = P.map(x, S * (Y.railZ + 7 + r() * 26));
    return [m.x, m.z];
  };
  treeSet(k, tr.count ?? 30, null, leaf, { autumn: 0, conifer: tr.conifer ?? 0.15, size: sz, at: around });
  // centre lawn: numbered mounting discs along both long sides, a logo panel, trees and flower beds if any
  const c = loc.centre ?? {}, lawnZ = P.R - Y.hw - Y.apron;
  if (c.discs) {
    const per = Math.ceil(c.discs / 2), disc = colored(new THREE.CylinderGeometry(0.55, 0.55, 0.05, 10), hex(c.discColor ?? '#8fcab4'), 0.03), discs = [];
    const mark = colored(new THREE.BoxGeometry(0.34, 0.06, 0.22), 0xf4f4f0, 0.02), marks = [];
    for (let i = 0; i < c.discs; i++) {
      const side = i < per ? 1 : -1, j = i % per, x = -P.Ls / 2 + 4 + (j * (P.Ls - 8)) / Math.max(1, per - 1), z = side * (lawnZ - 1.1) * S;
      discs.push({ ...item(x, z, 1, 0, -0.02), world: true });
      marks.push({ ...item(x, z, 1, side > 0 ? 0 : Math.PI, -0.035), world: true }); // the white number, as a tile
    }
    addSet(disc, mat, discs); addSet(mark, mat, marks);
  }
  if (c.logo) addSet(colored(new THREE.BoxGeometry(Math.min(12, P.Ls * 0.25), 0.03, Math.min(4, lawnZ)), hex(c.logo), 0.02), mat, [{ ...item(0, 0, 1, 0, -0.01), world: true }]);
  const centrePt = (r) => [(r() - 0.5) * P.Ls * 0.8, (r() - 0.5) * (lawnZ - 2) * 2];
  if (c.trees) treeSet(k, c.trees, null, leaf, { autumn: 0, conifer: 0.1, size: [1.1, 0.6], at: centrePt });
  if (c.flowerBeds) {
    const beds = [], cols = ['#d8344a', '#f2d23c', '#f4f1e6', '#b49bd3', '#e87aa0'];
    for (let b = 0; b < c.flowerBeds; b++) {
      const [bx, bz] = centrePt(rnd);
      for (let i = 0; i < 40; i++) beds.push({ ...item(bx + (rnd() - 0.5) * 3, bz + (rnd() - 0.5) * 1.2, 1 + rnd() * 0.5, rnd() * TAU, 0.12, { color: colorOf(cols[b % cols.length]) }), world: true });
    }
    addSet(new THREE.OctahedronGeometry(0.07, 0).translate(0, 0.22, 0), k.tintMat, beds);
  }
  // the paddock screen and the buildings round the ring, on the ring's own ground, facing its centre
  const sc = loc.screen;
  if (sc) {
    const o = ringSpot(S, sc.bearingDeg, sc.distM ?? P.R + 30), w = sc.wM ?? 12, h = sc.hM ?? 7, lift = sc.liftM ?? 3, fw = sc.frameM ?? 1.2;
    const frame = colored(new THREE.BoxGeometry(w + 2 * fw, h + 2 * fw, 0.8).translate(0, lift + h / 2, 0), hex(sc.frameColor ?? '#3a3d42'), 0.02);
    const wrap = sc.wrap ? colored(new THREE.BoxGeometry(w + fw, h + fw, 0.82).translate(0, lift + h / 2, 0), hex(sc.wrap), 0.03) : null;
    const legs = colored(merge([-1, 1].map((sd) => new THREE.BoxGeometry(Math.max(0.6, w * 0.12), lift, 1.2).translate(sd * w * 0.32, lift / 2, 0))), hex(sc.plinth ?? '#5a5e64'), 0.02);
    const face = paint(noUV(new THREE.BoxGeometry(w, h, 0.1, 8, 4, 1).translate(0, lift + h / 2, 0.42)), () => shade(rnd() < 0.7 ? 0x2d6a9a : 0x7fb24a, rnd, 0.12));
    const at = () => [{ ...item(o.x, o.z, 1, o.rotY, 0), world: true }];
    addSet(frame, mat, at()); addSet(legs, mat, at());
    if (wrap) addSet(wrap, mat, at());
    addSet(face, new THREE.MeshBasicMaterial({ vertexColors: true }), at());
  }
  for (const bd of loc.buildings ?? []) {
    const o = ringSpot(S, bd.bearingDeg, bd.distM ?? 80), w = bd.wM ?? 40, h = bd.hM ?? 15, d = bd.dM ?? Math.min(30, h + 4);
    const geo = colored(new THREE.BoxGeometry(w, h, d).translate(0, h / 2, -d / 2), hex(bd.color ?? '#d9d6cf'), 0.03);
    const bands = merge(Array.from({ length: Math.max(1, Math.floor(h / 5)) }, (_, f) => paint(noUV(new THREE.BoxGeometry(w * 0.96, 1.6, 0.3).translate(0, 3 + f * 5, 0.1)), flat(hex(bd.glass ?? '#6f8a9c'), rnd, 0.04))));
    const at = () => [{ ...item(o.x, o.z, 1, o.rotY, 0), world: true }];
    addSet(geo, mat, at());
    if (h > 6) addSet(bands, mat, at());
  }
}

function standSet(k, loc, T) {
  const { rnd, item, mat, addSet, S } = k;
  const st = { ...loc.stand, lengthM: Math.min(loc.stand.lengthM ?? 220, W - 60) };
  const { geo, lit } = standGeometry(st, rnd, !!loc.time?.night), at = [item(W / 2, T.standFront * S, 1, S > 0 ? 0 : Math.PI, 0)];
  addSet(geo, mat, at);
  if (lit) addSet(lit, new THREE.MeshBasicMaterial({ vertexColors: true }), at.map((it) => ({ ...it })));
}

// Beach props: marram grass on the dunes, the pine windbreak behind them, driftwood and rocks on the sand,
// tetrapods along the waterline, background horses.
function beachProps(k, loc) {
  const { rnd, item, colored, mat, addSet } = k, Y = beachLayout(loc), P = loc.props ?? {}, pines = loc.pines ?? {};
  const land = (a, b) => (r) => -Y.sg * (a + r() * (b - a)); // a strip inland, a..b metres from the horse's line
  tuftSet(k, perLoop(220), land(Y.duneDist - 2, Y.duneDist + 40), [Y.du.grass ?? '#7d8a4e', '#8a9a58', '#6f7d44'], '#c8b878');
  tuftSet(k, perLoop(25), land(Math.max(3, -Y.sg * Y.wl * 0 + 6), Y.duneDist), ['#8a9a58'], '#c8b878');
  if (pines.count) treeSet(k, perLoop(pines.count), land(pines.distM ?? Y.duneDist + 25, (pines.distM ?? Y.duneDist + 25) + 45), pines.leaf ?? ['#2f4a33', '#3a5a3c'], { conifer: 0.85, autumn: 0, size: [1.2, 0.8] });
  if (P.rocks) rockSet(k, perLoop(P.rocks), (r) => (r() < 0.5 ? Y.wl - Y.sg * (0.5 + r() * 3) : -Y.sg * (4 + r() * (Y.duneDist - 4))));
  if (P.driftwood) {
    const geo = colored(jitter(new THREE.CylinderGeometry(0.06, 0.09, 1, 5).rotateZ(Math.PI / 2), 0.02, 401), '#9c8a74', 0.08), logs = [];
    for (let i = 0; i < perLoop(P.driftwood); i++) logs.push(item(rnd() * W, -Y.sg * (2.5 + rnd() * (Y.duneDist - 3)), 0.6 + rnd() * 1.6, rnd() * TAU, 0.04, { sx: 1.5 + rnd() * 2, color: new THREE.Color().setScalar(0.75 + rnd() * 0.35) }));
    addSet(geo, mat, logs);
  }
  if (P.tetrapods) { // テトラポッド: four stubby concrete legs, in a low row out in the surf
    const legs = [V(0, 1, 0), V(0.943, -0.333, 0), V(-0.471, -0.333, 0.816), V(-0.471, -0.333, -0.816)];
    const geo = colored(merge(legs.map((d) => new THREE.CylinderGeometry(0.22, 0.42, 1.1, 6).translate(0, 0.55, 0).applyQuaternion(new THREE.Quaternion().setFromUnitVectors(Y_AXIS, d)).toNonIndexed())), '#b2b0a8', 0.05);
    const pods = [];
    for (let i = 0; i < perLoop(P.tetrapods); i++) pods.push(item(rnd() * W, Y.wl + Y.sg * (12 + rnd() * 6), 1 + rnd() * 0.3, rnd() * TAU, 0.6, { tilt: (rnd() - 0.5) * 0.8, tiltZ: (rnd() - 0.5) * 0.8 }));
    addSet(geo, mat, pods);
  }
}

const PROP_BUILDERS = {
  paddock: paddockProps,
  beach: beachProps,
  country(k) {
    const { rnd } = k;
    fenceLine(k, -3.3, { gap: 2.7, post: PAL.post, rail: PAL.rail, rails: [0.52, 0.92], postH: 1.1 });
    rockSet(k, perLoop(48), (r) => { const side = r() < 0.62 ? -1 : 1; return side * (side < 0 ? 2.6 + 26 * r() ** 1.6 : 3.4 + 26 * r() ** 1.4); });
    tuftSet(k, perLoop(275), (r) => (r() < 0.55 ? -1 : 1) * (2.2 + 34 * r() ** 1.8), PAL.grass);
    flowerSet(k, perLoop(137), (r) => (r() < 0.55 ? -1 : 1) * (2.4 + 24 * r() ** 1.5), PAL.flowers);
    treeSet(k, perLoop(32), (r) => (r() < 0.75 ? -(22 + 45 * r() ** 1.2) : 26 + 30 * r()), PAL.leaf);
    void rnd;
  },
  pasture(k, loc) {
    const white = loc.fence?.color ?? '#f3f1ea';
    const board = { gap: 3, post: white, rail: white, rails: [0.42, 0.8, 1.18], postH: 1.35, postR: 0.06, postSeg: 4, boardH: 0.17, boardD: 0.035, wobble: 0.012, tint: 0.07 };
    fenceLine(k, -3.6, board);
    fenceLine(k, -27, board);
    fenceLine(k, 11, board);
    rockSet(k, perLoop(10), (r) => (r() < 0.5 ? -1 : 1) * (4 + 30 * r()));
    tuftSet(k, perLoop(300), (r) => (r() < 0.5 ? -1 : 1) * (1.9 + 34 * r() ** 1.7), loc.ground?.grass ?? ['#6f9a45', '#77a24b', '#80a852'], '#b8c46a');
    flowerSet(k, perLoop(170), (r) => (r() < 0.5 ? -1 : 1) * (2 + 26 * r() ** 1.5), ['#f2d23c', '#f2d23c', '#f4f1e6', '#b49bd3']);
    birchSet(k, perLoop(22), (r) => (r() < 0.7 ? -(30 + 40 * r()) : 16 + 34 * r()));
    treeSet(k, perLoop(14), (r) => (r() < 0.8 ? -(45 + 40 * r()) : 30 + 30 * r()), PAL.leaf, { autumn: 0, conifer: 0.5 });
    haySet(k, perLoop(5), (r) => (r() < 0.6 ? -(31 + 12 * r()) : 14 + 16 * r())); // outside the grazers' paddock
    farmSet(k, -68);
    const muzzles = [];
    for (const e of loc.extras ?? []) {
      if (e.mode !== 'grazer') continue;
      const yaw = e.rotY ?? 0, mx = e.x + Math.cos(yaw) * 1.25, mz = e.z - Math.sin(yaw) * 1.25;
      for (let i = 0; i < 4; i++) muzzles.push(k.item(mx + (k.rnd() - 0.5) * 0.5, mz + (k.rnd() - 0.5) * 0.5, 1.5 + k.rnd() * 0.6, k.rnd() * TAU, 0, { color: colorOf('#6d9a45') }));
    }
    k.addSet(tuftGeo(k.rnd), k.mat, muzzles);
  },
  track(k, loc) {
    const T = trackLayout(loc), { S } = k, rail = loc.rails?.color ?? '#f4f4f0';
    for (const zs of T.rails) fenceLine(k, zs * S, { gap: 3, post: rail, rail, rails: [0.95], postH: 0.95, postR: 0.045, postSeg: 4, boardH: 0.11, boardD: 0.11, wobble: 0.004, tint: 0.05 });
    if (loc.stand) standSet(k, loc, T);
    if (loc.floodlights) floodlightSet(k, loc.floodlights, T);
    const infield = (r) => S * (T.dIn - 8 - r() * (T.D - T.turfW - T.dirtW - 30)); // somewhere between the two dirt courses
    tuftSet(k, perLoop(60), (r) => S * (T.dIn - 2 - r() * 60), ['#6f9a46', '#78a24c'], '#a6b660');
    const blossom = loc.blossom ? [loc.blossom].flat() : null;
    treeSet(k, perLoop(loc.infieldTrees ?? 14), infield, loc.leaf ?? PAL.leaf, { autumn: loc.autumn ?? 0.1, conifer: 0.3, size: [0.8, 0.7], blossom });
    treeSet(k, perLoop(40), (r) => S * (T.bOuter - 8 - r() * 70), loc.leaf ?? PAL.leaf, { autumn: loc.autumn ?? 0.1, conifer: 0.45, size: [1.1, 0.9], blossom, bloom: 0.45 }); // beyond the back straight
    treeSet(k, perLoop(12), (r) => S * (T.standFront + 70 + r() * 80), loc.leaf ?? PAL.leaf, { autumn: loc.autumn ?? 0.1, conifer: 0.3, size: [1, 0.6], blossom }); // behind the stands
    for (const f of loc.infield ?? []) {
      if (f.type === 'jumps') jumpSet(k, f, T);
      // trees on the near bank: between the inner dirt rail and the water (never out on the courses)
      const bankIn = -(f.distM - 4), bankOut = Math.max(bankIn, Math.min(T.dIn - 4, -0.4 * f.distM)); // never right behind the rail
      if (f.type === 'pond') treeSet(k, 8, (r) => S * (bankIn + r() * (bankOut - bankIn)), ['#4f7a3c', '#5f8a45'], { autumn: 0.15, conifer: 0.2, size: [0.7, 0.4] });
    }
  },
};

// The strip [0, (COPIES+1)W) slides left by the scroll, so it always covers +-COPIES*W/2.
function updateProps(sets, scroll) {
  for (const { mesh } of sets) mesh.position.x = -(COPIES / 2) * W - scroll;
}

// Sun direction from elevation/azimuth (deg; azimuth 0 = from behind the camera, + = toward +X).
function sunDirOf(t, S) {
  const el = (t.sunElevDeg ?? 40) * DEG, az = (t.sunAzimDeg ?? -20) * DEG;
  return V(Math.sin(az) * Math.cos(el), Math.sin(el), S * Math.cos(az) * Math.cos(el)).normalize();
}

const DEFAULT_SKY = { top: PAL.skyTop, mid: PAL.skyMid, horizon: PAL.horizon, sun: PAL.sun };
const DEFAULT_RANGES = [
  { r: 460, base: 0x9c9ab6, h: [24, 54], step: 0.2, haze: 0.58 },
  { r: 360, base: 0x9d9a90, h: [8, 24], step: 0.13, haze: 0.4 },
];

// Path mode: the middle of the ring, inside the bent strip's inner edge (same samples, so no seam).
function buildPathCentre(loc, S, dx) {
  const Y = paddockLayout(loc), n = Math.round(W / dx), rnd = mulberry32(78), lawn = colorOf(loc.ground?.centre ?? '#5f8f3e');
  const ring = (r) => Array.from({ length: n }, (_, i) => { const m = PATH.map((i / n) * W, Y.inner * S); return V(m.x * r, 0, m.z * r); });
  const rings = [ring(0.34), ring(0.67), ring(1)], pos = [], col = [], O = V(0, 0, 0);
  const tri = (a, b, c) => {
    const up = (b.z - a.z) * (c.x - a.x) - (b.x - a.x) * (c.z - a.z) >= 0, cc = lawn.clone().offsetHSL(0, 0, (Math.floor(((a.x + b.x + c.x) / 3) / 3) % 2 ? 0.02 : -0.01) + (rnd() - 0.5) * 0.03);
    for (const v of up ? [a, b, c] : [a, c, b]) { pos.push(v.x, v.y, v.z); col.push(cc.r, cc.g, cc.b); }
  };
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    tri(O, rings[0][i], rings[0][j]);
    for (let q = 0; q < 2; q++) { tri(rings[q][i], rings[q + 1][i], rings[q + 1][j]); tri(rings[q][i], rings[q + 1][j], rings[q][j]); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 }));
  mesh.receiveShadow = true;
  return mesh;
}

// Beach surf: a few foam sheets with ragged edges that run up the wet sand and drain back, a whole number of
// times per loop (seamless). Each sheet is a strip over the same span as the ground and scrolls with it.
function buildSurf(loc) {
  const Y = beachLayout(loc), rnd = mulberry32(91), group = new THREE.Group(), sheets = [];
  const nx = Math.round(W / 1.5), len = W * (COPIES + 1);
  for (let i = 0; i < 6; i++) { // three waves, each a thin bright lip on a wider, fainter sheet of foam
    const lip = i >= 3, geo = new THREE.PlaneGeometry(len, lip ? 0.3 : 1.8, nx * (COPIES + 1), 2).rotateX(-Math.PI / 2).translate(len / 2, 0, 0);
    const pos = geo.attributes.position;
    for (let v = 0; v < pos.count; v++) { // ragged landward edge, periodic in W
      const x = pos.getX(v), z = pos.getZ(v), w = i % 3, rag = -Y.sg * 0.9 * (Math.sin((TAU * harm(9) * x) / W + w * 2) * 0.5 + Math.sin((TAU * harm(4) * x) / W + w) * 0.5);
      if (lip) pos.setZ(v, z + rag + -Y.sg * 0.85); // the lip runs along the sheet's ragged landward edge
      else if (z * -Y.sg > 0.5) pos.setZ(v, z + rag);
    }
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: hex(Y.sea.foam ?? '#e8ecea'), transparent: true, opacity: 0.8, roughness: 0.6, depthWrite: false, flatShading: true }));
    m.receiveShadow = true;
    group.add(m);
    const w = i % 3, prev = sheets[w];
    sheets.push({ m, ph: prev ? prev.ph : w / 3 + rnd() * 0.1, run: prev ? prev.run : 3 + w * 1.8 + rnd() * 0.6, peak: lip ? 0.9 : 0.4, lip, edge: -Infinity });
  }
  // breakers: long white lines out in the surf zone that roll in toward the beach and fade
  const breakers = [];
  for (let i = 0; i < 4; i++) {
    const w = 0.8 + i * 0.5, geo = new THREE.PlaneGeometry(len, w, nx * (COPIES + 1), 1).rotateX(-Math.PI / 2).translate(len / 2, 0, 0), pos = geo.attributes.position;
    for (let v = 0; v < pos.count; v++) pos.setZ(v, pos.getZ(v) * (0.6 + 0.4 * Math.sin((TAU * harm(13 + i * 5) * pos.getX(v)) / W + i)) + 0.5 * Math.sin((TAU * harm(6) * pos.getX(v)) / W + i * 1.7));
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: hex(Y.sea.foam ?? '#e8ecea'), transparent: true, opacity: 0.7, roughness: 0.5, depthWrite: false, flatShading: true }));
    group.add(m);
    breakers.push({ m, ph: i / 4, out: 14 + i * 22 });
  }
  return {
    group,
    wet: (z) => sheets.some((sh) => sh.lip && -Y.sg * (z - Y.wl) < sh.edge), // is the swash over this line right now?
    update(p, scroll) {
      const n = Math.max(1, Math.round(loopPeriod / 6.5)); // a wave every ~6.5 s
      for (const sh of sheets) {
        const t = wrap01(n * p + sh.ph), up = Math.sin(Math.PI * Math.min(1, t * 1.6)) ** 0.7; // rush up, then drain
        const z = Y.wl - Y.sg * (up * sh.run - 0.6);
        sh.m.position.set(-(COPIES / 2) * W - scroll, Y.beachY(z) + 0.02, z);
        sh.m.material.opacity = sh.peak * (1 - smoothstep(0.45, 1, t));
        if (sh.lip) sh.edge = sh.m.material.opacity > 0.3 ? -Y.sg * (z - Y.wl) + 0.6 : -Infinity; // how far up the beach the water reaches now
      }
      for (const b of breakers) {
        const t = wrap01(n * p + b.ph), z = Y.wl + Y.sg * (b.out - 10 * t);
        b.m.position.set(-(COPIES / 2) * W - scroll, Y.beachY(Y.wl) - 0.04, z);
        b.m.material.opacity = 0.75 * smoothstep(0, 0.25, t) * (1 - smoothstep(0.6, 1, t));
      }
    },
  };
}

// Hoof prints in the sand behind the hero: each hoof's last few touchdowns, carried back with the ground,
// fading with distance (a pure function of the loop phase, like everything else).
function buildPrints(loc) {
  const Y = beachLayout(loc), K = 14, geo = new THREE.CircleGeometry(0.06, 9).scale(1.2, 1, 1).rotateX(-Math.PI / 2);
  const mesh = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ roughness: 1, polygonOffset: true, polygonOffsetFactor: -2 }), LEGS.length * K);
  mesh.frustumCulled = false;
  const dark = colorOf(loc.sand?.print ?? '#6f5f4a'), wet = colorOf(loc.sand?.wet ?? '#8f7d63'), dry = colorOf(loc.sand?.dry ?? '#cdb994'), c = new THREE.Color();
  return {
    mesh,
    update(p, r, heightAt, scroll) {
      const G = r.gait, sc = r.scale;
      LEGS.forEach((L, li) => {
        const P = L.fore ? G.fore : G.hind, z = L.side * (L.fore ? FORE.z : HIND.z) * sc, x0 = (P.xc + G.stanceLen / 2 + HOOF_TOE * 0.4) * sc;
        const since = wrap01(p * G.strides - G.land?.[L.id]) / G.strides; // loop time since this hoof last landed
        for (let n = 0; n < K; n++) {
          const d = (since + n / G.strides) * W, i = li * K + n, onSand = Y.toSea(z) < 0;
          const show = !G.stand && G.stride > 0 && onSand && d < 40;
          const xs = x0 - d;
          _p.set(xs, heightAt(xs + (COPIES / 2) * W + scroll, z) + 0.004, z);
          _s.setScalar(show ? sc : 0);
          mesh.setMatrixAt(i, _m.compose(_p, _q.identity(), _s));
          const fresh = 1 - smoothstep(4, 40, d), base = Y.toSea(z) > -Y.wetW ? wet : dry;
          mesh.setColorAt(i, c.copy(base).lerp(dark, 0.65 * fresh));
        }
      });
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    },
  };
}

function buildWorld(loc) {
  const S = loc.hand === 'right' || loc.path?.dir === 'cw' ? -1 : 1, t = loc.time ?? {};
  PATH = loc.path ? makePath(loc.path, S) : null; // path mode: the scenery is bent round a closed walking path
  W = PATH ? PATH.L : loc.W ?? 65;
  const fogFar = t.fogFar ?? 92, reach = fogFar + (loc.stand ? Math.min(loc.stand.lengthM ?? 220, W - 60) / 2 : 12);
  COPIES = 1;
  while (!PATH && (COPIES * W) / 2 < reach) COPIES += 2; // odd, so the strip and the wrap agree; its edge stays in the fog
  // at night the key light is the floodlights: high and from the stand side (the sun itself is below the horizon)
  const night = !!t.night, sunDir = sunDirOf(night ? { sunElevDeg: loc.floodlights?.elevDeg ?? 52, sunAzimDeg: loc.floodlights?.azimDeg ?? 12 } : t, S);
  const sky = { ...DEFAULT_SKY, ...(t.sky ?? {}) };
  const gspec = GROUND[loc.builder](loc, S), ground = buildGround(gspec);
  const kit = makeKit(loc, ground.heightAt, S);
  PROP_BUILDERS[loc.builder](kit, loc);
  const group = new THREE.Group();
  group.add(ground.mesh);
  if (PATH) group.add(buildPathCentre(loc, S, gspec.dx));
  const surf = loc.builder === 'beach' ? buildSurf(loc) : null, prints = loc.prints ? buildPrints(loc) : null;
  if (surf) group.add(surf.group);
  if (prints) group.add(prints.mesh);
  kit.sets.forEach((s) => group.add(s.mesh));
  const back = loc.backdrop ?? {};
  const statics = new THREE.Group();
  statics.add(buildSky(night ? V(0, -1, 0) : sunDir, sky), buildBackdrop(sunDir, { horizon: sky.horizon, ranges: back.ranges ?? DEFAULT_RANGES, landmarks: back.landmarks, clouds: back.clouds, seed: back.seed, night }, S));
  return { loc, S, group, statics, ground, props: kit.sets, sunDir, sky, night, fog: [t.fogNear ?? 24, fogFar], path: PATH, surf, prints };
}

// Dust kicked up at each hoof strike; a pure function of gait phase (one puff per hoof per stride).
function buildDust() {
  const group = new THREE.Group(), rnd = mulberry32(555), puffs = [];
  const geo = jitter(new THREE.IcosahedronGeometry(1, 0), 0.12, 556);
  const m = new THREE.MeshLambertMaterial({ color: PAL.dust, flatShading: true, transparent: true, depthWrite: false });
  for (const L of LEGS) {
    const mats = m.clone(), parts = [];
    for (let i = 0; i < 6; i++) {
      const mesh = new THREE.Mesh(geo, mats);
      const a = rnd() * TAU;
      parts.push({ mesh, dx: Math.cos(a) * (0.5 + rnd()) - 0.6, dz: Math.sin(a) * (0.5 + rnd()), up: 0.4 + rnd(), r: 0.07 + rnd() * 0.07 });
      group.add(mesh);
    }
    puffs.push({ L, m: mats, parts, big: L.fore ? 0.8 : 1 });
  }
  return { group, puffs, on: true, color: PAL.dust, colors: null, styleAt: null, setColor(c) { this.color = c; puffs.forEach((pf) => { pf.style = null; pf.m.color.set(hex(c)); }); } };
}
// Kick-up styles per surface: dry dust drifts, wet sand throws small dark clods that fall back, water splashes up.
const KICK = {
  dust: { life: 0.55, rise: 0.22, spread: 1, size: 1, opacity: 0.5, fall: 0 },
  clods: { life: 0.3, rise: 0.5, spread: 0.7, size: 0.45, opacity: 0.9, fall: 1 },
  splash: { life: 0.35, rise: 0.9, spread: 1.2, size: 0.6, opacity: 0.7, fall: 1 },
};
function updateDust(dust, g, rig) {
  const G = rig.gait, s = rig.scale, live = dust.on && G.dust;
  for (const pf of dust.puffs) {
    const P = pf.L.fore ? G.fore : G.hind, z = pf.L.side * (pf.L.fore ? FORE.z : HIND.z) * s;
    const style = dust.styleAt ? dust.styleAt(z) : 'dust', K = KICK[style] ?? KICK.dust;
    if (pf.style !== style) { pf.style = style; pf.m.color.set(hex(dust.colors?.[style] ?? dust.color ?? PAL.dust)); }
    const x0 = (P.xc + G.stanceLen / 2) * s;
    const a = wrap01(g - G.land[pf.L.id]), t = a / K.life;
    const on = live && t < 1;
    pf.m.opacity = on ? K.opacity * smoothstep(0, 0.06, t) * (1 - t) ** 2 : 0;
    const spread = (0.12 + 0.55 * (1 - (1 - Math.min(t, 1)) ** 2)) * K.spread;
    for (const p of pf.parts) {
      p.mesh.visible = on;
      if (!on) continue;
      const arc = K.fall ? 4 * t * (1 - t) : t; // clods and droplets fly up and fall back; dust keeps rising
      p.mesh.position.set(x0 - G.stride * s * a + p.dx * spread * 0.5, 0.03 + p.up * K.rise * arc + p.r * 0.5, z + p.dz * spread * 0.35);
      p.mesh.scale.setScalar(p.r * pf.big * K.size * (0.5 + 1.4 * (K.fall ? 0.5 : t)));
    }
  }
}

// Generic (non-roster) horses for the background: a plausible random coat, simple markings.
function genericLook(rnd) {
  const key = pick(['kage', 'kage', 'kurokage', 'kuri', 'kuri', 'ashige', 'aokage', 'tochikuri'], rnd);
  const leg = () => (rnd() < 0.18 ? pick(['coronet', 'pastern', 'sock'], rnd) : 'none');
  return {
    coat: { key, greyness: 0.3 + 0.6 * rnd(), tone: (rnd() - 0.5) * 0.8 },
    face: pick(['none', 'none', 'star', 'stripe', 'star-stripe', 'blaze', 'star-snip'], rnd),
    legs: { LF: leg(), RF: leg(), LH: leg(), RH: leg() },
    size: { typicalKg: 430 + rnd() * 90 },
  };
}

   8. Scene, camera, lights
   ===================================================================== */

const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 1500);

controls.maxPolarAngle = Math.PI / 2 - 0.04; // stay above the ground
// Camera presets: dir = direction from the target to the camera (z follows the location's grandstand

// side views centre the whole horse, tail included). "far" looks across from the infield side.
const TARGET_Y = 0.96; // a touch above mid-height: the longer neck (NECK_BASE) carries the head higher
const VIEWS = {
  side: { dir: [0, 0.08, 1], hw: 2.15, hh: 1.5, tx: 0.0 },
  'three-quarter': { dir: [0.8, 0.2, 0.74], hw: 1.8, hh: 1.5, tx: 0.12 },
  front: { dir: [1, 0.16, 0.42], hw: 1.5, hh: 1.55, tx: 0.12 },
  far: { dir: [-0.12, 0.2, -1], hw: 2.1, hh: 1.45, tx: -0.05 }, // just high enough to clear the inner rails

let currentView = 'three-quarter', userOrbited = false;

// The control bar covers the bottom of the screen and, on wide screens, the open panel covers the left,
// so the camera renders part of a larger virtual image (setViewOffset): the target lands in the middle
// of the free area, not behind them.
const barEl = document.querySelector('.bar'), panelEl = document.getElementById('panel');
let barReserve = 0, panelReserve = 0;

function fitDistance(v) {
  const w = window.innerWidth, h = window.innerHeight, full = h + barReserve, k = rig?.scale ?? 1;
  const tanV = Math.tan((camera.fov * DEG) / 2);
  return k * Math.max((v.hw * full) / ((w - panelReserve) * tanV), (v.hh * full) / ((h - barReserve) * tanV));
}

/* =====================================================================
   9. State (horse + the viewer's tweaks, location, gait), loop, hook, UI
   ===================================================================== */
const ROSTER = (window.HORSES ?? []).filter((h) => h && h.id && h.coat).sort((a, b) => (a.born ?? 9999) - (b.born ?? 9999) || a.en.localeCompare(b.en));
const STUDIO = { id: 'studio-bay', en: 'Studio bay', jp: '', studio: true, coat: { key: 'kage' }, face: { type: 'blaze' }, legs: { RH: 'sock' }, size: {} };
const HORSE_LIST = [...ROSTER, STUDIO];
const LOC_LIST = (window.LOCATIONS ?? []).filter((l) => l && l.id && GROUND[l.builder]);
if (!LOC_LIST.length) LOC_LIST.push({ id: 'country', en: 'Countryside trail', builder: 'country', group: 'Strolling', gait: 'gallop', W: 65 });
const STYLES = { nige: ['逃げ', 'Front-runner'], senko: ['先行', 'Stalker'], sashi: ['差し', 'Closer'], oikomi: ['追込', 'Deep closer'] };
const MARKS = { none: 'None', star: 'Star', stripe: 'Stripe', 'star-stripe': 'Star + stripe', blaze: 'Blaze', 'wide-blaze': 'Wide blaze', bald: 'Bald face', snip: 'Snip', 'star-snip': 'Star + snip', 'star-stripe-snip': 'Star, stripe + snip' };
const LEG_MARKS = { none: 'None', coronet: 'Coronet', pastern: 'Pastern', fetlock: 'Fetlock', sock: 'Sock', stocking: 'Stocking' };
const SEX = { male: 'colt', female: 'filly', gelding: 'gelding' };

const state = { horse: HORSE_LIST[0], custom: {}, loc: LOC_LIST[0], gait: 'gallop', lead: 'L' };
let rig = null, world = null, extras = [], wireOn = false;
let loopPhase = 0, playing = true, speed = 1;

// Race-day tack on a racecourse: the saddle cloth (white with a black number, as in JRA races) over a black
// saddle and white girth. `saddleNumber` (the horse's number in its signature race) is optional data.
// Cloth colours follow the location's signature race (`loc.saddleCloth`): JRA G1 = 紫紺 with white text, the
// classics = 紫紺 with yellow, the Derby = white with black and gold edging; ordinary races white with black.
function saddleFor(h, loc) {
  const c = { cloth: '#3a2a96', ink: '#ffffff', ...(loc.saddleCloth ?? {}) };
  return { ...c, number: h.saddleNumber ?? null, label: h.jp };
}

// Conformation from the profile: explicit `conf` wins; otherwise a gentle default from `size.build`.
const BUILD_CONF = { rangy: { neck: 1.04 }, tall: { neck: 1.03 }, compact: { neck: 0.97 }, heavy: { neck: 0.98, crest: 1.1 } };
function confFor(h) {
  return { ...(BUILD_CONF[h.size?.build] ?? {}), ...(h.conf ?? {}) };
}

// A roster horse with the viewer's overrides on top, as a buildHorse() look.
function currentLook() {
  const h = state.horse, c = state.custom;
  return {
    coat: { ...h.coat, ...c.coat },
    face: c.face ?? h.face?.type ?? 'none',
    legs: { ...h.legs, ...c.legs },
    size: { ...h.size, ...c.size },
    maneLen: c.maneLen ?? h.maneLen ?? 1,
    tailLen: c.tailLen ?? h.tailLen ?? 1,
    gear: c.gearOff ? null : h.gear ?? null,
    conf: { ...confFor(h), ...(c.conf ?? {}) },
    racehorse: !!h.silks, // racehorses get a bridle unless their gear says otherwise
    saddle: !c.gearOff && h.silks && (state.loc?.builder === 'track' || state.loc?.builder === 'paddock') ? saddleFor(h, state.loc) : null,
  };
}

function disposeTree(root) {
  const mats = new Set();
  root.traverse((o) => {
    o.geometry?.dispose();
    if (o.material) [].concat(o.material).forEach((m) => mats.add(m));
    if (o.isInstancedMesh) o.dispose();
    if (o.isSkinnedMesh) o.skeleton.dispose();
  });
  mats.forEach((m) => { m.map?.dispose(); m.dispose(); }); // the saddle cloth has its own canvas texture
}

function rebuildHorse() {
  if (rig) { scene.remove(rig.root); disposeTree(rig.root); }
  rig = buildHorse(currentLook());
  rig.materials.forEach((m) => { m.wireframe = wireOn; });
  scene.add(rig.root);
  setGait(state.gait);
}

// Gait of the hero (and the companions walking with it); the loop length follows the hero.
function setGait(key) {
  state.gait = GAITS[key] && !GAITS[key].stand ? key : 'gallop';
  const gaitFor = (r) => Object.assign(makeGait(state.gait, r.scale, W, state.lead), world?.path ? { path: world.path } : {});
  if (rig) {
    rig.gait = gaitFor(rig);
    loopPeriod = rig.gait.period;
  }
  for (const ex of extras) if (ex.mode === 'companion' || ex.mode === 'parade') ex.rigs[0].gait = gaitFor(ex.rigs[0]);
  syncBar();
  writeHash();
}

const blobGeo = new THREE.CircleGeometry(1, 12).rotateX(-Math.PI / 2);
const blobMat = new THREE.MeshBasicMaterial({ color: 0x1b140f, transparent: true, opacity: 0.22, depthWrite: false });
function blobShadow() {
  const m = new THREE.Mesh(blobGeo, blobMat);
  m.scale.set(1.05, 1, 0.42);
  m.position.set(0.05, 0.02, 0);
  return m;
}

// Background horses (generic coats). Companions walk beside the hero at its speed, so they never need
// wrapping; grazers stand on the scrolling ground and are drawn once per scenery copy, like the props.
function clearExtras() {
  for (const ex of extras) for (const r of ex.rigs) { r.root.parent?.remove(r.root); disposeTree(r.root); }
  extras = [];
}
function spawnExtras() {
  clearExtras();
  const rnd = mulberry32(4242);
  if (world.path && state.loc.runners) {
    // the rest of the field walks the ring in number order (馬番順), evenly spaced: the horse ahead carries the
    // next number down. Generic coats; the location's saddle cloth with the number only.
    const N = clamp(state.loc.runners, 2, 18), gap = W / N, mine = state.horse.saddleNumber ?? 1, cloth = saddleFor(state.horse, state.loc);
    for (let j = 1; j < N; j++) {
      const look = { ...genericLook(rnd), racehorse: true, saddle: { ...cloth, number: ((mine - 1 - j) % N + N) % N + 1, label: '' } };
      const r = buildHorse(look, 700 + j * 13);
      r.phaseOffset = rnd();
      r.root.traverse((o) => { o.castShadow = false; }); // outside the shadow map: a soft blob instead
      r.root.add(blobShadow());
      r.materials.forEach((m) => { m.wireframe = wireOn; });
      world.group.add(r.root);
      extras.push({ mode: 'parade', ahead: j * gap, rigs: [r], phase: rnd() });
    }
  }
  (state.loc.extras ?? []).forEach((spec, n) => {
    const look = genericLook(rnd), seed = 900 + n * 17, phaseOffset = rnd(), grazer = spec.mode === 'grazer';
    const rigs = [];
    for (let c = 0; c < (grazer ? COPIES : 1); c++) {
      const r = buildHorse(look, seed);
      r.phaseOffset = phaseOffset;
      r.gait = makeGait(grazer ? 'stand' : state.gait, r.scale, W, state.lead);
      r.root.rotation.y = spec.rotY ?? 0;
      r.root.position.set(spec.x, grazer ? world.ground.heightAt(spec.x, spec.z) : 0, spec.z);
      if (grazer) {
        r.root.traverse((o) => { o.castShadow = false; }); // a scrolling caster would pop at the shadow map's edge
        r.root.add(blobShadow());
      }
      r.materials.forEach((m) => { m.wireframe = wireOn; });
      scene.add(r.root);
      rigs.push(r);
    }
    extras.push({ ...spec, rigs, phase: rnd() });
  });
  // the shadow map covers the hero, plus any companion
  const reach = 2.8 + Math.max(0, ...extras.filter((e) => e.mode === 'companion').map((e) => Math.hypot(e.x, e.z)));
  Object.assign(sun.shadow.camera, { left: -reach, right: reach, top: reach, bottom: -reach, near: 4, far: 26 });
  sun.shadow.camera.updateProjectionMatrix();
}

function setLocation(id) {
  const loc = LOC_LIST.find((l) => l.id === id) ?? LOC_LIST[0];
  clearExtras();
  if (world) { scene.remove(world.group, world.statics); disposeTree(world.group); disposeTree(world.statics); }
  state.loc = loc;
  world = buildWorld(loc);
  scene.add(world.group, world.statics);
  const t = loc.time ?? {};
  scene.fog = new THREE.Fog(hex(world.sky.horizon), world.fog[0], world.fog[1]);
  scene.background = colorOf(world.sky.horizon);
  hemi.color.set(hex(t.hemiSky ?? 0xdfe6f0));
  hemi.groundColor.set(hex(t.hemiGround ?? 0x8a7550));
  hemi.intensity = t.hemiIntensity ?? 1.25;
  const flood = world.night ? loc.floodlights ?? {} : null; // banks of lamps on both sides light the horse at night
  sun.color.set(hex(flood ? flood.color ?? '#f4f2ea' : t.sunColor ?? 0xffe7c4));
  sun.intensity = flood ? 2.6 * (flood.intensity ?? 1) : t.sunIntensity ?? 2.9;
  sun.position.copy(world.sunDir).multiplyScalar(14);
  fill.position.set(-world.sunDir.x, Math.max(0.35, world.sunDir.y), -world.sunDir.z).multiplyScalar(14);
  fill.color.set(hex(flood ? flood.color ?? '#f4f2ea' : 0xdfe8f4));
  fill.intensity = flood ? 1.1 * (flood.intensity ?? 1) : t.fillIntensity ?? 0.55;
  renderer.toneMappingExposure = t.exposure ?? 1.02;
  document.body.classList.toggle('night', world.night);
  dust.on = loc.dust !== null;
  dust.setColor(loc.dust ?? PAL.dust);
  // on a beach the kick-up follows the surface under each hoof: splashes in the sea, clods off wet sand, dust off dry sand
  if (loc.builder === 'beach') {
    const Y = beachLayout(loc);
    dust.colors = { dust: loc.dust ?? loc.sand?.dry ?? PAL.dust, clods: loc.sand?.wet ?? '#8f7d63', splash: loc.sea?.foam ?? '#e8ecea' };
    dust.styleAt = (z) => (Y.toSea(z) > 0 || world.surf?.wet(z) ? 'splash' : Y.toSea(z) > -Y.wetW ? 'clods' : 'dust');
  } else { dust.colors = null; dust.styleAt = null; }
  state.lead = loc.lead ?? 'L';
  // the saddle and cloth only appear on racecourses: rebuild the hero if that changes
  if (rig && !!rig.root.getObjectByName('saddle') !== !!currentLook().saddle) rebuildHorse();
  spawnExtras();
  setGait(loc.gait ?? 'gallop');
  syncTitle();
  if ($('locSel')) $('locSel').value = loc.id;
  setView(currentView);
}

function setHorse(id) {
  state.horse = HORSE_LIST.find((h) => h.id === id) ?? HORSE_LIST[0];
  state.custom = {};
  rebuildHorse();
  if (world?.path) { spawnExtras(); setGait(state.gait); } // the field renumbers round the hero
  syncTitle();
  syncPanel();
  setView(currentView);
}

// Path mode: the hero stays at the origin facing +X, so the ring is moved and turned the other way under it;
// the far scenery and the sun turn with the ring (shadows and shading follow the horse round the bends).
function placeOnPath(s) {
  const f = world.path.at(s), c = Math.cos(f.phi), sn = Math.sin(f.phi), turn = (v) => V(v.x * c - v.z * sn, v.y, v.x * sn + v.z * c);
  world.group.rotation.y = -f.phi;
  world.group.position.set(-(f.x * c - f.z * sn), 0, -(f.x * sn + f.z * c));
  world.group.updateMatrix();
  world.group.matrixWorld.copy(world.group.matrix);
  world.statics.rotation.y = -f.phi;
  const d = world.sunDir;
  sun.position.copy(turn(d)).multiplyScalar(14);
  fill.position.copy(turn(V(-d.x, Math.max(0.35, d.y), -d.z))).multiplyScalar(14);
}

function applyPhase(p) {
  const g = wrap01(p * rig.gait.strides), scroll = p * W;
  if (world.path) { placeOnPath(scroll); rig.gait.pathS = scroll; }
  pose(rig, g, p);
  if (!world.path) {
    world.ground.mesh.position.x = -(COPIES / 2) * W - scroll;
    updateProps(world.props, scroll);
    world.surf?.update(p, scroll);
    world.prints?.update(p, rig, world.ground.heightAt, scroll);
  }
  updateDust(dust, g, rig);
  for (const ex of extras) {
    ex.rigs.forEach((r, c) => {
      if (ex.mode === 'grazer') r.root.position.x = wrapCentered(ex.x - W / 2 - scroll) + (c - (COPIES - 1) / 2) * W;
      if (ex.mode === 'parade') { // walking the ring ahead of the hero, on the ring's own ground
        const s = scroll + ex.ahead, f = world.path.at(s);
        r.root.position.set(f.x, 0, f.z);
        r.root.rotation.y = f.phi;
        r.gait.pathS = s;
      }
      pose(r, wrap01(p * r.gait.strides + ex.phase), p);
    });
  }
}
function renderNow() { renderer.render(scene, camera); }

function setView(name) {
  const v = VIEWS[name];
  if (!v) return;
  currentView = name;
  userOrbited = false;
  controls.enableDamping = false;
  controls.update(); // flush any pending damped motion
  const k = rig?.scale ?? 1, target = V(v.tx * k, TARGET_Y * k, 0), dir = V(...v.dir);
  dir.z *= world ? (world.path ? -world.S : world.S) : 1; // in a paddock the camera stands on the centre lawn, looking out at the crowd
  camera.position.copy(target).addScaledVector(dir.normalize(), fitDistance(v));
  controls.target.copy(target);
  controls.update();
  controls.enableDamping = true;
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === name));
  if (rig && world) renderNow();
}
// Hook: jump to loop phase p and hold it (shown as paused in the UI); resume() plays on from there.
function setPhase(p) {
  setPlaying(false);
  loopPhase = wrap01(p);
  applyPhase(loopPhase);
  renderNow();
}
function resume() { setPlaying(true); }

// World position of a hoof's toe (for slip checks): the front of the sole, in the hoof joint's frame.
function toeWorld(id, r = rig) {
  const L = r.legs.find((l) => l.id === id);
  return L.hoof.localToWorld(V(HOOF_TOE, SOLE - COFFIN_Y, 0));
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  barReserve = clamp(Math.round(h - barEl.getBoundingClientRect().top), 0, h / 3);
  document.documentElement.style.setProperty('--bar-h', `${barReserve}px`);
  const wide = w >= 900;
  panelReserve = wide && !panelEl.hidden ? Math.round(panelEl.getBoundingClientRect().right + 8) : 0;
  camera.fov = w < h ? 46 : 32;
  camera.aspect = (w + panelReserve) / (h + barReserve);
  camera.setViewOffset(w + panelReserve, h + barReserve, 0, barReserve, w, h); // also updates the projection
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // may change when the window moves between screens
  renderer.setSize(w, h);
  controls.maxDistance = Math.max(18, fitDistance(VIEWS.side) * 1.4);
  if (!userOrbited) setView(currentView);
}
window.addEventListener('resize', resize);
controls.addEventListener('start', () => { userOrbited = true; });

// ----- panel: pickers, the horse's card, coat / markings / build controls -----
function buildPickers() {
  const hs = $('horseSel'), years = new Map();
  for (const h of ROSTER) {
    const label = `Born ${h.bornApprox ? 'c.' : ''}${h.born}`;
    if (!years.has(label)) years.set(label, el('optgroup', { label }));
    years.get(label).append(el('option', { value: h.id, textContent: `${h.en}　${h.jp}` }));
  }

    if (!groups.has(name)) groups.set(name, el('optgroup', { label: name }));

  const sw = $('coatSwatches');

    b.dataset.coat = key;
    b.style.background = toCss(c.grey ? 0xb8b5b0 : c.coat);

    sw.append(b);
  }
  $('greyness').addEventListener('input', (e) => tweak((x) => { x.coat = { ...x.coat, greyness: +e.target.value }; }));
  $('dapple').addEventListener('input', (e) => tweak((x) => { x.coat = { ...x.coat, dapple: +e.target.value }; }));

  $('weight').addEventListener('input', (e) => tweak((x) => { x.size = { ...x.size, typicalKg: +e.target.value, weightKg: null }; }));

  }
  $('maneLen').addEventListener('input', (e) => tweak((x) => { x.maneLen = +e.target.value; }));
  $('tailLen').addEventListener('input', (e) => tweak((x) => { x.tailLen = +e.target.value; }));
  $('gearOn').addEventListener('change', (e) => tweak((x) => { x.gearOff = !e.target.checked; }));
  $('resetLook').addEventListener('click', () => { state.custom = {}; rebuildHorse(); syncPanel(); });
}

// Apply a tweak to the viewer's overrides; rebuild the horse at most once per frame.
let pendingRebuild = 0;
function tweak(fn, editing = null) {
  fn(state.custom);
  if (pendingRebuild) return;
  pendingRebuild = requestAnimationFrame(() => {
    pendingRebuild = 0;
    rebuildHorse();
    syncPanel(editing);
  });
}

function sizeText(s = {}) {
  const kg = s.weightKg ? `${s.weightKg[0]}–${s.weightKg[1]} kg` : s.typicalKg ? `${Math.round(s.typicalKg)} kg` : null;
  return [kg, s.withersCm ? `${s.withersCm} cm at the withers` : null, s.build].filter(Boolean).join(' · ') || '—';
}
function markingText(h) {
  const legs = Object.entries(h.legs ?? {}).filter(([, v]) => v && v !== 'none').map(([k, v]) => `${k} ${LEG_MARKS[v]?.toLowerCase() ?? v}`);
  return [MARKS[h.face?.type ?? 'none'], legs.length ? `white ${legs.join(', ')}` : null].filter(Boolean).join('; ');
}
function renderCard() {
  const h = state.horse, card = $('horseCard');
  card.replaceChildren();
  if (h.studio) {
    card.append(el('p', { className: 'note', textContent: 'The original studio horse, not a roster horse. Customize it freely.' }));
    return;
  }
  const c = COATS[h.coat.key] ?? COATS.kage, st = STYLES[h.style?.primary];
  const rows = [
    ['Born', [`${h.bornApprox ? 'c. ' : ''}${h.born}`, SEX[h.sex], h.realName ? `real name ${h.realName}` : null].filter(Boolean).join(' · ')],
    ['Coat', `${h.coat.reg ?? c.jp} · ${c.en}${h.coat.key === 'ashige' && h.coat.greyness != null ? ` (${Math.round(h.coat.greyness * 100)}% grey)` : ''}`],
    ['Markings', markingText(h)],
    ['Style', st ? `${st[0]} ${st[1]}${h.style.secondary && STYLES[h.style.secondary] ? ` / ${STYLES[h.style.secondary][1].toLowerCase()}` : ''}` : 'n/a (never raced)'],
    ['Size', sizeText(h.size)],
    ['Gear', Object.entries({ hood: 'hood (メンコ)', blinkers: 'blinkers', shadowRoll: 'shadow roll', bitLifter: 'bit-lifter (ハミ吊り)', pompom: 'poll pompom', bandages: 'leg bandages' }).filter(([k]) => h.gear?.[k]).map(([, v]) => v).join(', ') || 'none noted'],
    ['Silks', h.silks?.desc || '—'],
    ['Career', h.career || '—'],
  ];
  const dl = el('dl');
  for (const [k, v] of rows) dl.append(el('dt', { textContent: k }), el('dd', { textContent: v }));
  if (h.style?.why) dl.children[7].title = h.style.why;
  card.append(dl);
  if (h.uncertain?.length) card.append(el('p', { className: 'note', textContent: `Unconfirmed: ${h.uncertain.join(', ')}` }));
  if (h.sources?.length) {
    const p = el('p', { className: 'note' }, ['Sources: ']);
    h.sources.slice(0, 4).forEach((u, i) => {
      let host = u;
      try { host = new URL(u).hostname.replace(/^www\./, ''); } catch { /* keep the raw string */ }
      p.append(i ? ', ' : '', el('a', { href: u, target: '_blank', rel: 'noopener', textContent: host }));
    });
    card.append(p);
  }
}

function syncPanel(editing = null) {
  const look = currentLook(), pal = rig.pal;
  $('horseSel').value = state.horse.id;
  renderCard();
  $('resetLook').textContent = `Reset to ${state.horse.en}`;
  document.querySelectorAll('[data-coat]').forEach((b) => b.classList.toggle('on', b.dataset.coat === (look.coat.key ?? 'kage')));
  $('greyRow').hidden = $('dappleRow').hidden = look.coat.key !== 'ashige';
  $('greyness').value = look.coat.greyness ?? 0.5;
  $('dapple').value = pal.dapple ?? 0;
  $('gearOn').checked = !state.custom.gearOff;
  $('gearOn').disabled = !state.horse.gear;
  for (const [id, col] of [['cCoat', pal.coat], ['cMane', pal.mane], ['cLegs', pal.legs]]) if (id !== editing) $(id).value = toCss(col);
  $('faceSel').value = MARKS[look.face] ? look.face : 'none';
  for (const id of ['LF', 'RF', 'LH', 'RH']) $(`leg${id}`).value = look.legs[id] ?? 'none';
  const withers = look.size.withersCm ?? Math.round(REF_WITHERS * rig.scale), kg = look.size.typicalKg ?? (look.size.weightKg ? (look.size.weightKg[0] + look.size.weightKg[1]) / 2 : REF_KG);
  $('withers').value = withers;
  $('withersOut').textContent = `${withers} cm`;
  $('weight').value = Math.round(kg);
  $('weightOut').textContent = `${Math.round(kg)} kg`;
  $('maneLen').value = look.maneLen;
  $('confNeck').value = look.conf.neck ?? 1; $('confCrest').value = look.conf.crest ?? 1; $('confHead').value = look.conf.head ?? 1;
  $('confProfile').value = look.conf.profile ?? 0; $('confEars').value = look.conf.ears ?? 1;
  $('tailLen').value = look.tailLen;
}

/* ---------- start-up + main loop ---------- */
const timer = new THREE.Timer();
timer.connect(document);
buildPickers();
try { if (localStorage.getItem('lph-panel') === '1' || (localStorage.getItem('lph-panel') == null && window.innerWidth >= 900)) panelEl.hidden = false; } catch { panelEl.hidden = window.innerWidth < 900; }
panelBtn.setAttribute('aria-expanded', String(!panelEl.hidden));
panelBtn.classList.toggle('on', !panelEl.hidden);
const init = readHash();
state.horse = HORSE_LIST.find((h) => h.id === init.h) ?? HORSE_LIST[0];
rig = buildHorse(currentLook()); // sized first: the world's stride count depends on the horse's scale
scene.add(rig.root);
setLocation(LOC_LIST.find((l) => l.id === init.l)?.id ?? window.DEFAULT_LOCATION ?? LOC_LIST[0].id);
if (init.g && GAITS[init.g]) setGait(init.g);
syncTitle();
syncPanel();
setPlaying(true);
applyPhase(0); // pose the horse and place the props before resize() draws the first frame
resize();

renderer.setAnimationLoop((ts) => {
  timer.update(ts);
  const dt = Math.min(timer.getDelta(), 0.1);
  if (playing) loopPhase = wrap01(loopPhase + (dt * speed) / rig.gait.period);
  applyPhase(loopPhase);
  controls.update();
  renderNow();
});

window.__horse = {
  get period() { return rig.gait.period; },
  get strides() { return rig.gait.strides; },
  setPhase, resume, setView, setHorse, setLocation, setGait, toeWorld, gaits: GAITS, rebuild: () => rebuildHorse(),
  renderer, scene, camera, controls,
  get horse() { return rig.root; }, get rig() { return rig; }, get world() { return world; }, get extras() { return extras; }, state,
};
</script>
</body>
</html>
