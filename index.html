<style>
  :root {
    --ink: #3b2f27;
    --ink-soft: rgba(59, 47, 39, 0.62);
    --panel: rgba(255, 248, 238, 0.68);
    --edge: rgba(255, 255, 255, 0.6);
    --line: rgba(59, 47, 39, 0.13);

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #efcaa2; }
  body {
    font: 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(70, 40, 20, 0.16) 100%);
  }
  .title, .hint { text-shadow: 0 1px 10px rgba(255, 246, 234, 0.9), 0 0 2px rgba(255, 246, 234, 0.7); }
  .title { position: fixed; left: max(16px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); pointer-events: none; user-select: none; }
  .title h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: 0.02em; }
  .title p { margin: 2px 0 0; font-size: 11.5px; color: var(--ink-soft); letter-spacing: 0.02em; }
  .hint { position: fixed; right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); font-size: 11px; color: var(--ink-soft); pointer-events: none; user-select: none; }
  /* night locations: light text over the dark sky */
  body.night .title, body.night .hint { color: #f1ece4; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85); }
  body.night .title p, body.night .hint { color: #cfc8bd; }
  .bar {
    position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px;
    width: max-content; max-width: calc(100vw - 24px); padding: 6px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--edge);

  }
  button { font: inherit; color: inherit; border: 0; background: transparent; border-radius: 9px; padding: 7px 10px; cursor: pointer; line-height: 1; white-space: nowrap; }
  button:hover { background: rgba(59, 47, 39, 0.07); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .icon { width: 32px; height: 30px; padding: 0; display: grid; place-items: center; background: var(--ink); color: #fff8f0; }

  .seg { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: rgba(59, 47, 39, 0.06); }
  .seg button { padding: 6px 9px; }
  .seg button.on, #wire.on { background: #fffaf4; box-shadow: 0 1px 3px rgba(60, 40, 25, 0.18); font-weight: 600; }
  .speed { display: flex; align-items: center; gap: 7px; padding: 0 4px 0 6px; }

    max-height: calc(100vh - 64px - var(--bar-h, 64px) - 12px); overflow: auto; overscroll-behavior: contain;
    padding: 4px 12px 12px; border-radius: 14px;
    background: rgba(255, 249, 241, 0.86); border: 1px solid var(--edge);
    box-shadow: 0 6px 24px rgba(80, 50, 30, 0.14);

  }

  .panel select { width: 100%; min-width: 0; font: inherit; color: inherit; padding: 6px 8px; border-radius: 9px; border: 1px solid var(--line); background: #fffaf4; }
  .panel input[type=range] { width: 100%; min-width: 0; }
  .panel a { color: var(--accent); }
  .card dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin: 8px 0 0; font-size: 12px; }
  .card dt { color: var(--ink-soft); }
  .card dd { margin: 0; overflow-wrap: anywhere; }

  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .swatches button { aspect-ratio: 1; padding: 0; border-radius: 8px; border: 2px solid rgba(255, 255, 255, 0.8); box-shadow: 0 0 0 1px var(--line); }
  .swatches button.on { box-shadow: 0 0 0 2px var(--accent); }
  .row { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 8px; margin: 8px 0; font-size: 12px; }
  .row[hidden] { display: none; }
  .row > span { color: var(--ink-soft); }
  .row output { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; font-size: 11.5px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
  .row3 label, .legs label { display: grid; gap: 3px; font-size: 11px; color: var(--ink-soft); }
  input[type=color] { width: 100%; height: 28px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: #fffaf4; cursor: pointer; }
  .legs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .reset { margin-top: 12px; width: 100%; border: 1px solid var(--line); background: #fffaf4; }
  @media (max-width: 899px) {

  }
  @media (max-width: 560px) {
    /* one row on 375px phones: drop the separators and hint, keep "Speed" only for screen readers */
    .hint, .sep { display: none; }
    .bar { gap: 4px; padding: 5px; }
    .speed { gap: 5px; padding: 0 2px; }
    .speed span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    input[type=range] { width: 72px; }
    .seg button { padding: 6px 7px; }
    #wire { padding: 7px 8px; }
  }
</style>

<body>
<div class="vignette"></div>
<div class="title"><h1 id="hName">Gallop</h1><p id="hSub">procedural low-poly study &middot; seamless loop</p></div>

  <section>

  <section>

    <label class="row"><span>Weight</span><input id="weight" type="range" min="400" max="560" step="2"><output id="weightOut"></output></label>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   1. Loop timing and gaits
   The horse moves in place; the world scrolls under it. Everything is a
   pure function of the loop phase p in [0,1): gait phase g = frac(p*strides),
   ground scroll = p * W (the location's scenery repeats every W metres).
   makeGait() picks a whole number of strides per loop, so the hooves stay
   planted and the loop stays seamless for any horse size and location.
   ===================================================================== */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const BREAKOVER = 34 * DEG;         // heel lift at lift-off: the hoof rolls over its pinned toe
const BREAKOVER_START = 0.62;       // stance fraction where the heel starts to rise

// T: seconds per stride at 1x; stride: metres per stride (163 cm horse); duty: fraction of a stride
// each hoof is planted; land: gait phase at which each hoof touches down. fore/hind shape the swing.
const GAITS = {
  // transverse gallop, left lead: RH -> LH -> RF -> LF(lead) -> suspension
  gallop: {
    label: 'Gallop', T: 0.42, stride: 2.6, duty: 0.35, body: 'gallop', dust: true, curl: 1, leads: true,
    land: { RH: 0.0, LH: 0.1, RF: 0.3, LF: 0.41 },
    fore: { xc: 0.76, lift: 0.42, rise: 0.3, fall: 0.5, flex: 115 * DEG, flexPeak: 0.32, flexEnd: 0.8, sag: 14 * DEG, scapSwing: 10 * DEG },
    hind: { xc: -0.45, lift: 0.26, rise: 0.35, fall: 0.55, flex: 55 * DEG, flexPeak: 0.4, flexEnd: 0.88, sag: 12 * DEG, hockSag: 10 * DEG, hockOpen: -6 * DEG },
  },
  // racing gallop (~16 m/s): 7 m strides at ~2.3 strides/s, each hoof down for under a quarter of the
  // stride, a long suspension after the leading fore lifts. The reach comes from a lower body, more
  // scapular swing and lumbosacral flexion (BODY.race), so the stance can span ~1.6 m without the legs
  // running out of length.
  race: {
    label: 'Race', T: 0.43, stride: 7.0, duty: 0.2, body: 'race', dust: true, curl: 1, leads: true,
    land: { RH: 0.0, LH: 0.09, RF: 0.27, LF: 0.37 },
    fore: { xc: 0.62, lift: 0.5, rise: 0.25, fall: 0.55, flex: 125 * DEG, flexPeak: 0.3, flexEnd: 0.8, sag: 17 * DEG, scapSwing: 18 * DEG },
    hind: { xc: -0.55, lift: 0.36, rise: 0.3, fall: 0.6, flex: 70 * DEG, flexPeak: 0.38, flexEnd: 0.86, sag: 15 * DEG, hockSag: 12 * DEG, hockOpen: -8 * DEG, hockPush: 40 * DEG },
  },
  // working trot (~3.6 m/s): two-beat, the diagonal pairs (LF+RH, RF+LH) land together, a short suspension
  // between them; the head stays steady
  trot: {
    label: 'Trot', T: 0.72, stride: 2.6, duty: 0.4, body: 'trot', dust: true, curl: 0.8,
    land: { LF: 0.0, RH: 0.0, RF: 0.5, LH: 0.5 },
    fore: { xc: 0.68, lift: 0.22, rise: 0.3, fall: 0.6, flex: 88 * DEG, flexPeak: 0.4, flexEnd: 0.85, sag: 12 * DEG, scapSwing: 8 * DEG },
    hind: { xc: -0.5, lift: 0.18, rise: 0.3, fall: 0.6, flex: 52 * DEG, flexPeak: 0.42, flexEnd: 0.88, sag: 10 * DEG, hockSag: 8 * DEG, hockOpen: -4 * DEG },
  },
  // working canter (~5 m/s): three-beat, left lead: RH -> (LH + RF together) -> LF (lead) -> suspension;
  // the body rocks like a rocking horse (forehand up as the hind legs land)
  canter: {
    label: 'Canter', T: 0.6, stride: 3.0, duty: 0.38, body: 'canter', dust: true, curl: 0.9, leads: true,
    land: { RH: 0.0, LH: 0.27, RF: 0.27, LF: 0.5 },
    fore: { xc: 0.64, lift: 0.28, rise: 0.3, fall: 0.55, flex: 100 * DEG, flexPeak: 0.36, flexEnd: 0.82, sag: 13 * DEG, scapSwing: 9 * DEG },
    hind: { xc: -0.52, lift: 0.22, rise: 0.33, fall: 0.58, flex: 52 * DEG, flexPeak: 0.4, flexEnd: 0.88, sag: 11 * DEG, hockSag: 10 * DEG, hockOpen: -5 * DEG },
  },
  // four-beat lateral walk: LH -> LF -> RH -> RF, evenly spaced; the hind print lands just past the fore print
  walk: {
    label: 'Walk', T: 1.1, stride: 1.6, duty: 0.6, body: 'walk', dust: false, curl: 0.6,
    land: { LH: 0.0, LF: 0.25, RH: 0.5, RF: 0.75 },
    // stance centred under the shoulder / hip: the legs keep >= 2.5% reach in hand at every phase
    fore: { xc: 0.64, lift: 0.14, rise: 0.3, fall: 0.6, flex: 65 * DEG, flexPeak: 0.4, flexEnd: 0.85, sag: 10 * DEG, scapSwing: 7 * DEG },
    hind: { xc: -0.58, lift: 0.12, rise: 0.3, fall: 0.6, flex: 35 * DEG, flexPeak: 0.4, flexEnd: 0.85, sag: 8 * DEG, hockSag: 6 * DEG, hockOpen: -4 * DEG },
  },
  // standing square (grazing / idling background horses): every hoof planted at its rest spot
  stand: {
    label: 'Stand', T: 1.1, stride: 0, duty: 1, body: 'graze', dust: false, stand: true, curl: 0,
    land: { LH: 0, LF: 0, RH: 0, RF: 0 },
    fore: { xc: 0.56, sag: 0, scapSwing: 0 }, hind: { xc: -0.56, sag: 0, hockSag: 0, hockOpen: 0 },
  },
};
const RIGHT_LEAD = { RH: 'LH', LH: 'RH', RF: 'LF', LF: 'RF' };

// Gait instance for one horse: scale s (uniform), scenery period W (m), lead 'L' | 'R'.
function makeGait(key, s = 1, W = 65, lead = 'L') {
  const base = GAITS[key] || GAITS.gallop;
  const land = { ...base.land };
  if (base.leads && lead === 'R') for (const id in RIGHT_LEAD) land[id] = base.land[RIGHT_LEAD[id]];
  if (base.stand) return { ...base, key, land, lead, strides: 1, stride: 0, stanceLen: 0, period: base.T * 20 };
  const strides = Math.max(1, Math.round(W / (base.stride * s)));
  const stride = W / strides / s;                       // horse units (the rig is scaled by s)
  return { ...base, key, land, lead, strides, stride, scale: s, stanceLen: stride * base.duty, period: strides * base.T };
}

/* =====================================================================
   2. Palettes. Coats are keyed by the Japanese registry colour (JBIS 毛色); a horse profile picks one
   and may override coat / mane / points. `points: null` = no black points (the chestnut family).
   ===================================================================== */
const COATS = {
  kage: { en: 'Bay', jp: '鹿毛', coat: 0x7b3a1f, hi: 0x91492a, lo: 0x5c2a17, points: 0x221915, mane: 0x1c1411, muzzle: 0x35261f, hoof: 0x2e2825 },
  kurokage: { en: 'Dark bay', jp: '黒鹿毛', coat: 0x4c2616, hi: 0x5f321e, lo: 0x351a0f, points: 0x1c1512, mane: 0x161110, muzzle: 0x3b261b, hoof: 0x2a2421 },
  aokage: { en: 'Brown', jp: '青鹿毛', coat: 0x2c1d17, hi: 0x3b2920, lo: 0x1e1411, points: 0x171210, mane: 0x120e0d, muzzle: 0x4b3123, hoof: 0x282220 },
  ao: { en: 'Black', jp: '青毛', coat: 0x1b1716, hi: 0x2d2a29, lo: 0x121010, points: 0x151211, mane: 0x100d0c, muzzle: 0x231d1b, hoof: 0x262220 },
  kuri: { en: 'Chestnut', jp: '栗毛', coat: 0xa4522a, hi: 0xb96334, lo: 0x7f3b1d, points: null, mane: 0x93441f, muzzle: 0x6f3b25, hoof: 0x3a2f28 },
  tochikuri: { en: 'Liver chestnut', jp: '栃栗毛', coat: 0x5f2d19, hi: 0x713a22, lo: 0x46210f, points: null, mane: 0x7a4527, muzzle: 0x3b2318, hoof: 0x2e2622 },
  ashige: { en: 'Grey', jp: '芦毛', grey: true, coat: 0x8e8b88, hi: 0xa5a29e, lo: 0x6e6b69, points: 0x3a3634, mane: 0x6b6764, muzzle: 0x2b2524, hoof: 0x34302d },
  shiroge: { en: 'White', jp: '白毛', coat: 0xefebe4, hi: 0xfaf7f1, lo: 0xd6d0c6, points: null, mane: 0xf3efe8, muzzle: 0xd8aaa0, hoof: 0xa89a88 },
};
const WHITE = 0xf1e9dc, HOOF_PALE = 0x9a8a78;
const hex = (v) => (typeof v === 'string' ? parseInt(v.replace('#', ''), 16) : v);
const toCss = (v) => `#${new THREE.Color(v).getHexString()}`;

// Resolve a profile's coat into concrete colours. Greys interpolate from iron grey to near white by
// `greyness`; `tone` (-1..1) lightens or darkens within the class; explicit hex overrides win.
function horsePalette(coat = {}) {
  const base = COATS[coat.key] || COATS.kage;
  const c = (v) => new THREE.Color(v);
  const p = { coat: c(base.coat), hi: c(base.hi), lo: c(base.lo), points: base.points == null ? null : c(base.points),
    mane: c(base.mane), muzzle: c(base.muzzle), hoof: c(base.hoof), grey: base.grey ? (coat.greyness ?? 0.5) : null };
  if (p.grey != null) {
    const g = clamp(p.grey, 0, 1);
    // greying is slow at first: 0.2 still reads as dark iron grey, 0.5 as a dappled mid grey
    p.coat = c(0x4f4d4d).lerp(c(0xe6e3dd), g ** 1.35);
    p.points = c(0x2c2928).lerp(c(0xa9a49d), g * g);
    p.mane = c(0x302c2a).lerp(c(0xd9d4cc), g);
    // dapples are strongest on a mid grey and fade out as the horse goes iron-dark or white;
    // a young grey's head whitens first, while its lower legs stay dark the longest
    p.dapple = clamp(coat.dapple ?? 3.2 * g * (1 - g), 0, 1);
    p.headLift = coat.headLift ?? 0.09 * (1 - g); // some greys (Biwa Hayahide) had a face far paler than the body
  }
  if (coat.coatHex) p.coat = c(hex(coat.coatHex));
  if (p.grey != null || coat.coatHex) {
    p.hi = p.coat.clone().offsetHSL(0, 0, 0.055);
    p.lo = p.coat.clone().offsetHSL(0, 0, -0.07);
  }
  const t = clamp(coat.tone ?? 0, -1, 1) * 0.06;
  if (t) for (const k of ['coat', 'hi', 'lo']) p[k].offsetHSL(0, 0, t);
  if (coat.mane) p.mane = c(hex(coat.mane));
  if (coat.pointsHex) p.points = c(hex(coat.pointsHex));
  p.legs = p.points ?? p.lo.clone().offsetHSL(0, 0, -0.02); // lower-leg colour
  const alt = (col) => col.clone().offsetHSL(0, 0, col.getHSL({}).l > 0.5 ? -0.05 : 0.03);

// Dapples: soft light rings around jittered cell centres (3D cellular noise, cells ~0.16 m), sampled
// at each face centroid. Returns the distance to the nearest centre in cell units (~0 centre .. ~1 edge).
const DAPPLE_CELL = 0.16;
const hash3 = (i, j, k, s) => {
  let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(k, 1440662683) ^ Math.imul(s, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
function dappleAt(p) {
  const x = p.x / DAPPLE_CELL, y = p.y / DAPPLE_CELL, z = p.z / DAPPLE_CELL;
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  let best = 9;
  for (let i = ix - 1; i <= ix + 1; i++) for (let j = iy - 1; j <= iy + 1; j++) for (let k = iz - 1; k <= iz + 1; k++) {
    const dx = i + 0.15 + 0.7 * hash3(i, j, k, 1) - x, dy = j + 0.15 + 0.7 * hash3(i, j, k, 2) - y, dz = k + 0.15 + 0.7 * hash3(i, j, k, 3) - z;
    best = Math.min(best, dx * dx + dy * dy + dz * dz);
  }
  return Math.sqrt(best);
}

// Split every triangle into 4 coplanar ones, `levels` times. The faceted silhouette and shading stay the
// same; only the colour resolution goes up (used to paint dapples finer than the low-poly facets).
function subdivide(geo, levels = 1) {
  let src = (geo.index ? geo.toNonIndexed() : geo).attributes.position.array;
  for (let l = 0; l < levels; l++) {
    const out = new Float32Array(src.length * 4);
    let o = 0;
    const put = (v) => { out[o++] = v[0]; out[o++] = v[1]; out[o++] = v[2]; };
    for (let i = 0; i < src.length; i += 9) {
      const a = [src[i], src[i + 1], src[i + 2]], b = [src[i + 3], src[i + 4], src[i + 5]], c = [src[i + 6], src[i + 7], src[i + 8]];
      const mid = (u, v) => [(u[0] + v[0]) / 2, (u[1] + v[1]) / 2, (u[2] + v[2]) / 2];
      const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a);
      for (const t of [[a, ab, ca], [ab, b, bc], [ca, bc, c], [ab, bc, ca]]) t.forEach(put);
    }
    src = out;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(src, 3));
  return g;
}

const closeProfile = (half) => [...half, ...half.slice(1, -1).reverse().map(([s, u]) => [-s, u])];
const PROF = {

// A ring of points around centre c, perpendicular to tangent T. `up` is the profile's +u direction
// (projected off T); +side = T x up. d: {up, down, w, wUp, wDown} half extents.
function ringAt(c, T, upHint, prof, d) {
  const t = T.clone().normalize();
  const U = upHint.clone().addScaledVector(t, -upHint.dot(t)).normalize();
  const S = new THREE.Vector3().crossVectors(t, U);
  const wUp = d.wUp ?? d.w, wDown = d.wDown ?? d.w;
  return prof.map(([s, u]) => {
    const w = u >= 0 ? lerp(d.w, wUp, u) : lerp(d.w, wDown, -u);
    return c.clone().addScaledVector(S, s * w).addScaledVector(U, u * (u >= 0 ? d.up : d.down));

// Connect rings (clockwise when looking along the path) into a tube; optional pointed/flat caps.
function loft(rings, capA, capB) {
  const n = rings[0].length, pos = [], idx = [];
  rings.forEach((r) => r.forEach((p) => pos.push(p.x, p.y, p.z)));
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < n; j++) {
      const a = i * n + j, b = i * n + ((j + 1) % n), c = a + n, d = b + n;
      idx.push(a, b, c, b, d, c);
    }

    const k = pos.length / 3; pos.push(capA.x, capA.y, capA.z);
    for (let j = 0; j < n; j++) idx.push(k, (j + 1) % n, j);
  }

    const k = pos.length / 3, o = (rings.length - 1) * n; pos.push(capB.x, capB.y, capB.z);
    for (let j = 0; j < n; j++) idx.push(k, o + j, o + ((j + 1) % n));

  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));

}

// Deterministic vertex jitter. Coincident vertices get the same offset so seams stay closed.
function jitter(geo, amt, seed, keep = () => false) {
  const pos = geo.attributes.position, rnd = mulberry32(seed), seen = new Map();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    if (keep(x, y, z)) continue;
    const key = `${x.toFixed(4)}|${y.toFixed(4)}|${z.toFixed(4)}`;
    if (!seen.has(key)) seen.set(key, [(rnd() - 0.5) * 2 * amt, (rnd() - 0.5) * 2 * amt, (rnd() - 0.5) * 2 * amt]);
    const o = seen.get(key);
    pos.setXYZ(i, x + o[0], y + o[1], z + o[2]);
  }
  return geo;
}

// Split into flat triangles and give every face one colour: fn(centroid, normal, faceIndex) -> Color.
function paint(geo, fn) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3);
  const a = V(0, 0), b = V(0, 0), c = V(0, 0), cen = V(0, 0), nrm = V(0, 0), e = V(0, 0);
  for (let i = 0; i < pos.count; i += 3) {
    a.fromBufferAttribute(pos, i); b.fromBufferAttribute(pos, i + 1); c.fromBufferAttribute(pos, i + 2);
    cen.copy(a).add(b).add(c).multiplyScalar(1 / 3);
    nrm.subVectors(b, a).cross(e.subVectors(c, a)).normalize();
    const k = fn(cen, nrm, i / 3);
    for (let v = 0; v < 3; v++) col.set([k.r, k.g, k.b], (i + v) * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}

// Concatenate non-indexed geometries that share the same attribute set.
function merge(geos) {
  const out = new THREE.BufferGeometry();
  for (const name of Object.keys(geos[0].attributes)) {
    const src = geos.map((g) => g.attributes[name]);
    const arr = new src[0].array.constructor(src.reduce((n, a) => n + a.array.length, 0));
    let o = 0;
    for (const a of src) { arr.set(a.array, o); o += a.array.length; }
    out.setAttribute(name, new THREE.BufferAttribute(arr, src[0].itemSize));
  }
  return out;
}

// gentle guess from race weight; `bulk` widens trunk, neck and upper limbs for heavier horses.
// Saddle cloth (ゼッケン) artwork: background, a big number and an optional small label, on a canvas.
function saddleClothTexture(S) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = S.cloth ?? '#f4f4f0'; g.fillRect(0, 0, 512, 256);
  if (S.edge) { g.strokeStyle = S.edge; g.lineWidth = 12; g.strokeRect(6, 6, 500, 244); }
  g.fillStyle = S.ink ?? '#141414'; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (S.number != null) { g.font = '700 132px system-ui, sans-serif'; g.fillText(String(S.number), 256, 100); }
  if (S.label) { g.font = '600 38px system-ui, sans-serif'; g.fillText(S.label, 256, S.number != null ? 208 : 150); }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}

const REF_WITHERS = 163, REF_KG = 475;
function buildFactors(size = {}) {
  const kg = size.typicalKg ?? (size.weightKg ? (size.weightKg[0] + size.weightKg[1]) / 2 : null);
  const s = size.withersCm ? clamp(size.withersCm / REF_WITHERS, 0.93, 1.07) : kg ? clamp(1 + (kg - REF_KG) / 2400, 0.95, 1.05) : 1;
  const bulk = kg ? clamp(Math.sqrt(kg / (REF_KG * s ** 3)), 0.92, 1.1) : 1;
  return { s, bulk };
}

// look: { coat, face, legs: {LF,RF,LH,RH}, size, maneLen, tailLen } (see data/horses.js)
function buildHorse(look = {}, seed = 1337) {

  // nasal bone, the Barb's ram head). Only the top line of the face moves; the gear follows because it reads the same rows.
  const profile = clamp(conf.profile ?? 0, -1.5, 1.5), earSize = conf.ears ?? 1;

  const neck2 = bone(neck1, stretch(V(0.86, 1.64)), 'neck2');
  const head = bone(neck2, POLL_H.clone(), 'head');
  Object.assign(rig, { spine, hips, chest, neck1, neck2, head });

  /* ----- trunk + neck skin (one continuous faceted surface) ----- */
  const skinWeights = (geo, keys, param) => {
    const pos = geo.attributes.position, n = pos.count, p = V(0, 0);
    const si = new Uint16Array(n * 4), sw = new Float32Array(n * 4);
    for (let i = 0; i < n; i++) {
      const t = param(p.fromBufferAttribute(pos, i));
      let k = 0;
      while (k < keys.length - 2 && t > keys[k + 1][0]) k++;
      const w = smoothstep(keys[k][0], keys[k + 1][0], t);
      si[i * 4] = keys[k][1]; sw[i * 4] = 1 - w;
      si[i * 4 + 1] = keys[k + 1][1]; sw[i * 4 + 1] = w;
    }
    geo.setAttribute('skinIndex', new THREE.BufferAttribute(si, 4));
    geo.setAttribute('skinWeight', new THREE.BufferAttribute(sw, 4));
    return geo;
  };
  const belly = (bulk - 1) * 0.12; // a heavier horse is deeper through the girth, too
  const trunkRings = TRUNK.map(([x, top, bot0, w0, wu, wd]) => {
    const w = w0 * bulk, bot = bot0 - belly * smoothstep(0.75, 0.2, Math.abs(x + 0.05));
    return ringAt(V(x, (top + bot) / 2), X_AXIS, Y_AXIS, PROF.trunk, { up: (top - bot) / 2, down: (top - bot) / 2, w, wUp: w * wu, wDown: w * wd });
  });
  const t0 = TRUNK[0], tN = TRUNK[TRUNK.length - 1];
  // dappled greys paint their dapples on 16x finer (coplanar) faces; everyone else keeps one colour per facet
  const fine = (geo, levels) => (pal.dapple > 0 ? subdivide(geo, levels) : geo);
  let trunk = loft(trunkRings, V(t0[0] - 0.05, (t0[1] + t0[2]) / 2 - 0.02), V(tN[0] + 0.05, (tN[1] + tN[2]) / 2));
  jitter(trunk, 0.012, 11);
  trunk = fine(trunk, 2);
  skinWeights(trunk, [[-0.55, 1], [-0.12, 0], [0.1, 0], [0.45, 2]], (p) => p.x);
  trunk = paint(trunk, coatColor(rnd, pal));

  const neckBulk = 1 + (bulk - 1) * 0.8;
  const neckRings = NECK_ROWS.map(([cx, cy, tx, ty, w0]) => {
    const C = V(cx, cy), T = V(tx, ty), U = C.clone().sub(T), h = U.length() / 2, w = w0 * neckBulk;
    U.normalize();
    return ringAt(C.clone().add(T).multiplyScalar(0.5), V(U.y, -U.x), U, PROF.neck, { up: h, down: h, w, wUp: w * 0.5, wDown: w * 0.85 });
  });
  const nA = V(0.57, 1.39), nB = stretch(V(1.14, 1.78)), nAB = nB.clone().sub(nA);
  // the root ring is capped inside the chest so no open edge shows when the neck swings
  let neck = loft(neckRings, V(0.5, 1.3), stretch(V(1.19, 1.79)));
  jitter(neck, 0.01, 12);
  neck = fine(neck, 2);
  skinWeights(neck, [[0, 2], [0.28, 3], [0.62, 4], [0.97, 5]], (p) => clamp(p.clone().sub(nA).dot(nAB) / nAB.lengthSq(), 0, 1));
  neck = paint(neck, coatColor(rnd, pal));

  const body = new THREE.SkinnedMesh(merge([trunk, neck]), mat);
  body.name = 'body';
  body.castShadow = body.receiveShadow = true;
  body.frustumCulled = false;
  root.add(body);
  root.updateMatrixWorld(true);
  body.bind(new THREE.Skeleton(bones));
  head.scale.setScalar(headSize); // everything mounted on the head (eyes, ears, forelock, gear) follows

  /* ----- race tack on the back (racecourses only): saddle cloth with the number, saddle, girth. Skinned
     to the body's own skeleton with the trunk's weights, so it stays glued to the back as it flexes ----- */
  if (look.saddle) {
    const S = look.saddle, trunkWeights = [[-0.55, 1], [-0.12, 0], [0.1, 0], [0.45, 2]];
    const rowAt = (x) => { // trunk [top, bot, w, wu, wd] at x (interpolated, with this horse's bulk and belly)
      let i = 1; while (i < TRUNK.length - 1 && TRUNK[i][0] < x) i++;
      const a = TRUNK[i - 1], b = TRUNK[i], t = clamp((x - a[0]) / (b[0] - a[0]), 0, 1), r = [1, 2, 3, 4, 5].map((j) => lerp(a[j], b[j], t));
      r[1] -= belly * smoothstep(0.75, 0.2, Math.abs(x + 0.05)); r[2] *= bulk;
      return r;
    };
    const shell = (x0, x1, n, grow) => loft(Array.from({ length: n + 1 }, (_, i) => {
      const x = lerp(x0, x1, i / n), [top, bot, w, wu, wd] = rowAt(x), t = top + grow, b = bot - grow, ww = w + grow;
      return ringAt(V(x, (t + b) / 2), X_AXIS, Y_AXIS, PROF.trunk, { up: (t - b) / 2, down: (t - b) / 2, w: ww, wUp: ww * wu, wDown: ww * wd });
    }));
    const cut = (geo, fn) => { // keep the faces fn accepts (centroid), as a non-indexed geometry
      const src = geo.toNonIndexed().attributes.position.array, out = [];
      for (let i = 0; i < src.length; i += 9) if (fn((src[i] + src[i + 3] + src[i + 6]) / 3, (src[i + 1] + src[i + 4] + src[i + 7]) / 3, (src[i + 2] + src[i + 5] + src[i + 8]) / 3)) out.push(...src.slice(i, i + 9));
      const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(out, 3)); return g;
    };
    const skinned = (geo, material) => {
      skinWeights(geo, trunkWeights, (p) => p.x);
      const m = new THREE.SkinnedMesh(geo, material);
      m.castShadow = m.receiveShadow = true; m.frustumCulled = false;
      root.add(m); root.updateMatrixWorld(true); m.bind(body.skeleton);
      return m;
    };
    // saddle cloth: hangs from the spine about a third of the way down the barrel; the number reads
    // front-to-back on both sides (u flips on the near side)
    // JRA cloth: ~70 cm long and ~51 cm down each side, front edge at the withers, hanging to ~45% of the barrel
    const C0 = -0.22, C1 = 0.45, hem = (x) => lerp(rowAt(x)[0], rowAt(x)[1], 0.45);
    const cloth = cut(shell(C0, C1, 8, 0.014), (x, y) => y > hem(x));
    const pos = cloth.attributes.position, uv = new Float32Array(pos.count * 2);
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i), u = (x - C0) / (C1 - C0);
      uv[i * 2] = z >= 0 ? u : 1 - u;
      uv[i * 2 + 1] = clamp((y - hem(x)) / (rowAt(x)[0] - hem(x)), 0, 1);
    }
    cloth.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    cloth.computeVertexNormals();
    skinned(cloth, new THREE.MeshStandardMaterial({ map: saddleClothTexture(S), flatShading: true, roughness: 0.85 })).name = 'saddle-cloth';
    // racing saddle (a small flat pad) and the white girth + overgirth behind the elbows
    const top = (x) => rowAt(x)[0];
    // on the front third of the cloth: a dark under-pad rim, the small black racing saddle, a cream girth with a
    // black elastic overgirth over the saddle, both just behind the elbow; with no rider the irons are run up
    const pad = paint(cut(shell(0.02, 0.42, 5, 0.03), (x, y) => y > top(x) - 0.06), flat(hex(S.pad ?? '#3a3a3a'), rnd, 0.04));
    const saddle = paint(cut(shell(0.06, 0.4, 5, 0.05), (x, y) => y > top(x) - 0.035), flat(hex(S.saddle ?? '#151515'), rnd, 0.04));
    const girth = paint(cut(shell(0.355, 0.39, 1, 0.022), () => true), flat(hex(S.girth ?? '#ede8da'), rnd, 0.03));
    const over = paint(cut(shell(0.3, 0.325, 1, 0.056), () => true), flat(hex(S.overgirth ?? '#111111'), rnd, 0.03));
    const irons = [-1, 1].map((sd) => { const [t, , w] = rowAt(0.36); return paint(new THREE.BoxGeometry(0.06, 0.05, 0.012).toNonIndexed().translate(0.36, t - 0.07, sd * (w * 0.62 + 0.03)), flat(hex('#c8ccd0'), rnd, 0.04)); });
    irons.forEach((g) => g.deleteAttribute('uv'));
    skinned(merge([pad, saddle, girth, over, ...irons]), mat).name = 'saddle';
  }

  /* ----- head: wedge loft with jowls, face marking, muzzle; eyes, nostrils, ears, forelock ----- */
  const headM = new THREE.Matrix4().makeRotationZ(HEAD_TILT).setPosition(POLL_H);
  // a ring between every pair of authored rings, so a star or stripe has faces small enough to read
  const headRows = HEADP.flatMap((r, i) => (i ? [HEADP[i - 1].map((v, j) => (v + r[j]) / 2), r] : [r]));
  const headRings = headRows.map(([x, top, bot, w]) =>
    ringAt(V(x, (top - bot) / 2), X_AXIS, Y_AXIS, PROF.head, { up: (top + bot) / 2, down: (top + bot) / 2, w, wUp: w * 0.78, wDown: w * 0.7 }));
  let headGeo = loft(headRings, V(-0.08, -0.02), V(0.66, -0.035));
  jitter(headGeo, 0.007, 13);
  // a young grey's face is already lighter than its body, with only faint dapples
  const headPal = pal.headLift ? { ...pal, coat: pal.coat.clone().offsetHSL(0, 0, pal.headLift), hi: pal.hi.clone().offsetHSL(0, 0, pal.headLift), lo: pal.lo.clone().offsetHSL(0, 0, pal.headLift) } : pal;
  const headCoat = coatColor(rnd, headPal, (pal.dapple ?? 0) * 0.25);
  headGeo = paint(headGeo, (c, n) => {
    if (faceMarked(faceType, c, n)) return shade(c.x > 0.57 ? 0xe9d3c8 : WHITE, rnd, 0.03); // pink skin under a white muzzle
    if (c.x > 0.55) return shade(pal.muzzle, rnd, 0.04);
    return headCoat(c, n);
  });
  attach(head, headGeo.applyMatrix4(headM));
  for (const s of [-1, 1]) {
    const eye = new THREE.OctahedronGeometry(0.024, 0);
    eye.scale(1.25, 0.8, 0.55).translate(0.225, 0.02, s * 0.106);
    attach(head, eye.applyMatrix4(headM), eyeMat).castShadow = false;
    const nostril = new THREE.OctahedronGeometry(0.018, 0);
    nostril.scale(1.4, 0.9, 0.5).translate(0.6, -0.012, s * 0.066);
    attach(head, nostril.applyMatrix4(headM), eyeMat).castShadow = false;
    // ear: flattened 4-sided cone on a mount (rest tilt), animated inside
    const earGeo = new THREE.ConeGeometry(0.036, 0.15, 4, 1).translate(0, 0.075, 0).scale(0.62, 1, 1);
    jitter(earGeo, 0.004, 20 + s);
    const ear = new THREE.Mesh(paint(earGeo, (c) => shade(c.y > 0.1 ? pal.points ?? pal.lo : pal.coat, rnd, 0.04)), mat);
    ear.castShadow = true;
    const mount = new THREE.Object3D();
    mount.position.copy(V(0.02, 0.07, s * 0.05).applyMatrix4(headM)).sub(POLL_H);
    mount.rotation.set(s * 0.28, 0, HEAD_TILT + 58 * DEG);
    mount.scale.set(Math.sqrt(earSize), earSize, Math.sqrt(earSize)); // conf.ears: longer ears are a little broader too
    mount.add(ear);
    head.add(mount);
    rig.ears.push({ mesh: ear, side: s });
  }
  /* ----- racing gear (data/horses.js `gear`), authored in head space like the head itself ----- */
  const gear = look.gear;
  if (gear) buildGear(gear);
  function buildGear(G) {
    const H0 = HEADP[0], HN = HEADP[HEADP.length - 1];
    const rowAt = (x) => { // [top, bot, w] of the head at x, interpolated between the rows (profile included)
      if (x <= H0[0]) return H0.slice(1);
      for (let i = 1; i < HEADP.length; i++) if (x <= HEADP[i][0]) { const a = HEADP[i - 1], b = HEADP[i], t = (x - a[0]) / (b[0] - a[0]); return [1, 2, 3].map((j) => lerp(a[j], b[j], t)); }
      return HN.slice(1);
    };
    const ringX = (x, grow) => { const [top, bot, w] = rowAt(x), t = top + grow, b = bot + grow * 0.6, ww = w + grow; return ringAt(V(x, (t - b) / 2), X_AXIS, Y_AXIS, PROF.head, { up: (t + b) / 2, down: (t + b) / 2, w: ww, wUp: ww * 0.78, wDown: ww * 0.7 }); };
    const keepFaces = (geo, fn) => { // drop the faces fn rejects (tested on head-space centroid / normal)
      const src = (geo.index ? geo.toNonIndexed() : geo).attributes.position.array, out = [], a = V(0, 0), b = V(0, 0), c = V(0, 0), n = V(0, 0), e = V(0, 0);
      for (let i = 0; i < src.length; i += 9) {
        a.fromArray(src, i); b.fromArray(src, i + 3); c.fromArray(src, i + 6);
        n.subVectors(b, a).cross(e.subVectors(c, a)).normalize();
        if (fn(a.clone().add(b).add(c).multiplyScalar(1 / 3), n)) out.push(...src.slice(i, i + 9));
      }
      const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(out, 3)); return g;
    };
    const band = (x0, x1, grow, color, keep = () => true) => paint(keepFaces(loft([ringX(x0, grow), ringX(x1, grow)]), keep), flat(hex(color), rnd, 0.03));
    // a flat strap between head-space points (used for cheekpieces and the bit-lifter)
    const strap = (pts, color, wd = 0.016) => merge(pts.slice(1).map((p, i) => {
      const a = pts[i], d = p.clone().sub(a), len = d.length();
      const g = new THREE.BoxGeometry(len + 0.01, wd, 0.006).toNonIndexed();
      const q = new THREE.Quaternion().setFromUnitVectors(X_AXIS, d.normalize());
      return paint(g.applyQuaternion(q).translate((a.x + p.x) / 2, (a.y + p.y) / 2, (a.z + p.z) / 2), flat(hex(color), rnd, 0.03));
    }));
    const parts = []; // every head-mounted piece is merged into one mesh (one draw call)
    const toHead = (geo) => { geo.applyMatrix4(headM); if (geo.attributes.uv) geo.deleteAttribute('uv'); parts.push(geo); };
    const EYE = V(0.225, 0.02), hole = (c, r) => Math.abs(c.z) > 0.04 && Math.hypot(c.x - EYE.x, c.y - EYE.y) < r;
    const bridle = G.bridle === undefined ? (look.racehorse ? '#3a2a20' : null) : G.bridle;
    if (G.hood) {
      // メンコ: a close-fitting shell over the poll and face down to the cheeks, with eye holes, trimmed edges
      const C = { main: '#f2f0ea', ...(G.hoodColors ?? {}) }; C.trim ??= C.main; C.ears ??= C.main;
      const rings = []; for (let x = -0.07; x <= 0.401; x += 0.035) rings.push(ringX(x, 0.011));
      // cut and trim along the loft's own rows (v = height in the head profile, -1 jaw … 1 forehead), so the lower edge
      // runs straight down the cheek instead of zig-zagging across the faces
      const v = (c) => { const [top, bot] = rowAt(c.x), t = top + 0.011, bb = bot + 0.0066; return (c.y - (t - bb) / 2) / ((t + bb) / 2); };
      const shell = keepFaces(subdivide(loft(rings), 1), (c) => v(c) > -0.3 && !hole(c, 0.045)); // finer faces: rounder eye holes
      toHead(paint(shell, (c) => shade(hex(c.x > 0.367 || v(c) < 0.03 || hole(c, 0.068) ? C.trim : C.main), rnd, 0.03)));
      if (C.ears !== false) for (const e of rig.ears) { // ear covers ride on the animated ears (`ears: false`: a hood without them)
        const cover = new THREE.ConeGeometry(0.046, 0.16, 5, 1).translate(0, 0.074, 0).scale(0.7, 1, 1);
        e.mesh.add(new THREE.Mesh(paint(jitter(cover, 0.003, 90), flat(hex(C.ears), rnd, 0.03)), mat));
      }
    }
    if (G.blinkers) for (const s of [-1, 1]) {
      const cup = new THREE.CylinderGeometry(0.042, 0.03, 0.04, 6, 1, true).rotateX(Math.PI / 2).rotateY(-s * 0.55).translate(EYE.x - 0.012, EYE.y + 0.004, s * 0.13);
      const C = G.hoodColors ?? {}; toHead(paint(cup.toNonIndexed(), flat(hex(G.blinkerColor ?? C.trim ?? C.main ?? '#1c1c1c'), rnd, 0.03)));
    }
    if (bridle) {
      toHead(band(-0.035, -0.012, 0.012, bridle));                                  // headpiece over the poll + throatlatch
      toHead(band(0.05, 0.072, 0.012, G.browband ?? bridle, (c) => c.y > 0.0));     // browband across the forehead
      toHead(band(0.425, 0.455, 0.009, G.noseband ?? bridle));                     // noseband
      for (const s of [-1, 1]) {
        const [, , w0] = rowAt(0.0), [, , w1] = rowAt(0.18), [, , w2] = rowAt(0.53);
        toHead(strap([V(-0.01, 0.0, s * (w0 + 0.01)), V(0.18, -0.035, s * (w1 * 0.95 + 0.012)), V(0.53, -0.072, s * (w2 * 0.85 + 0.008))], bridle));
        toHead(paint(new THREE.TorusGeometry(0.018, 0.005, 4, 8).translate(0.555, -0.075, s * 0.072).toNonIndexed(), flat(0xb9bcbf, rnd, 0.03))); // bit ring
      }
    }
    if (G.bitLifter) { // ハミ吊り: a strap down the middle of the face that forks to the bit
      const c = G.bitLifter === true ? '#f2f0ea' : G.bitLifter, y = (x) => rowAt(x)[0] + 0.012;
      toHead(strap([V(0.07, y(0.07), 0), V(0.4, y(0.4), 0)], c, 0.02));
      for (const s of [-1, 1]) toHead(strap([V(0.4, y(0.4), 0), V(0.47, rowAt(0.47)[0] - 0.02, s * 0.06), V(0.54, -0.06, s * 0.074)], c, 0.016));
    }
    if (G.shadowRoll) { const [t] = rowAt(0.44); toHead(paint(jitter(new THREE.IcosahedronGeometry(0.046, 0).scale(0.8, 0.75, 2.1), 0.006, 91).translate(0.44, t + 0.012, 0), flat(hex(G.shadowRoll === true ? '#f4f1ea' : G.shadowRoll), rnd, 0.04))); }
    if (G.pompom) { const [t] = rowAt(-0.03); toHead(paint(jitter(new THREE.IcosahedronGeometry(0.034, 0), 0.008, 92).translate(-0.03, t + 0.035, 0), flat(hex(G.pompom), rnd, 0.05))); }
    if (parts.length) attach(head, merge(parts)).name = 'gear';
  }

  // forelock: two shards lying over the forehead (tucked under a hood)
  for (let i = 0; i < (gear?.hood ? 0 : 2); i++) {
    const fl = (0.17 - i * 0.03) * (0.6 + 0.4 * maneLen);
    const g = new THREE.ConeGeometry(0.035, fl, 4, 1).translate(0, fl / 2, 0).scale(1, 1, 0.45);
    const lock = new THREE.Mesh(paint(jitter(g, 0.006, 30 + i), flat(pal.mane, rnd)), mat);
    lock.castShadow = true;
    const mount = new THREE.Object3D();
    mount.position.copy(V(0.0, 0.085, (i - 0.5) * 0.03).applyMatrix4(headM)).sub(POLL_H);
    mount.rotation.set((i - 0.5) * 0.3, 0, HEAD_TILT - 72 * DEG);
    mount.add(lock);
    head.add(mount);
    rig.mane.push({ mesh: lock, i: 11 + i, amp: 0.5 });
  }

  /* ----- mane: blades along the crest, rigidly mounted on the nearest neck bone ----- */
  const crest = NECK_ROWS.map(([cx, cy, tx, ty]) => ({ p: V(cx, cy), up: V(cx - tx, cy - ty).normalize() }));
  const MANE_N = 16;
  for (let i = 0; i < MANE_N; i++) {
    const t = 0.35 + (i / (MANE_N - 1)) * (crest.length - 1.35);
    const k = Math.min(Math.floor(t), crest.length - 2), f = t - k;
    const p = crest[k].p.clone().lerp(crest[k + 1].p, f);
    const up = crest[k].up.clone().lerp(crest[k + 1].up, f).normalize();
    p.addScaledVector(up, -0.02);
    const tn = i / (MANE_N - 1);
    const len = (0.2 + 0.1 * Math.sin(Math.PI * (0.2 + 0.7 * tn)) + (rnd() - 0.5) * 0.05) * maneLen;
    const g = new THREE.ConeGeometry(0.055, len, 4, 1).translate(0, len / 2, 0).scale(1, 1, 0.4);
    const blade = new THREE.Mesh(paint(jitter(g, 0.008, 40 + i), flat(i % 3 === 1 ? pal.mane2 : pal.mane, rnd)), mat);
    blade.castShadow = true;
    const parent = tn < 0.12 ? chest : tn < 0.55 ? neck1 : neck2;
    const mount = new THREE.Object3D();
    mount.position.copy(p).sub(restOf(parent));
    mount.rotation.set(0.95 + 0.2 * rnd(), 0, Math.atan2(-up.x, up.y) + 62 * DEG);
    mount.add(blade);
    parent.add(mount);
    rig.mane.push({ mesh: blade, i, amp: 1 });
  }

  /* ----- tail: 6 chained segments, raised at the dock, arcing back and down ----- */
  const TAIL_LEN = [0.15, 0.17, 0.17, 0.17, 0.16, 0.15].map((l, i) => (i ? l * tailLen : l)); // the dock keeps its length
  const TAIL_R = [0.03, 0.043, 0.054, 0.06, 0.058, 0.047, 0.014];
  let tp = V(-0.83, 1.5), tAng = -100 * DEG, tParent = hips;
  for (let i = 0; i < TAIL_LEN.length; i++) {
    const seg = joint(tParent, tp, `tail${i}`);
    const dir = V(Math.sin(tAng), -Math.cos(tAng)), end = tp.clone().addScaledVector(dir, TAIL_LEN[i]);
    const rings = [-0.04, 0.5, 1.12].map((t, j) => {
      const r = j === 1 ? (TAIL_R[i] + TAIL_R[i + 1]) * 0.55 : TAIL_R[i + (t > 0.5 ? 1 : 0)];
      return ringAt(tp.clone().addScaledVector(dir, t * TAIL_LEN[i]), dir, Y_AXIS, PROF.hair, { up: r, down: r, w: r * 0.62 });
    });
    const g = loft(rings, tp.clone().addScaledVector(dir, -0.07), end.clone().addScaledVector(dir, 0.05));
    attach(seg, paint(jitter(g, 0.012, 50 + i), flat(i % 2 ? pal.tail : pal.tail2, rnd)));
    rig.tail.push(seg);
    tp = end; tAng += 9 * DEG; tParent = seg;
  }

  /* ----- limbs ----- */
  // Tapered limb segment from joint a to joint b. sections: [t, front, back, halfWidth] (t along a->b).
  const limb = (a, b, sections, colorFn, seed, k = 1, cap = 0.03, fineLv = 0) => {
    const T = b.clone().sub(a), L = T.length();
    T.normalize();
    const rings = sections.map(([t, fr, bk, w]) => ringAt(a.clone().addScaledVector(T, t * L), T, X_AXIS, PROF.limb, { up: fr * k, down: bk * k, w: w * k }));
    const first = sections[0][0] * L, last = sections[sections.length - 1][0] * L;
    const g = loft(rings, a.clone().addScaledVector(T, first - cap), a.clone().addScaledVector(T, last + cap));
    return paint(fine(jitter(g, 0.006, seed), fineLv), colorFn);
  };
  const UP = pal.dapple > 0 ? 1 : 0; // upper limbs carry the dapples too (less finely)
  const hoofGeo = (co, pale) => {
    const top = ringAt(V(co.x - 0.004, co.y + 0.012, co.z), V(0, -1, 0), X_AXIS, PROF.limb, { up: 0.04, down: 0.036, w: 0.042 });
    const sole = V(co.x + HOOF_TOE - 0.057, SOLE, co.z);
    const bot = ringAt(sole, V(0, -1, 0), X_AXIS, PROF.limb, { up: 0.057, down: 0.04, w: 0.053 });
    const g = loft([top, bot], V(co.x - 0.004, co.y + 0.02, co.z), sole);
    return paint(jitter(g, 0.003, 60, (x, y) => y < SOLE + 1e-4), flat(pale ? HOOF_PALE : pal.hoof, rnd, 0.05));
  };
  const lower = (L, fe, co, top, seed) => {
    // cannon (with knee/hock block) is built by the caller; this adds fetlock, pastern and hoof
    const pas = joint(L.can, fe, `${L.id}-pastern`);
    const low = withWhite(flat(pal.legs, rnd), top, rnd);
    const ball = new THREE.IcosahedronGeometry(0.047, 0).scale(1, 0.95, 0.88).translate(fe.x - 0.012, fe.y, fe.z);

    attach(pas, limb(fe, co, [[0, 0.03, 0.033, 0.032], [0.68, 0.035, 0.035, 0.037], [1, 0.037, 0.036, 0.04]], low, seed + 1));
    const hoof = joint(pas, co, `${L.id}-hoof`);

    return { pas, hoof };
  };
  const ang = (a, b) => Math.atan2(b.x - a.x, -(b.y - a.y)); // 0 = pointing down, + = lower end forward
  const kUp = bulk, kMid = 1 + (bulk - 1) * 0.6; // upper limbs carry the muscle; cannons stay as they are

  for (const def of LEGS) {
    const L = { ...def };
    const z = def.side * (def.fore ? FORE.z : HIND.z);
    const P = (xy) => V(xy[0], xy[1], z);
    const top = legWhiteTop(look.legs?.[def.id], def.fore);
    const wh = (fn) => withWhite(fn, top, rnd);
    if (def.fore) {
      const sc = P(FORE.sc), sh = P(FORE.sh), el = P(FORE.el), kn = P(FORE.kn), co = P(FORE.co);
      const fe = co.clone().add(V(-PASTERN * Math.sin(FORE.pastern), PASTERN * Math.cos(FORE.pastern)));
      L.root = chest;
      L.scap = joint(chest, sc, `${def.id}-scapula`);
      L.arm = joint(L.scap, sh, `${def.id}-humerus`);
      L.fa = joint(L.arm, el, `${def.id}-forearm`);
      L.can = joint(L.fa, kn, `${def.id}-cannon`);
      // shoulder: a broad, flat blade lying in the chest wall (it reads as the shoulder slope, not a strap)
      attach(L.scap, limb(sc, sh, [[-0.06, 0.05, 0.06, 0.022], [0.3, 0.12, 0.11, 0.036], [0.8, 0.1, 0.09, 0.04], [1.06, 0.06, 0.06, 0.034]], coatColor(rnd, pal), 70, kUp, 0.03, UP));
      // arm: biceps in front, the big triceps mass behind, filling the triangle point of shoulder ->
      // elbow -> chest; the elbow end stays thick so the forearm grows out of muscle, not out of a rod
      const tri = el.clone().add(V(-0.04, 0.06, -def.side * 0.012));
      attach(L.arm, limb(sh, el, [[-0.14, 0.06, 0.07, 0.058], [0.2, 0.085, 0.13, 0.075], [0.6, 0.075, 0.15, 0.078], [0.95, 0.06, 0.1, 0.07], [1.14, 0.04, 0.05, 0.05]], coatColor(rnd, pal), 71, kUp, 0.03, UP));
      attach(L.arm, paint(jitter(new THREE.IcosahedronGeometry(0.075, 0).scale(1.25 * kUp, 1, 0.85 * kUp).translate(tri.x, tri.y, tri.z), 0.006, 75), coatColor(rnd, pal)));
      // forearm: muscular and wide at the top (extensors in front), tapering hard to a flat knee
      attach(L.fa, limb(el, kn, [[-0.1, 0.075, 0.085, 0.07], [0.1, 0.095, 0.08, 0.082], [0.42, 0.066, 0.055, 0.06], [0.82, 0.042, 0.04, 0.043], [1.0, 0.045, 0.04, 0.048]], wh(pointsColor(el, kn, 0.72, 0.97, rnd, pal)), 72, kMid, 0.03, UP));
      attach(L.can, limb(kn, fe, [[-0.06, 0.042, 0.038, 0.046], [0.06, 0.047, 0.042, 0.05], [0.2, 0.031, 0.04, 0.036], [0.55, 0.03, 0.041, 0.035], [0.8, 0.03, 0.042, 0.034], [1.0, 0.034, 0.045, 0.038]], wh(flat(pal.legs, rnd)), 73));
      Object.assign(L, lower(L, fe, co, top, 74));
      const bf = look.gear?.bandages?.fore;
      if (bf) attach(L.can, limb(kn, fe, [[0.12, 0.05, 0.05, 0.052], [0.5, 0.045, 0.052, 0.047], [0.98, 0.05, 0.056, 0.052]], flat(hex(bf), rnd, 0.04), 76));
      L.rest = { sc, sh, humerus: ang(sh, el), forearm: ang(el, kn), cannon: ang(kn, fe), pastern: ang(fe, co) };
      L.len = { arm: sh.distanceTo(el), fa: el.distanceTo(kn), can: kn.distanceTo(fe) };
    } else {
      const hip = P(HIND.hip), st = P(HIND.st), ho = P(HIND.ho), co = P(HIND.co);
      const fe = co.clone().add(V(-PASTERN * Math.sin(HIND.pastern), PASTERN * Math.cos(HIND.pastern)));
      L.root = hips;
      L.fem = joint(hips, hip, `${def.id}-femur`);
      L.tib = joint(L.fem, st, `${def.id}-tibia`);

      const inward = V(0, 0, -def.side * 0.02);
      attach(L.fem, limb(hip.clone().add(inward), st.clone().add(inward), [[-0.2, 0.08, 0.12, 0.09], [0.1, 0.11, 0.2, 0.11], [0.5, 0.11, 0.22, 0.11], [0.85, 0.09, 0.18, 0.1], [1.08, 0.05, 0.12, 0.07]], coatColor(rnd, pal), 80, kUp, 0.03, UP));
      attach(L.tib, limb(st, ho, [[-0.12, 0.075, 0.11, 0.082], [0.12, 0.08, 0.17, 0.088], [0.45, 0.058, 0.125, 0.068], [0.8, 0.042, 0.06, 0.05], [1.0, 0.042, 0.045, 0.048]], wh(pointsColor(st, ho, 0.8, 1.02, rnd, pal)), 81, kMid, 0.03, UP));
      attach(L.can, limb(ho, fe, [[-0.12, 0.04, 0.05, 0.045], [-0.02, 0.045, 0.085, 0.05], [0.1, 0.038, 0.055, 0.045], [0.25, 0.031, 0.043, 0.036], [0.63, 0.03, 0.043, 0.035], [0.85, 0.03, 0.043, 0.034], [1.0, 0.034, 0.045, 0.038]], wh(flat(pal.legs, rnd)), 82));
      Object.assign(L, lower(L, fe, co, top, 84));
      const bh = look.gear?.bandages?.hind;
      if (bh) attach(L.can, limb(ho, fe, [[0.22, 0.044, 0.058, 0.05], [0.6, 0.044, 0.056, 0.047], [0.98, 0.05, 0.058, 0.052]], flat(hex(bh), rnd, 0.04), 86));
      L.hip = hip;
      L.rest = { femur: ang(hip, st), tibia: ang(st, ho), cannon: ang(ho, fe), pastern: ang(fe, co) };
      L.len = { fem: hip.distanceTo(st), tib: st.distanceTo(ho), can: ho.distanceTo(fe) };
      L.hockRest = L.rest.cannon - L.rest.tibia;

    L.z = z;
    rig.legs.push(L);
  }
  return rig;
}

/* =====================================================================
   6. Gait: hoof paths + IK, and the full-body pose(g)
   ===================================================================== */
// Fetlock of a hoof whose toe rests at (toeX, SOLE), heel lifted by `tip` (rad), pastern at angle a.
function plantedFetlock(toeX, tip, a) {
  const cx = toeX - HOOF_TOE * Math.cos(tip) + HOOF_H * Math.sin(tip); // coffin joint, rotated about the toe
  const cy = SOLE + HOOF_TOE * Math.sin(tip) + HOOF_H * Math.cos(tip);
  return [cx - PASTERN * Math.sin(a), cy + PASTERN * Math.cos(a)];
}

// Path mode (G.path, e.g. a paddock's parade ring): the horse walks a curve, so a planted toe is fixed in the
// ring, not in a frame sliding straight back. Toe in horse space (horse units) for a toe that landed `back`
// horse units of travel ago at (x0, zL): out to the ring through the frame at touchdown, back through the
// frame now. On a straight this is exactly (x0 - back, zL).
function pathToe(G, zL, x0, back, sNow = G.pathS ?? 0) {
  const sc = G.scale ?? 1, a = G.path.at(sNow - back * sc), b = G.path.at(sNow);
  const lx = x0 * sc, lz = zL * sc, ca = Math.cos(a.phi), sa = Math.sin(a.phi);
  const dx = a.x + lx * ca + lz * sa - b.x, dz = a.z - lx * sa + lz * ca - b.z, cb = Math.cos(b.phi), sb = Math.sin(b.phi);
  return [(dx * cb - dz * sb) / sc, (dx * sb + dz * cb) / sc];
}

// The limb swings sideways as one plane about its top joint (solveLeg), so the hoof hangs below the fetlock in
// that tilted plane: to put the toe at toeZ on the ground, aim the fetlock at the same plane's z at its height.
function abductedZ(L, toeZ, fy) {
  const top = L.fore ? FORE.sc[1] : HIND.hip[1];
  return L.z + ((toeZ - L.z) * (top - fy)) / top;
}

// Fetlock target (horse space), plus pastern/hoof orientation and knee/hock flexion for gait phase g.
function footPath(L, g, G) {
  const A = L.fore ? FORE : HIND, P = L.fore ? G.fore : G.hind;
  if (G.stand) {
    const [fx, fy] = plantedFetlock(P.xc + HOOF_TOE, 0, A.pastern);
    return { u: G.duty / 2, fx, fy, pastern: A.pastern, tip: 0, flex: 0, curl: 0 };
  }
  const DUTY = G.duty, STRIDE = G.stride, STANCE_LEN = G.stanceLen;
  const u = wrap01(g - G.land[L.id]);
  const toeDown = P.xc + STANCE_LEN / 2 + HOOF_TOE; // toe x at touchdown
  if (u < DUTY) {
    // Stance: toe pinned to the ground, moving back at exactly the ground speed; the fetlock sinks
    // under load, then the heel peels up (breakover) so the hoof leaves the ground toe-last.
    const sp = u / DUTY, load = Math.sin(Math.PI * sp) ** 2;
    const tip = BREAKOVER * smoothstep(BREAKOVER_START, 1, sp);
    const a = A.pastern + P.sag * load - tip;
    let toeX = toeDown - STRIDE * u, toeZ;
    if (G.path) [toeX, toeZ] = pathToe(G, L.z, toeDown, STRIDE * u);
    const [fx, fy] = plantedFetlock(toeX, tip, a), fz = toeZ === undefined ? undefined : abductedZ(L, toeZ, fy);
    // hind push-off: the hock opens past its rest angle late in the stance (hockPush), lengthening the
    // leg so the hoof can stay planted far behind the hip at speed
    const push = L.fore ? 0 : (P.hockPush ?? 0) * smoothstep(0.45, 1, sp);
    return { u, fx, fy, fz, pastern: a, tip, flex: L.fore ? 0 : P.hockSag * load - push, curl: 0 };
  }
  // Swing: C1 Hermite (velocity-matched to the stance) forward, lifted by a smooth bump. The
  // breakover offset at lift-off fades out early in the swing, so the path is continuous.
  const s = (u - DUTY) / (1 - DUTY);
  const toeUp = toeDown - STANCE_LEN;
  const [bx, by] = plantedFetlock(toeUp, BREAKOVER, A.pastern - BREAKOVER); // actual lift-off fetlock
  const [fx0, fy0] = plantedFetlock(toeUp, 0, A.pastern);                    // same, with a flat hoof
  const fade = 1 - smoothstep(0, 0.3, s);
  const fx = hermite(fx0, fx0 + STANCE_LEN, -STRIDE * (1 - DUTY), s) + (bx - fx0) * fade;
  const fy = fy0 + P.lift * smoothstep(0, P.rise, s) * (1 - smoothstep(P.fall, 1, s)) + (by - fy0) * fade;
  const flex = P.flex * hump(s, 0, P.flexPeak, P.flexEnd) - (L.fore ? 0 : (P.hockPush ?? 0) * (1 - smoothstep(0, 0.22, s))); // push-off unwinds early in the swing
  const curl = G.curl * smoothstep(0, 0.28, s) * (1 - smoothstep(0.62, 0.96, s));
  let fz;
  if (G.path) { // on a curve the toe lifts off a little away from its straight-line spot: ease back during the swing
    const [lx, lz] = pathToe(G, L.z, toeDown, STANCE_LEN, (G.pathS ?? 0) - STRIDE * (u - DUTY) * (G.scale ?? 1)), k = 1 - smoothstep(0, 0.7, s);
    fz = abductedZ(L, L.z + (lz - L.z) * k, fy);
    return { u, fx: fx + (lx - toeUp) * k, fy, fz, pastern: A.pastern - BREAKOVER * fade, tip: BREAKOVER * fade, flex, curl };
  }
  return { u, fx, fy, pastern: A.pastern - BREAKOVER * fade, tip: BREAKOVER * fade, flex, curl };
}

// Planar two-bone IK in the limb plane. Angles: 0 = pointing down, + = lower end forward.
// bend = +1 puts the middle joint in front of the root->target line (stifle), -1 behind it (elbow).
function solve2(px, py, tx, ty, l1, l2, bend) {
  const dx = tx - px, dy = ty - py;
  const d = clamp(Math.hypot(dx, dy), Math.abs(l1 - l2) + 1e-5, l1 + l2 - 1e-5);
  const a = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const p1 = Math.atan2(dx, -dy) + bend * a;
  const jx = px + l1 * Math.sin(p1), jy = py - l1 * Math.cos(p1);
  return [p1, Math.atan2(tx - jx, -(ty - jy))];
}

const _t = V(0, 0), _rel = new THREE.Matrix4();
function solveLeg(rig, L, g) {
  const G = rig.gait, f = footPath(L, g, G);
  // body pitch relative to the horse's own root (which may be moved, turned or scaled)
  const e = _rel.multiplyMatrices(rig.rootInv, L.root.matrixWorld).elements, pitch = Math.atan2(e[1], e[0]);
  // target: horse space -> world (through the root) -> the limb root's rest-space frame
  _t.set(f.fx, f.fy, f.fz ?? L.z);
  rig.root.localToWorld(_t);
  L.root.worldToLocal(_t).add(L.root.userData.rest);
  // the body rolls a little, which tilts the limb plane: abduct the limb about its top joint so the
  // hoof stays in its world track (no sideways slip in stance), then solve in the tilted plane
  const top = L.fore ? L.rest.sc : L.hip, dz = _t.z - L.z, drop = top.y - _t.y;
  (L.fore ? L.scap : L.fem).rotation.x = Math.atan2(-dz, drop);
  _t.y = top.y - Math.hypot(drop, dz);
  let angles, chain, base = 0;
  if (L.fore) {
    // scapula swings forward through the swing, back through the stance (C1 periodic warp)
    const u = f.u, D = G.duty, w = u < D ? u / D : 1 + (u - D) / (1 - D);
    base = G.fore.scapSwing * Math.cos(Math.PI * w);
    L.scap.rotation.z = base;
    const r = L.rest, c = Math.cos(base), s = Math.sin(base);
    const shx = r.sc.x + (r.sh.x - r.sc.x) * c - (r.sh.y - r.sc.y) * s;
    const shy = r.sc.y + (r.sh.x - r.sc.x) * s + (r.sh.y - r.sc.y) * c;
    // knee folds backward: cannon = forearm - flex
    const k = f.flex, ex = -L.len.can * Math.sin(k), ey = -L.len.fa - L.len.can * Math.cos(k);
    const [aArm, aE] = solve2(shx, shy, _t.x, _t.y, L.len.arm, Math.hypot(ex, ey), -1);
    const aFa = aE - Math.atan2(ex, -ey), aCan = aFa - k;
    angles = [aArm, aFa, aCan];
    chain = [[L.arm, r.humerus], [L.fa, r.forearm], [L.can, r.cannon]];
  } else {
    // hock: cannon = tibia + eta; flexing swings the cannon forward under the belly
    const r = L.rest, eta = L.hockRest + G.hind.hockOpen + f.flex;
    const ex = L.len.can * Math.sin(eta), ey = -L.len.tib - L.len.can * Math.cos(eta);
    const [aFem, aE] = solve2(L.hip.x, L.hip.y, _t.x, _t.y, L.len.fem, Math.hypot(ex, ey), 1);
    const aTib = aE - Math.atan2(ex, -ey), aCan = aTib + eta;
    angles = [aFem, aTib, aCan];
    chain = [[L.fem, r.femur], [L.tib, r.tibia], [L.can, r.cannon]];
  }
  // pastern + hoof: flat on the ground (heel lifting at breakover), curling back under the cannon in swing
  const aCan = angles[2];
  const aPas = lerp(f.pastern - pitch, aCan + CURL_PASTERN, f.curl);
  const aHoof = lerp(-pitch - f.tip, aPas + CURL_HOOF, f.curl);
  angles.push(aPas, aHoof);
  chain.push([L.pas, L.rest.pastern], [L.hoof, 0]);
  // joints have identity rest rotation: local rotation = own deviation - parent deviation
  let prev = base;
  chain.forEach(([o, rest], i) => {
    const dev = angles[i] - rest;
    o.rotation.z = dev - prev;
    prev = dev;
  });
}

// Body motion per gait: g = gait phase, p = loop phase (slow idle motions use whole cycles per loop,
// so they stay seamless), o = this horse's own phase offset (background horses don't move in unison).
let loopPeriod = 10.5;                                              // seconds per loop at 1x (set by the hero)
const perLoopCycles = (sec) => Math.max(1, Math.round(loopPeriod / sec)); // ~sec-long cycles, whole per loop
const BODY = {
  gallop(rig, g) {
    const m = rig.gait.lead === 'R' ? -1 : 1; // the roll and tail swing mirror with the lead
    const { spine, hips, chest, neck1, neck2, head } = rig;
    // body: lowest mid-stance, highest in suspension; forehand dips as the forelegs land
    spine.position.set(0, spine.userData.rest.y - 0.035 + 0.04 * cyc(g, 1, 0.88), 0);
    spine.rotation.z = 3 * DEG * cyc(g, 1, 0.85);
    spine.rotation.x = m * 1.4 * DEG * Math.sin(TAU * (g - 0.2));
    const gather = cyc(g, 1, 0.92); // back rounds as the legs gather under the body
    hips.rotation.z = 4 * DEG * gather;
    chest.rotation.z = -2 * DEG * gather;
    // neck/head counterbalance: down as the forelegs land, up into suspension
    neck1.rotation.z = 5 * DEG * cyc(g, 1, 0.88);
    neck2.rotation.z = 4 * DEG * cyc(g, 1, 0.94);
    head.rotation.z = -6 * DEG * cyc(g, 1, 0.97);
    // ears pinned slightly back with a small flick
    for (const e of rig.ears) {
      e.mesh.rotation.z = 0.12 + 0.08 * cyc(g, 2, 0.15 + e.side * 0.1);
      e.mesh.rotation.x = 0.05 * cyc(g, 1, 0.3 + e.side * 0.2);
    }
    // mane: travelling wave from poll to withers
    for (const m of rig.mane) {
      m.mesh.rotation.z = m.amp * (0.18 * cyc(g, 2, 0.1 * m.i) + 0.06 * cyc(g, 3, 0.17 * m.i + 0.3));
      m.mesh.rotation.x = m.amp * 0.12 * cyc(g, 2, 0.13 * m.i + 0.5);
    }
    // tail: each segment replays the root motion with a delay -> follow-through
    rig.tail.forEach((seg, i) => {
      const lag = 0.08 * i;
      seg.rotation.z = (0.045 + 0.012 * i) * cyc(g, 1, 0.05 + lag) + 0.025 * cyc(g, 2, 0.2 + lag);
      seg.rotation.y = m * (0.03 + 0.014 * i) * Math.sin(TAU * (g - 0.3 - lag));
    });
  },
  // racing gallop: body carried lower and longer, a bigger bound, strong lumbosacral flexion as the
  // hind legs reach under, neck stretched out and pumping with the stride; mane and tail stream back
  race(rig, g) {
    const m = rig.gait.lead === 'R' ? -1 : 1;
    const { spine, hips, chest, neck1, neck2, head } = rig;
    spine.position.set(0, spine.userData.rest.y - 0.085 + 0.05 * cyc(g, 1, 0.82), 0);
    spine.rotation.z = 2.5 * DEG * cyc(g, 1, 0.8);
    spine.rotation.x = m * 1.2 * DEG * Math.sin(TAU * (g - 0.2));
    const gather = cyc(g, 1, 0.9);
    hips.rotation.z = 2 * DEG + 9 * DEG * gather;
    chest.rotation.z = -1 * DEG - 3 * DEG * gather;
    neck1.rotation.z = -9 * DEG + 6 * DEG * cyc(g, 1, 0.86);
    neck2.rotation.z = -4 * DEG + 4 * DEG * cyc(g, 1, 0.92);
    head.rotation.z = 6 * DEG - 7 * DEG * cyc(g, 1, 0.97);
    for (const e of rig.ears) {
      e.mesh.rotation.z = 0.32 + 0.06 * cyc(g, 2, 0.15 + e.side * 0.1);
      e.mesh.rotation.x = 0.04 * cyc(g, 1, 0.3 + e.side * 0.2);
    }
    for (const mn of rig.mane) {
      mn.mesh.rotation.z = mn.amp * (0.42 + 0.14 * cyc(g, 2, 0.1 * mn.i) + 0.05 * cyc(g, 3, 0.17 * mn.i + 0.3));
      mn.mesh.rotation.x = mn.amp * 0.1 * cyc(g, 2, 0.13 * mn.i + 0.5);
    }
    rig.tail.forEach((seg, i) => {
      const lag = 0.08 * i;
      seg.rotation.z = (i ? -0.05 : 0.12) + (0.04 + 0.01 * i) * cyc(g, 1, 0.05 + lag) + 0.025 * cyc(g, 2, 0.2 + lag);
      seg.rotation.y = m * (0.025 + 0.012 * i) * Math.sin(TAU * (g - 0.3 - lag));
    });
  },
  // trot: two small bounces per stride (lowest as each diagonal pair takes the weight), a level back,
  // a steady head, a gently swinging tail
  trot(rig, g, p, o) {
    const { spine, hips, chest, neck1, neck2, head } = rig;
    spine.position.set(0, spine.userData.rest.y - 0.03 + 0.022 * cyc(g, 2, 0.32), 0.006 * Math.sin(TAU * (g - 0.1)));
    spine.rotation.z = 0.6 * DEG * cyc(g, 2, 0.3);
    spine.rotation.x = 1.2 * DEG * Math.sin(TAU * (g - 0.2));
    hips.rotation.z = 1.5 * DEG * cyc(g, 2, 0.35);
    chest.rotation.z = -1 * DEG * cyc(g, 2, 0.3);
    neck1.rotation.z = -2 * DEG + 1.2 * DEG * cyc(g, 2, 0.36);
    neck2.rotation.z = 0.8 * DEG * cyc(g, 2, 0.4);
