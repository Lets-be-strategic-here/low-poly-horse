// The strip [0, (COPIES+1)W) slides left by the scroll, so it always covers +-COPIES*W/2.
function updateProps(sets, scroll) {
  for (const { mesh } of sets) mesh.position.x = -(COPIES / 2) * W - scroll;
}

// Sun direction from elevation/azimuth (deg; azimuth 0 = from behind the camera, + = toward +X).
function sunDirOf(t, S) {
  const el = (t.sunElevDeg ?? 40) * DEG, az = (t.sunAzimDeg ?? -20) * DEG;
  return V(Math.sin(az) * Math.cos(el), Math.sin(el), S * Math.cos(az) * Math.cos(el)).normalize();
}

const DEFAULT_SKY = { top: PAL.skyTop, mid: PAL.skyMid, horizon: PAL.horizon, sun: PAL.sun };
const DEFAULT_RANGES = [
  { r: 460, base: 0x9c9ab6, h: [24, 54], step: 0.2, haze: 0.58 },
  { r: 360, base: 0x9d9a90, h: [8, 24], step: 0.13, haze: 0.4 },
];

// Path mode: the middle of the ring, inside the bent strip's inner edge (same samples, so no seam).
function buildPathCentre(loc, S, dx) {
  const Y = paddockLayout(loc), n = Math.round(W / dx), rnd = mulberry32(78), lawn = colorOf(loc.ground?.centre ?? '#5f8f3e');
  const ring = (r) => Array.from({ length: n }, (_, i) => { const m = PATH.map((i / n) * W, Y.inner * S); return V(m.x * r, 0, m.z * r); });
  const rings = [ring(0.34), ring(0.67), ring(1)], pos = [], col = [], O = V(0, 0, 0);
  const tri = (a, b, c) => {
    const up = (b.z - a.z) * (c.x - a.x) - (b.x - a.x) * (c.z - a.z) >= 0, cc = lawn.clone().offsetHSL(0, 0, (Math.floor(((a.x + b.x + c.x) / 3) / 3) % 2 ? 0.02 : -0.01) + (rnd() - 0.5) * 0.03);
    for (const v of up ? [a, b, c] : [a, c, b]) { pos.push(v.x, v.y, v.z); col.push(cc.r, cc.g, cc.b); }
  };
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    tri(O, rings[0][i], rings[0][j]);
    for (let q = 0; q < 2; q++) { tri(rings[q][i], rings[q + 1][i], rings[q + 1][j]); tri(rings[q][i], rings[q + 1][j], rings[q][j]); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 }));
  mesh.receiveShadow = true;
  return mesh;
}

// Beach surf: a few foam sheets with ragged edges that run up the wet sand and drain back, a whole number of
// times per loop (seamless). Each sheet is a strip over the same span as the ground and scrolls with it.
function buildSurf(loc) {
  const Y = beachLayout(loc), rnd = mulberry32(91), group = new THREE.Group(), sheets = [];
  const nx = Math.round(W / 1.5), len = W * (COPIES + 1);
  for (let i = 0; i < 6; i++) { // three waves, each a thin bright lip on a wider, fainter sheet of foam
    const lip = i >= 3, geo = new THREE.PlaneGeometry(len, lip ? 0.3 : 1.8, nx * (COPIES + 1), 2).rotateX(-Math.PI / 2).translate(len / 2, 0, 0);
    const pos = geo.attributes.position;
    for (let v = 0; v < pos.count; v++) { // ragged landward edge, periodic in W
      const x = pos.getX(v), z = pos.getZ(v), w = i % 3, rag = -Y.sg * 0.9 * (Math.sin((TAU * harm(9) * x) / W + w * 2) * 0.5 + Math.sin((TAU * harm(4) * x) / W + w) * 0.5);
      if (lip) pos.setZ(v, z + rag + -Y.sg * 0.85); // the lip runs along the sheet's ragged landward edge
      else if (z * -Y.sg > 0.5) pos.setZ(v, z + rag);
    }
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: hex(Y.sea.foam ?? '#e8ecea'), transparent: true, opacity: 0.8, roughness: 0.6, depthWrite: false, flatShading: true }));
    m.receiveShadow = true;
    group.add(m);
    const w = i % 3, prev = sheets[w];
    sheets.push({ m, ph: prev ? prev.ph : w / 3 + rnd() * 0.1, run: prev ? prev.run : 3 + w * 1.8 + rnd() * 0.6, peak: lip ? 0.9 : 0.4, lip, edge: -Infinity });
  }
  // breakers: long white lines out in the surf zone that roll in toward the beach and fade
  const breakers = [];
  for (let i = 0; i < 4; i++) {
    const w = 0.8 + i * 0.5, geo = new THREE.PlaneGeometry(len, w, nx * (COPIES + 1), 1).rotateX(-Math.PI / 2).translate(len / 2, 0, 0), pos = geo.attributes.position;
    for (let v = 0; v < pos.count; v++) pos.setZ(v, pos.getZ(v) * (0.6 + 0.4 * Math.sin((TAU * harm(13 + i * 5) * pos.getX(v)) / W + i)) + 0.5 * Math.sin((TAU * harm(6) * pos.getX(v)) / W + i * 1.7));
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: hex(Y.sea.foam ?? '#e8ecea'), transparent: true, opacity: 0.7, roughness: 0.5, depthWrite: false, flatShading: true }));
    group.add(m);
    breakers.push({ m, ph: i / 4, out: 14 + i * 22 });
  }
  return {
    group,
    wet: (z) => sheets.some((sh) => sh.lip && -Y.sg * (z - Y.wl) < sh.edge), // is the swash over this line right now?
    update(p, scroll) {
      const n = Math.max(1, Math.round(loopPeriod / 6.5)); // a wave every ~6.5 s
      for (const sh of sheets) {
        const t = wrap01(n * p + sh.ph), up = Math.sin(Math.PI * Math.min(1, t * 1.6)) ** 0.7; // rush up, then drain
        const z = Y.wl - Y.sg * (up * sh.run - 0.6);
        sh.m.position.set(-(COPIES / 2) * W - scroll, Y.beachY(z) + 0.02, z);
        sh.m.material.opacity = sh.peak * (1 - smoothstep(0.45, 1, t));
        if (sh.lip) sh.edge = sh.m.material.opacity > 0.3 ? -Y.sg * (z - Y.wl) + 0.6 : -Infinity; // how far up the beach the water reaches now
      }

        b.m.position.set(-(COPIES / 2) * W - scroll, Y.beachY(Y.wl) - 0.04, z);
        b.m.material.opacity = 0.75 * smoothstep(0, 0.25, t) * (1 - smoothstep(0.6, 1, t));
      }
    },
  };
}

// Falling snow: a few layers of flakes, each a slab that tiles vertically and repeats along the strip like the
// props; the slabs sink a whole number of times per loop (seamless) and drift a little sideways.
function buildSnowfall(loc) {
  const rate = loc.snow?.falling ?? 0, group = new THREE.Group(), rnd = mulberry32(93), layers = [];
  if (!rate) return null;
  const H = 14, per = Math.round((rate * W * 60) / 100), geo = new THREE.OctahedronGeometry(0.035, 0);
  const m = new THREE.MeshBasicMaterial({ color: 0xffffff, fog: true });
  for (let l = 0; l < 3; l++) {
    const mesh = new THREE.InstancedMesh(geo, m, per * 2 * (COPIES + 1));
    let i = 0;
    for (let f = 0; f < per; f++) {
      const x = rnd() * W, y = rnd() * H, z = (rnd() - 0.5) * 60, s = 0.7 + rnd() * 0.8;
      for (let c = 0; c <= COPIES; c++) for (let v = 0; v < 2; v++) mesh.setMatrixAt(i++, _m.compose(_p.set(x + c * W, y + v * H, z), _q.identity(), _s.setScalar(s)));
    }
    mesh.frustumCulled = false;
    group.add(mesh);
    layers.push({ mesh, ph: rnd(), fall: 1 + l * 0.35 });
  }
  return {
    group,
    update(p, scroll) {
      const n = Math.max(1, Math.round(loopPeriod / 9)); // each slab falls its height every ~9 s
      for (const L of layers) L.mesh.position.set(-(COPIES / 2) * W - scroll + Math.sin(TAU * (p + L.ph)) * 0.6, -H * wrap01(n * L.fall * p + L.ph) - 0.5, 0);
    },
  };
}

// Rain (`rain` { intensity 0..1, slantDeg, color }): streaks in a box round the horse, a whole number of box lengths
// per scenery period and of box heights per loop, so the loop stays seamless. Each streak is the path its drop sweeps
// in a short exposure as seen from the camera, which rides with the horse: at a walk the rain falls nearly straight,
// at racing speed it rakes back past the horse. Wind (`slantDeg`) blows it across the course.
function buildRain(loc) {
  const R = loc.rain;
  if (!R?.intensity) return null;
  const rnd = mulberry32(77), H = 12, Lx = W / Math.max(1, Math.round(W / 36)), Z = 18, N = Math.round(1700 * R.intensity), FALL = 8.5;
  const pos = new Float32Array(4 * 3 * 3), geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.MeshBasicMaterial({ color: hex(R.color ?? '#cfd7de'), transparent: true, opacity: 0.2 + 0.2 * R.intensity, depthWrite: false, side: THREE.DoubleSide });
  const mesh = new THREE.InstancedMesh(geo, mat, N * 6);
  let i = 0;
  for (let n = 0; n < N; n++) {
    const x = rnd() * Lx, y = rnd() * H, z = (rnd() - 0.5) * 2 * Z, s = 0.7 + rnd() * 0.6;
    for (let c = -1; c <= 1; c++) for (let v = 0; v < 2; v++) mesh.setMatrixAt(i++, _m.compose(_p.set(x + c * Lx, y + v * H, z), _q.identity(), _s.setScalar(s)));
  }
  mesh.frustumCulled = false;
  let shape = null;
  const sweep = (v) => { // two crossed thin quads along the drop's path over a 35 ms exposure
    const t = 0.035, wind = Math.tan(((R.slantDeg ?? 0) * Math.PI) / 180) * FALL, d = [v * t, FALL * t, -wind * t];
    const len = Math.hypot(d[0], d[1]), w = 0.0045, offs = [[0, 0, w], [(-d[1] / len) * w, (d[0] / len) * w, 0]];
    let k = 0;
    for (const o of offs) {
      const a0 = [-o[0], -o[1], -o[2]], a1 = o, b0 = [d[0] - o[0], d[1] - o[1], d[2] - o[2]], b1 = [d[0] + o[0], d[1] + o[1], d[2] + o[2]];
      for (const q of [a0, a1, b1, a0, b1, b0]) { pos.set(q, k); k += 3; }
    }
    geo.attributes.position.needsUpdate = true;
    geo.computeBoundingSphere();
  };
  return {
    group: mesh,
    update(p, scroll) {
      const v = W / loopPeriod; // the ground's speed past the horse
      if (shape !== v) { shape = v; sweep(v); }
      const n = Math.max(1, Math.round((loopPeriod * FALL) / H));
      mesh.position.set(-(scroll - Math.floor(scroll / Lx) * Lx), -H * wrap01(n * p), 0);
    },
  };
}

// Breath in cold air: a puff from the nostrils at each exhale. At a canter or gallop horses breathe once per
// stride (locomotor-respiratory coupling); at a walk or trot about every 2.5 s. Puffs hang in the air (they move
// back with the ground), grow and fade.
function buildBreath() {
  const group = new THREE.Group(), m = new THREE.MeshLambertMaterial({ color: 0xf2f4f6, transparent: true, depthWrite: false, opacity: 0 }), puffs = [];
  const geo = jitter(new THREE.IcosahedronGeometry(1, 0), 0.15, 557);
  for (let i = 0; i < 4; i++) { const mesh = new THREE.Mesh(geo, m.clone()); mesh.visible = false; group.add(mesh); puffs.push(mesh); }
  const nose = V(0, 0);
  return {
    group,
    update(p, r) {
      const G = r.gait, coupled = ['canter', 'gallop', 'race'].includes(G.key), n = coupled ? G.strides : Math.max(1, Math.round(loopPeriod / 2.5));
      const life = Math.min(1.2, (0.9 * loopPeriod) / n), speed = W / loopPeriod;
      r.head.updateMatrixWorld(true);
      r.head.localToWorld(nose.set(0.62 * Math.cos(HEAD_TILT) + 0.02 * Math.sin(HEAD_TILT), 0.62 * Math.sin(HEAD_TILT) - 0.02 * Math.cos(HEAD_TILT), 0)); // the nostrils, in the head's own frame
      puffs.forEach((mesh, i) => {
        const age = (wrap01(n * p - i / puffs.length) / n) * loopPeriod; // seconds since this puff's exhale
        const on = i < Math.min(puffs.length, Math.ceil((life * n) / loopPeriod) + 1) && age < life;
        mesh.visible = on;
        if (!on) return;
        const t = age / life;
        mesh.position.set(nose.x - speed * age + 0.25 * t, nose.y - 0.08 * t, nose.z);
        mesh.scale.setScalar(0.05 + 0.18 * t);
        mesh.material.opacity = 0.45 * (1 - t) ** 1.5 * smoothstep(0, 0.1, t);
      });
    },
  };
}

// Hoof prints in the sand behind the hero: each hoof's last few touchdowns, carried back with the ground,
// fading with distance (a pure function of the loop phase, like everything else).
function buildPrints(loc) {
  const Y = beachLayout(loc), K = 14, geo = new THREE.CircleGeometry(0.06, 9).scale(1.2, 1, 1).rotateX(-Math.PI / 2);
  const mesh = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ roughness: 1, polygonOffset: true, polygonOffsetFactor: -2 }), LEGS.length * K);
  mesh.frustumCulled = false;
  const dark = colorOf(loc.sand?.print ?? '#6f5f4a'), wet = colorOf(loc.sand?.wet ?? '#8f7d63'), dry = colorOf(loc.sand?.dry ?? '#cdb994'), c = new THREE.Color();
  return {
    mesh,
    update(p, r, heightAt, scroll) {
      const G = r.gait, sc = r.scale;
      LEGS.forEach((L, li) => {
        const P = L.fore ? G.fore : G.hind, z = L.side * (L.fore ? r.legZ?.fore ?? FORE.z : r.legZ?.hind ?? HIND.z) * sc, x0 = (P.xc + G.stanceLen / 2 + HOOF_TOE * 0.4) * sc;
        const since = wrap01(p * G.strides - G.land?.[L.id]) / G.strides; // loop time since this hoof last landed
        for (let n = 0; n < K; n++) {
          const d = (since + n / G.strides) * W, i = li * K + n, onSand = Y.toSea(z) < 0;
          const show = !G.stand && G.stride > 0 && onSand && d < 40;
          const xs = x0 - d;

      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    },

}

function buildWorld(loc) {
  const S = loc.hand === 'right' || loc.path?.dir === 'cw' ? -1 : 1, t = loc.time ?? {};
  PATH = loc.path ? makePath(loc.path, S) : null; // path mode: the scenery is bent round a closed walking path
  W = PATH ? PATH.L : loc.W ?? 65;
  const fogFar = t.fogFar ?? 92, reach = fogFar + (loc.stand ? Math.min(loc.stand.lengthM ?? 220, W - 60) / 2 : 12);
  COPIES = 1;
  while (!PATH && (COPIES * W) / 2 < reach) COPIES += 2; // odd, so the strip and the wrap agree; its edge stays in the fog
  // at night the key light is the floodlights: high and from the stand side (the sun itself is below the horizon)
  const night = !!t.night, sunDir = sunDirOf(night ? { sunElevDeg: loc.floodlights?.elevDeg ?? 52, sunAzimDeg: loc.floodlights?.azimDeg ?? 12 } : t, S);
  const sky = { ...DEFAULT_SKY, ...(t.sky ?? {}) };
  TERRAIN = PATH ? null : makeTerrain(loc);
  const gspec = GROUND[loc.builder](loc, S), ground = buildGround(gspec);
  const kit = makeKit(loc, ground.heightAt, S);
  PROP_BUILDERS[loc.builder](kit, loc);
  const group = new THREE.Group();
  group.add(ground.mesh);
  if (PATH) group.add(buildPathCentre(loc, S, gspec.dx));
  const surf = loc.builder === 'beach' ? buildSurf(loc) : null, prints = loc.prints ? buildPrints(loc) : null, snowfall = buildSnowfall(loc), breath = loc.breath ? buildBreath() : null, rain = PATH ? null : buildRain(loc);
  if (surf) group.add(surf.group);
  if (snowfall) group.add(snowfall.group);
  if (prints) group.add(prints.mesh);
  kit.sets.forEach((s) => group.add(s.mesh));
  const back = loc.backdrop ?? {};
  const statics = new THREE.Group();
  if (breath) statics.add(breath.group); // puffs are placed in scene space each frame
  if (rain) statics.add(rain.group);      // the rain box rides with the horse
  statics.add(buildSky(night ? V(0, -1, 0) : sunDir, sky), buildBackdrop(sunDir, { horizon: sky.horizon, ranges: back.ranges ?? DEFAULT_RANGES, landmarks: back.landmarks, clouds: back.clouds, seed: back.seed, night }, S));
  return { loc, S, group, statics, ground, props: kit.sets, sunDir, sky, night, fog: [t.fogNear ?? 24, fogFar], path: PATH, surf, prints, snowfall, breath, rain, terrain: TERRAIN };
}

// Dust kicked up at each hoof strike; a pure function of gait phase (one puff per hoof per stride).
function buildDust() {
  const group = new THREE.Group(), rnd = mulberry32(555), puffs = [];
  const geo = jitter(new THREE.IcosahedronGeometry(1, 0), 0.12, 556);
  const m = new THREE.MeshLambertMaterial({ color: PAL.dust, flatShading: true, transparent: true, depthWrite: false });
  for (const L of LEGS) {
    const mats = m.clone(), parts = [];
    for (let i = 0; i < 6; i++) {
      const mesh = new THREE.Mesh(geo, mats);
      const a = rnd() * TAU;
      parts.push({ mesh, dx: Math.cos(a) * (0.5 + rnd()) - 0.6, dz: Math.sin(a) * (0.5 + rnd()), up: 0.4 + rnd(), r: 0.07 + rnd() * 0.07 });
      group.add(mesh);
    }
    puffs.push({ L, m: mats, parts, big: L.fore ? 0.8 : 1 });
  }
  return { group, puffs, on: true, color: PAL.dust, colors: null, styleAt: null, setColor(c) { this.color = c; puffs.forEach((pf) => { pf.style = null; pf.m.color.set(hex(c)); }); } };
}
// Kick-up styles per surface: dry dust drifts, wet sand throws small dark clods that fall back, water splashes up.
const KICK = {
  dust: { life: 0.55, rise: 0.22, spread: 1, size: 1, opacity: 0.5, fall: 0 },
  clods: { life: 0.3, rise: 0.5, spread: 0.7, size: 0.45, opacity: 0.9, fall: 1 },
  splash: { life: 0.35, rise: 0.9, spread: 1.2, size: 0.6, opacity: 0.7, fall: 1 },
};
function updateDust(dust, g, rig) {
  const G = rig.gait, s = rig.scale, live = dust.on && G.dust;
  for (const pf of dust.puffs) {
    const P = pf.L.fore ? G.fore : G.hind, z = pf.L.side * (pf.L.fore ? rig.legZ?.fore ?? FORE.z : rig.legZ?.hind ?? HIND.z) * s;
    const style = dust.styleAt ? dust.styleAt(z) : 'dust', K = KICK[style] ?? KICK.dust;
    if (pf.style !== style) { pf.style = style; pf.m.color.set(hex(dust.colors?.[style] ?? dust.color ?? PAL.dust)); }
    const x0 = (P.xc + G.stanceLen / 2) * s;
    const a = wrap01(g - G.land[pf.L.id]), t = a / K.life;
    const on = live && t < 1;
    pf.m.opacity = on ? K.opacity * smoothstep(0, 0.06, t) * (1 - t) ** 2 : 0;
    const spread = (0.12 + 0.55 * (1 - (1 - Math.min(t, 1)) ** 2)) * K.spread;
    for (const p of pf.parts) {
      p.mesh.visible = on;
      if (!on) continue;
      const arc = K.fall ? 4 * t * (1 - t) : t; // clods and droplets fly up and fall back; dust keeps rising
      p.mesh.position.set(x0 - G.stride * s * a + p.dx * spread * 0.5, 0.03 + p.up * K.rise * arc + p.r * 0.5, z + p.dz * spread * 0.35);
      p.mesh.scale.setScalar(p.r * pf.big * K.size * (0.5 + 1.4 * (K.fall ? 0.5 : t)));
    }
  }
}

// Generic (non-roster) horses for the background: a plausible random coat, simple markings.
function genericLook(rnd) {
  const key = pick(['kage', 'kage', 'kurokage', 'kuri', 'kuri', 'ashige', 'aokage', 'tochikuri'], rnd);
  const leg = () => (rnd() < 0.18 ? pick(['coronet', 'pastern', 'sock'], rnd) : 'none');

    face: pick(['none', 'none', 'star', 'stripe', 'star-stripe', 'blaze', 'star-snip'], rnd),
    legs: { LF: leg(), RF: leg(), LH: leg(), RH: leg() },

}

const STYLES = { nige: ['逃げ', 'Front-runner'], senko: ['先行', 'Stalker'], sashi: ['差し', 'Closer'], oikomi: ['追込', 'Deep closer'] };

// Race-day tack on a racecourse: the saddle cloth (white with a black number, as in JRA races) over a black

// Cloth colours follow the location's signature race (`loc.saddleCloth`): JRA G1 = 紫紺 with white text, the

// The rider: on a racecourse a jockey in the owner's silks with the bracket-coloured cap; on the training hill a work

function saddleFor(h, loc) {

// Owner's silks (勝負服) from the JRA notation in `silks.desc`, e.g. 「黄、青一本輪、袖青」: body colour, then the pattern on
// the body, then the sleeves (X袖 = sleeves of colour X, 袖X一本輪 = a hoop of X on the sleeves). Colour words are matched to
// the nearest of the researched `silks.colors`; without a JRA string the body is colors[0] and the sleeves colors[1].
const SILK_WORDS = [['水色', '#6ec6ea'], ['薄紫', '#b49bd3'], ['海老', '#8a2a3a'], ['えんじ', '#8a2030'], ['桃', '#f080c0'], ['紫', '#6a3a9a'], ['赤', '#d22630'], ['青', '#1f4fb4'], ['黄', '#f5d000'], ['緑', '#1f8a3c'], ['白', '#f4f4f0'], ['黒', '#151515'], ['茶', '#7a4a2a'], ['鼠', '#8a8a8a'], ['灰', '#8a8a8a'], ['橙', '#f08020']];
const SILK_PATTERNS = [['十字襷', 'cross'], ['襷', 'sash'], ['山形一文字', 'chevronBand'], ['山形', 'chevron'], ['菱山形', 'chevron'], ['一文字', 'band'], ['縦縞', 'stripes'], ['格子', 'checks'], ['元禄', 'checks'], ['鋸歯形', 'sawtooth'], ['玉霰', 'spots'], ['銭形', 'spots'], ['星', 'stars'], ['菱形', 'diamonds'], ['蛇目', 'ring'], ['段', 'bands'], ['輪', 'hoops']];
function parseSilks(silks) {

function disposeTree(root) {
  const mats = new Set();
  root.traverse((o) => {
    o.geometry?.dispose();
    if (o.material) [].concat(o.material).forEach((m) => mats.add(m));
    if (o.isInstancedMesh) o.dispose();
    if (o.isSkinnedMesh) o.skeleton.dispose();
  });
  mats.forEach((m) => { m.map?.dispose(); m.dispose(); }); // the saddle cloth has its own canvas texture

function rebuildHorse() {

  rig = buildHorse(currentLook());
  rig.tackKey = tackKey();
  rig.materials.forEach((m) => { m.wireframe = wireOn; });
  scene.add(rig.root);
  setGait(state.gait);
}

// Gait of the hero (and the companions walking with it); the loop length follows the hero.
function setGait(key, { blend = false } = {}) {

  const change = (r) => { // blend from the old gait when the viewer switches gait while it plays

    r.blend = blend && playing && from && from.key !== to.key

const blobGeo = new THREE.CircleGeometry(1, 12).rotateX(-Math.PI / 2);

/* ----- Race mode (racecourses): the hero races a field of roster racehorses -----
   The hero stays at the origin, so every runner is placed relative to it. A race is a short story told in
   metres behind a virtual leader: out of the gate abreast, settled into running-style order (逃げ in front,
   追込 at the back) in lanes off the inner rail, then the home straight, where the field fans out across the
   course and the closers come wide. The story runs at 16 m/s; at a slower gait its clock slows by the same
   factor, so the field keeps its shape. Each runner's gait phase follows the ground it covers (the scroll plus
   its own offset), so its hooves stay planted while it gains or drops back; it turns into its sideways drift.
   The field is 18 runners (the cap colours assume a full field): the hero plus the 17 roster racehorses
   foaled closest to it, each in its own silks, gear and coat, numbered round the hero's own number. */
const RACE = {
  secs: 52,        // one race, start to restart (s of story at 16 m/s)
  settle: 8,       // out of the gate and into running-style order
  turnIn: 28,      // the home turn: the field starts to fan out and the order to change
  post: 45,        // the leader reaches the winning post
  speed: 16,       // m/s the story is told at
  lane: 1.25,      // m between lanes in the back straight
  fan: 0.95,       // m between neighbours once the field fans out in the straight
  rail: 0.9,       // m from the inner rail to the first lane
  spacing: 4,      // m nose to nose in one lane
  stall: 1.15,     // m from one gate stall to the next
  split: 0.3,      // m between the gate's two sections (stalls 1-10 and 11-18)

const STYLE_GAP = { nige: [0, 2.5], senko: [4, 10], sashi: [11, 18], oikomi: [19, 27] }; // m behind the leader in the back straight
const STYLE_KICK = { nige: -0.22, senko: 0, sashi: 0.14, oikomi: 0.1 };                 // finishing order bias
let raceT = 0, raceNo = 0, racePlan = null, raceGate = null, racePost = null;

const raceOn = () => !!racePlan && state.race && state.loc?.builder === 'track' && ['race', 'gallop'].includes(state.gait);

// 17 roster racehorses nearest the hero by foaling year; numbers 1-18 dealt round the hero's own number
function raceField(hero) {
  const N = 18, mine = clamp(hero.saddleNumber ?? 1, 1, N), born = hero.born ?? 2000;
  const pool = ROSTER.filter((h) => h.silks && h.id !== hero.id)
    .sort((a, b) => Math.abs((a.born ?? 2000) - born) - Math.abs((b.born ?? 2000) - born) || a.en.localeCompare(b.en))
    .slice(0, N - 1);

// One race: each entry's gap behind the leader in the back straight (from its running style), its lane there,
// its wobble, and its margin at the post (from a seeded score, biased by style: front-runners fade, closers kick).
function planRace(entries, seed) {
  const rnd = mulberry32(seed);
  for (const e of entries) {
    const st = e.h.style ?? {}, key = st.secondary && rnd() < 0.3 ? st.secondary : st.primary;
    e.style = STYLE_GAP[key] ? key : 'senko';
    const [a, b] = STYLE_GAP[e.style];
    e.c = a + (b - a) * rnd();
    e.score = rnd() + STYLE_KICK[e.style] + (e.hero ? 0.12 : 0);
    e.wob = [0.25 + 0.25 * rnd(), 0.3 + 0.3 * rnd(), rnd() * TAU]; // amplitude (m), rate (rad/s), phase
    e.slow = rnd() < 0.15 ? 1 + 1.5 * rnd() : 0;                    // a slow break costs a length or so
  }

  byGap.forEach((e, r) => { // the innermost lane that is clear of the horse ahead in it; abreast, the one ahead is inside
    e.rank = r;
    if (e.hero) return;
    let l = 0;
    while (laneEnd[l] !== undefined && e.c - laneEnd[l] < RACE.spacing) l++;
    laneEnd[l] = e.c; e.lane = l;
  });

  // sits just outside its row, and off the home turn it comes wide round the field (a front-runner keeps its line).
  const hero = entries.find((e) => e.hero), fan = byGap.filter((e) => !e.hero);

  fan.forEach((e, k) => { e.home = RACE.rail + k * RACE.fan; });
  let f = 0;
  [...entries].sort((a, b) => b.score - a.score).forEach((e, i) => { e.place = i + 1; e.f = f; f += 0.3 + 4 * rnd() * rnd(); });

// Gap behind the virtual leader (m) and distance out from the inner rail (m) at story time t
function raceSpot(e, t) {
  const e1 = smoothstep(0, RACE.settle, t), e2 = smoothstep(RACE.turnIn, RACE.post, t), w = e1 * (1 - e2);
  const gap = lerp(lerp(e.slow * smoothstep(0, 1.5, t), e.c, e1), e.f, e2) + e.wob[0] * Math.sin(e.wob[1] * t + e.wob[2]) * w;

  const out = lerp(lerp(gate, back, smoothstep(0, 14, t)), e.home, smoothstep(RACE.turnIn - 6, RACE.turnIn + 5, t));
  return [gap, out];

// Everyone's position at story time t: x ahead of the hero, out from the rail; side by side, a soft push apart.
function raceLayout(t) {
  const P = racePlan, spots = P.map((e) => raceSpot(e, t)), hero = spots[0];
  const xs = spots.map(([g]) => hero[0] - g), outs = spots.map(([, o]) => o);
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
    const dx = Math.abs(xs[i] - xs[j]), dz = outs[i] - outs[j];
    if (dx > 2.8 || Math.abs(dz) > 0.95) continue;
    const push = ((0.95 - Math.abs(dz)) / 2) * (1 - smoothstep(2.1, 2.8, dx)) * (dz < 0 ? -1 : 1);

function spawnField() {

    const look = lookFor(h, {}, loc);
    if (look.saddle) look.saddle = { ...look.saddle, number };
    if (look.jockey) look.jockey = { ...look.jockey, cap: BRACKET_CAP[bracketOf(number) - 1] };
    const r = buildHorse(look, 1000 + number * 37);

    r.root.add(blobShadow());
    r.materials.forEach((m) => { m.wireframe = wireOn; });
    scene.add(r.root);
    const e = { h, number, rig: r };
    entries.push(e);
    extras.push({ mode: 'field', rigs: [r], entry: e, phase: (number * 0.61) % 1 });
  }
  racePlan = planRace(entries, 101 + raceNo);
  if (!raceGate) { raceGate = buildGate(world.S, loc); racePost = buildPost(); }
  world.group.add(raceGate, racePost);

// on the inner rail. White aluminium posts, grey padded partitions and doors (the front ones flung open), a green
// truss over the top carrying yellow number plates, and a white sign band with the course's name on top.
// Sizes are read off photos against the tractor (no published spec): stalls ~1.15 m apart, the truss ~4.3 m up.

    box(0.06, 1.4, RACE.stall - 0.14, -L / 2, 1.05, z, PAD);
  }
  for (const [a, b] of [[z0, stallOut(10) + half], [stallOut(11) - half, z1]]) { // each section's truss and wheels
    const mid = (a + b) / 2, span = b - a + 0.1;
    for (const x of [L / 2, -L / 2]) {
      box(0.18, 0.18, span, x, TOP - 0.62, mid, GREEN);
      box(0.18, 0.18, span, x, TOP, mid, GREEN);
      for (let z = a; z <= b + 0.01; z += (b - a) / Math.round((b - a) / 1.2)) box(0.12, 0.6, 0.12, x, TOP - 0.31, z, GREEN);
    }
    box(L, 0.12, 0.18, 0, TOP, a, GREEN);
    box(L, 0.12, 0.18, 0, TOP, b, GREEN);
    box(0.12, 0.9, span, L / 2 - 0.05, TOP + 0.55, mid, SIGN);                     // the sign band
    for (const z of [a + 0.6, mid, b - 0.6]) for (const x of [-L / 2 + 0.25, L / 2 - 0.25]) {
      const wh = new THREE.CylinderGeometry(0.28, 0.28, 0.22, 10).rotateX(Math.PI / 2).translate(x, 0.28, z * S);
      geos.push(paint(wh, flat(0x252525, rnd, 0.02)));
    }
  }
  const group = new THREE.Group();
  const mesh = new THREE.Mesh(merge(geos), new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.75 }));
  mesh.castShadow = mesh.receiveShadow = true;
  // the faces of the truss and the sign band: one canvas each, plates and lettering placed stall by stall
  const face = (y0, h, draw) => {
    const span = z1 - z0, cv = document.createElement('canvas');
    cv.width = 2048; cv.height = Math.round((2048 * h) / span);
    const g = cv.getContext('2d'), u = (z) => ((S > 0 ? z1 - z : z - z0) / span) * cv.width; // the plane's u runs toward -z
    draw(g, u, cv.width / span, cv.height);
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(span, h).rotateY(Math.PI / 2), new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.8 }));
    m.position.set(L / 2 + 0.1, y0 + h / 2, (S * (z0 + z1)) / 2);
    group.add(m);
  };
  face(TOP - 0.55, 0.45, (g, u, k, H) => { // yellow plates with black numbers, one per stall
    g.font = `800 ${Math.round(H * 0.8)}px system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (let n = 1; n <= N; n++) {
      const c = u(stallOut(n)), w = 0.5 * k;
      g.fillStyle = '#f5c800'; g.fillRect(c - w / 2, H * 0.06, w, H * 0.88);
      g.fillStyle = '#141414'; g.fillText(String(n), c, H * 0.53);
    }
  });
  face(TOP + 0.15, 0.8, (g, u, k, H) => { // the course's name in white on dark green boxes, one per section
    const name = (loc.en ?? '').replace(/\s*\(.*\)/, '').toUpperCase();
    g.font = `700 ${Math.round(H * 0.42)}px system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const [a, b] of [[stallOut(1), stallOut(10)], [stallOut(11), stallOut(N)]]) {
      const c = (u(a) + u(b)) / 2, w = Math.abs(u(b) - u(a)) * 0.7;
      g.fillStyle = '#1e6b45'; g.fillRect(c - w / 2, H * 0.14, w, H * 0.72);
      g.fillStyle = '#f4f6f4'; g.fillText(name, c, H * 0.52, w * 0.92);
    }
  });
  group.add(mesh);
  group.name = 'raceGate';
  return group;
}

// The winning post (ゴール板) on the inside of the course: a grey plinth and the dark mirror box of the photo-finish
// camera, framed by two white pylons with the course's badge on top (Tokyo's style; every course has its own frame).
function buildPost() {
  const rnd = mulberry32(19), geos = [];
  const add = (g, color) => geos.push(paint(g, flat(hex(color), rnd, 0.02)));
  add(new THREE.BoxGeometry(0.7, 1.1, 0.7).translate(0, 0.55, 0), '#9a9a94');        // plinth
  add(new THREE.BoxGeometry(0.34, 2.7, 0.3).translate(0, 1.1 + 1.35, 0), '#1f2a27');  // mirror box
  for (const side of [-1, 1]) add(new THREE.BoxGeometry(0.16, 4.8, 0.16).rotateX(side * 0.09).translate(0, 2.4, side * 0.34), '#f2f5f2'); // pylons
  add(new THREE.CylinderGeometry(0.42, 0.42, 0.08, 16).rotateZ(Math.PI / 2).translate(0, 5.0, 0), '#4ec3de'); // badge
  const mesh = new THREE.Mesh(merge(geos), new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.7 }));
  mesh.castShadow = true;
  mesh.name = 'racePost';
  return mesh;
}

// Per frame: place the field, the hero's lane (the course slides sideways under the hero), the gate and the post.
function updateRace(p, scroll, under, y0) {
  const on = raceOn(), S = world.S, T = world.terrain, inner = trackLayout(state.loc).inner, t0 = raceT;
  if (raceGate) { raceGate.visible = on && t0 < 6; racePost.visible = on; }
  for (const ex of extras) if (ex.mode === 'field') ex.rigs[0].root.visible = on;
  if (!on) { world.group.position.z = 0; rig.root.rotation.y = 0; raceHud(''); return; }
  if (raceT >= RACE.secs) { raceT %= RACE.secs; raceNo++; racePlan = planRace(racePlan, 101 + raceNo); }
  const t = raceT, now = raceLayout(t), soon = raceLayout(t + 0.05); // heading: into the drift over the next 0.05 s
  const heading = (i) => -Math.atan2(S * (soon.outs[i] - now.outs[i]), RACE.speed * 0.05 + soon.xs[i] - now.xs[i]);
  const heroOut = inner + now.outs[0], push = 0.22 * smoothstep(RACE.turnIn + 3, RACE.turnIn + 8, t) * (1 - smoothstep(RACE.post + 0.5, RACE.post + 3, t));
  rig.push = push;
  for (const e of racePlan) if (!e.hero) e.rig.push = push * (0.8 + 0.4 * ((e.number * 0.37) % 1));
  world.group.position.z = -S * heroOut;
  rig.root.rotation.y = heading(0);
  racePlan.forEach((e, i) => {
    if (e.hero) return;
    const r = e.rig, x = now.xs[i], at = under + x;
    r.root.position.set(x, T ? T.h(at) - y0 : 0, S * (inner + now.outs[i] - heroOut));
    r.root.rotation.set(0, heading(i), T ? Math.atan(T.slope(at)) : 0);
    // a runner passing right by the lens (out of the gate, the field is all round the camera) is dropped for the moment
    r.root.visible = _v.set(x, r.root.position.y + 1.3, r.root.position.z).distanceTo(camera.position) > 3.2;
    const G = r.gait, strideM = W / G.strides;
    pose(r, wrap01((scroll + x) / strideM + ((e.number * 0.61) % 1)), p);
  });
  // the gate opened at t = 0 round the field and stays on the ground; the post is passed by the leader at t = post
  const lead = raceSpot(racePlan[0], RACE.post)[0];
  raceGate.position.set(-RACE.speed * t - 0.3, T ? T.h(under - RACE.speed * t) - y0 : 0, S * inner);
  racePost.position.set(lead + 1.3 + RACE.speed * (RACE.post - t), 0, S * (inner - 0.35));
  racePost.position.y = T ? T.h(under + racePost.position.x) - y0 : 0;
  // the HUD: the hero's place on the run and the leader, then the result
  const order = racePlan.map((e, i) => [now.xs[i], e]).sort((a, b) => b[0] - a[0]), me = order.findIndex(([, e]) => e.hero) + 1;
  const ord = (n) => n + (n % 100 > 10 && n % 100 < 14 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] ?? 'th');
  const winner = racePlan.find((e) => e.place === 1);
  raceHud(t < 1.5 ? 'They\u2019re off!'
    : t < RACE.post ? `${t < RACE.turnIn ? 'Back straight' : 'Home straight'} \u00b7 ${ord(me)} of ${racePlan.length}${me > 1 ? ` \u00b7 ${order[0][1].h.en} leads` : ''}`
    : `${winner.hero ? 'Won!' : `${ord(racePlan[0].place)} \u00b7 won by ${winner.h.en}`}`);
}
let hudText = null;
function raceHud(text) {
  if (text === hudText) return;
  hudText = text;
  const el = $('raceHud');
  el.textContent = text;
  el.hidden = !text;
}

function setLocation(id) {
  const loc = LOC_LIST.find((l) => l.id === id) ?? LOC_LIST[0];
  clearExtras();
  if (world) { scene.remove(world.group, world.statics); disposeTree(world.group); disposeTree(world.statics); raceGate = racePost = null; }
  state.loc = loc;
  world = buildWorld(loc);
  scene.add(world.group, world.statics);
  const t = loc.time ?? {};
  scene.fog = new THREE.Fog(hex(world.sky.horizon), world.fog[0], world.fog[1]);
  scene.background = colorOf(world.sky.horizon);
  hemi.color.set(hex(t.hemiSky ?? 0xdfe6f0));
  hemi.groundColor.set(hex(t.hemiGround ?? 0x8a7550));
  hemi.intensity = t.hemiIntensity ?? 1.25;
  const flood = world.night ? loc.floodlights ?? {} : null; // banks of lamps on both sides light the horse at night
  sun.color.set(hex(flood ? flood.color ?? '#f4f2ea' : t.sunColor ?? 0xffe7c4));
  sun.intensity = flood ? 2.6 * (flood.intensity ?? 1) : t.sunIntensity ?? 2.9;
  sun.position.copy(world.sunDir).multiplyScalar(14);
  fill.position.set(-world.sunDir.x, Math.max(0.35, world.sunDir.y), -world.sunDir.z).multiplyScalar(14);
  fill.color.set(hex(flood ? flood.color ?? '#f4f2ea' : 0xdfe8f4));
  fill.intensity = flood ? 1.1 * (flood.intensity ?? 1) : t.fillIntensity ?? 0.55;
  renderer.toneMappingExposure = t.exposure ?? 1.02;
  document.body.classList.toggle('night', world.night);
  dust.on = loc.dust !== null;
  dust.setColor(loc.dust ?? PAL.dust);
  // on a beach the kick-up follows the surface under each hoof: splashes in the sea, clods off wet sand, dust off dry sand
  if (loc.builder === 'beach') {
    const Y = beachLayout(loc);
    dust.colors = { dust: loc.dust ?? loc.sand?.dry ?? PAL.dust, clods: loc.sand?.wet ?? '#8f7d63', splash: loc.sea?.foam ?? '#e8ecea' };
    dust.styleAt = (z) => (Y.toSea(z) > 0 || world.surf?.wet(z) ? 'splash' : Y.toSea(z) > -Y.wetW ? 'clods' : 'dust');
  } else if (loc.rain?.intensity) {
    dust.colors = { dust: loc.dust ?? PAL.dust, clods: loc.dust ?? '#4f5a34' };
    dust.styleAt = () => 'clods';
  } else { dust.colors = null; dust.styleAt = null; }
  state.lead = loc.lead ?? 'L';
  // the saddle, cloth, rug and rider depend on the location (a Derby cloth, a training cloth, none at the farm): rebuild if they change
  if (rig && rig.tackKey !== tackKey()) rebuildHorse();
  spawnExtras();
  setGait(loc.gait ?? 'gallop');
  syncTitle();
  if ($('locSel')) $('locSel').value = loc.id;
  setView(currentView);
}

function setHorse(id) {
  state.horse = HORSE_LIST.find((h) => h.id === id) ?? HORSE_LIST[0];
  state.custom = {};
  rebuildHorse();
  if (world?.path || (state.race && state.loc.builder === 'track')) { spawnExtras(); setGait(state.gait); } // the field renumbers round the hero
  syncTitle();
  syncPanel();
  setView(currentView);
}

// Path mode: the hero stays at the origin facing +X, so the ring is moved and turned the other way under it;
// the far scenery and the sun turn with the ring (shadows and shading follow the horse round the bends).
function placeOnPath(s) {
  const f = world.path.at(s), c = Math.cos(f.phi), sn = Math.sin(f.phi), turn = (v) => V(v.x * c - v.z * sn, v.y, v.x * sn + v.z * c);
  world.group.rotation.y = -f.phi;
  world.group.position.set(-(f.x * c - f.z * sn), 0, -(f.x * sn + f.z * c));
  world.group.updateMatrix();
  world.group.matrixWorld.copy(world.group.matrix);
  world.statics.rotation.y = -f.phi;
  const d = world.sunDir;
  sun.position.copy(turn(d)).multiplyScalar(14);
  fill.position.copy(turn(V(-d.x, Math.max(0.35, d.y), -d.z))).multiplyScalar(14);
}

function applyPhase(p) {
  const g = wrap01(p * rig.gait.strides), scroll = p * W;
  if (world.path) { placeOnPath(scroll); rig.gait.pathS = scroll; }
  const T = world.terrain, under = (COPIES / 2) * W + scroll, y0 = T ? T.h(under) : 0; // strip x under the hero
  rig.root.rotation.z = T ? Math.atan(T.slope(under)) : 0;
  pose(rig, g, p);
  if (!world.path) {
    world.ground.mesh.position.set(-(COPIES / 2) * W - scroll, -y0, 0);
    updateProps(world.props, scroll);
    if (T) for (const { mesh } of world.props) mesh.position.y = -y0;
    world.surf?.update(p, scroll);
    world.snowfall?.update(p, scroll);
    world.rain?.update(p, scroll);
    world.prints?.update(p, rig, world.ground.heightAt, scroll);
  }
  updateDust(dust, g, rig);
  world.breath?.update(p, rig);
  if (racePlan) updateRace(p, scroll, under, y0);
  for (const ex of extras) {
    if (ex.mode === 'field') continue;
    ex.rigs.forEach((r, c) => {
      if (ex.mode === 'grazer') r.root.position.x = wrapCentered(ex.x - W / 2 - scroll) + (c - (COPIES - 1) / 2) * W;
      if (T && ex.mode === 'companion') { r.root.position.y = T.h(under + ex.x) - y0; r.root.rotation.z = Math.atan(T.slope(under + ex.x)); }
      if (ex.mode === 'parade') { // walking the ring ahead of the hero, on the ring's own ground
        const s = scroll + ex.ahead, f = world.path.at(s);
        r.root.position.set(f.x, 0, f.z);
        r.root.rotation.y = f.phi;
        r.gait.pathS = s;
      }
      pose(r, wrap01(p * r.gait.strides + ex.phase), p);
    });
  }
}
function renderNow() { renderer.render(scene, camera); }

function setView(name) {
  const v = VIEWS[name];
  if (!v) return;
  currentView = name;
  userOrbited = false;
  controls.enableDamping = false;
  controls.update(); // flush any pending damped motion
  const k = rig?.scale ?? 1, target = V(v.tx * k, TARGET_Y * k, 0), dir = V(...v.dir);
  dir.z *= world ? (world.path ? -world.S : world.S) : 1; // in a paddock the camera stands on the centre lawn, looking out at the crowd
  camera.position.copy(target).addScaledVector(dir.normalize(), fitDistance(v));
  controls.target.copy(target);
  controls.update();
  controls.enableDamping = true;
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === name));
  if (rig && world) renderNow();
}
// Hook: jump to loop phase p and hold it (shown as paused in the UI); resume() plays on from there.
function setPhase(p) {
  setPlaying(false);
  for (const r of [rig, ...extras.flatMap((e) => e.rigs)]) r.blend = null;
  loopPhase = wrap01(p);
  applyPhase(loopPhase);
  renderNow();
}
function resume() { setPlaying(true); }

// World position of a hoof's toe (for slip checks): the front of the sole, in the hoof joint's frame.
function toeWorld(id, r = rig) {
  const L = r.legs.find((l) => l.id === id);
  return L.hoof.localToWorld(V(HOOF_TOE, SOLE - COFFIN_Y, 0));
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  barReserve = clamp(Math.round(h - barEl.getBoundingClientRect().top), 0, h / 3);
  document.documentElement.style.setProperty('--bar-h', `${barReserve}px`);
  const wide = w >= 900;
  panelReserve = wide && !panelEl.hidden ? Math.round(panelEl.getBoundingClientRect().right + 8) : 0;
  camera.fov = w < h ? 46 : 32;
  camera.aspect = (w + panelReserve) / (h + barReserve);
  camera.setViewOffset(w + panelReserve, h + barReserve, 0, barReserve, w, h); // also updates the projection
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // may change when the window moves between screens
  renderer.setSize(w, h);
  controls.maxDistance = Math.max(18, fitDistance(VIEWS.side) * 1.4);
  if (!userOrbited) setView(currentView);
}
window.addEventListener('resize', resize);
controls.addEventListener('start', () => { userOrbited = true; });

// ----- panel: pickers, the horse's card, coat / markings / build controls -----
function buildPickers() {
  const hs = $('horseSel'), years = new Map();
  for (const h of ROSTER) {
    const label = `Born ${h.bornApprox ? 'c.' : ''}${h.born}`;
    if (!years.has(label)) years.set(label, el('optgroup', { label }));
    years.get(label).append(el('option', { value: h.id, textContent: `${h.en}　${h.jp}` }));
  }
  hs.append(...years.values(), el('optgroup', { label: 'Custom' }, [el('option', { value: STUDIO.id, textContent: STUDIO.en })]));
  hs.addEventListener('change', () => setHorse(hs.value));

  const ls = $('locSel'), groups = new Map();
  const groupOf = (name) => {
    if (!groups.has(name)) groups.set(name, el('optgroup', { label: name }));
    return groups.get(name);
  };
  for (const l of LOC_LIST) groupOf(l.group ?? 'Other').append(el('option', { value: l.id, textContent: l.jp ? `${l.en}　${l.jp}` : l.en }));
  for (const q of window.LOCATION_QUEUE ?? []) groupOf(q.group).append(el('option', { value: '', disabled: true, textContent: `${q.en} — soon` }));
  ls.append(...groups.values());
  ls.addEventListener('change', () => { if (ls.value) setLocation(ls.value); });

  const sw = $('coatSwatches');
  for (const [key, c] of Object.entries(COATS)) {
    const b = el('button', { type: 'button', title: `${c.jp} ${c.en}`, ariaLabel: `${c.en} (${c.jp})` });
    b.dataset.coat = key;
    b.style.background = toCss(c.grey ? 0xb8b5b0 : c.coat);
    b.addEventListener('click', () => tweak((x) => { x.coat = { key, coatHex: null, mane: null, tail: null, pointsHex: null }; }));
    sw.append(b);
  }
  $('greyness').addEventListener('input', (e) => tweak((x) => { x.coat = { ...x.coat, greyness: +e.target.value }; }));
  $('dapple').addEventListener('input', (e) => tweak((x) => { x.coat = { ...x.coat, dapple: +e.target.value }; }));
  $('cCoat').addEventListener('input', (e) => tweak((x) => { x.coat = { ...x.coat, coatHex: e.target.value }; }, 'cCoat'));
  $('cMane').addEventListener('input', (e) => tweak((x) => { x.coat = { ...x.coat, mane: e.target.value, tail: null }; }, 'cMane'));
  $('cLegs').addEventListener('input', (e) => tweak((x) => { x.coat = { ...x.coat, pointsHex: e.target.value }; }, 'cLegs'));
  const fs = $('faceSel');
  fs.append(...Object.entries(MARKS).map(([v, t]) => el('option', { value: v, textContent: t })));
  fs.addEventListener('change', () => tweak((x) => { x.face = fs.value; }));
  for (const id of ['LF', 'RF', 'LH', 'RH']) {
    const s = $(`leg${id}`);
    s.append(...Object.entries(LEG_MARKS).map(([v, t]) => el('option', { value: v, textContent: t })));
    s.addEventListener('change', () => tweak((x) => { x.legs = { ...x.legs, [id]: s.value }; }));
  }
  $('withers').addEventListener('input', (e) => tweak((x) => { x.size = { ...x.size, withersCm: +e.target.value }; }));
  $('weight').addEventListener('input', (e) => tweak((x) => { x.size = { ...x.size, typicalKg: +e.target.value, weightKg: null }; }));
  for (const [group, table, box] of [['conf', CONF_CONTROLS, 'confRows'], ['run', RUN_CONTROLS, 'runRows']]) {
    for (const [key, label, min, max, step, hint] of table) {
      const input = el('input', { type: 'range', min, max, step, id: `${group}-${key}`, title: hint }), out = el('output', { id: `${group}-${key}-out` });
      input.addEventListener('input', () => tweak((x) => { x[group] = { ...x[group], [key]: +input.value }; }));
      $(box).append(el('label', { className: 'row', title: hint }, [el('span', { textContent: label }), input, out]));
    }
  }
  $('maneLen').addEventListener('input', (e) => tweak((x) => { x.maneLen = +e.target.value; }));
  $('tailLen').addEventListener('input', (e) => tweak((x) => { x.tailLen = +e.target.value; }));
  $('gearOn').addEventListener('change', (e) => tweak((x) => { x.gearOff = !e.target.checked; }));
  $('riderOn').addEventListener('change', (e) => tweak((x) => { x.noRider = !e.target.checked; }));
  $('resetLook').addEventListener('click', () => { state.custom = {}; rebuildHorse(); syncPanel(); });
}

// Apply a tweak to the viewer's overrides; rebuild the horse at most once per frame.
let pendingRebuild = 0;
function tweak(fn, editing = null) {
  fn(state.custom);
  if (pendingRebuild) return;
  pendingRebuild = requestAnimationFrame(() => {
    pendingRebuild = 0;
    rebuildHorse();
    syncPanel(editing);
  });
}

function sizeText(s = {}) {
  const kg = s.weightKg ? `${s.weightKg[0]}–${s.weightKg[1]} kg` : s.typicalKg ? `${Math.round(s.typicalKg)} kg` : null;
  return [kg, s.withersCm ? `${s.withersCm} cm at the withers` : null, s.build].filter(Boolean).join(' · ') || '—';
}
function markingText(h) {
  const legs = Object.entries(h.legs ?? {}).filter(([, v]) => v && v !== 'none').map(([k, v]) => `${k} ${LEG_MARKS[v]?.toLowerCase() ?? v}`);
  return [MARKS[h.face?.type ?? 'none'], legs.length ? `white ${legs.join(', ')}` : null].filter(Boolean).join('; ');
}
function renderCard() {
  const h = state.horse, card = $('horseCard');
  card.replaceChildren();
  if (h.studio) {
    card.append(el('p', { className: 'note', textContent: 'The original studio horse, not a roster horse. Customize it freely.' }));
    return;
  }
  const c = COATS[h.coat.key] ?? COATS.kage, st = STYLES[h.style?.primary];
  const rows = [
    ['Born', [`${h.bornApprox ? 'c. ' : ''}${h.born}`, SEX[h.sex], h.realName ? `real name ${h.realName}` : null].filter(Boolean).join(' · ')],
    ['Coat', `${h.coat.reg ?? c.jp} · ${c.en}${h.coat.key === 'ashige' && h.coat.greyness != null ? ` (${Math.round(h.coat.greyness * 100)}% grey)` : ''}`],
    ['Markings', markingText(h)],
    ['Style', st ? `${st[0]} ${st[1]}${h.style.secondary && STYLES[h.style.secondary] ? ` / ${STYLES[h.style.secondary][1].toLowerCase()}` : ''}` : 'n/a (never raced)'],
    ['Size', sizeText(h.size)],
    ['Gear', Object.entries({ hood: 'hood (メンコ)', blinkers: 'blinkers', shadowRoll: 'shadow roll', bitLifter: 'bit-lifter (ハミ吊り)', pompom: 'poll pompom', bandages: 'leg bandages' }).filter(([k]) => h.gear?.[k]).map(([, v]) => v).join(', ') || 'none noted'],
    ['Silks', h.silks?.desc || '—'],
    ['Career', h.career || '—'],
  ];
  const dl = el('dl');
  for (const [k, v] of rows) dl.append(el('dt', { textContent: k }), el('dd', { textContent: v }));
  if (h.style?.why) dl.children[7].title = h.style.why;
  card.append(dl);
  const q = QUIRKS[h.id];
  if (q?.notes?.length) {
    const p = el('p', { className: 'note' }, [el('strong', { textContent: 'Known for: ' })]);
    q.notes.forEach((n, i) => {
      p.append(i ? '; ' : '', n.text);
      if (n.source) {
        let host = n.source;
        try { host = new URL(n.source).hostname.replace(/^www\./, ''); } catch { /* keep the raw string */ }
        p.append(' (', el('a', { href: n.source, target: '_blank', rel: 'noopener', textContent: host }), ')');
      }
    });
    card.append(p);
  }
  if (h.uncertain?.length) card.append(el('p', { className: 'note', textContent: `Unconfirmed: ${h.uncertain.join(', ')}` }));
  if (h.sources?.length) {
    const p = el('p', { className: 'note' }, ['Sources: ']);
    h.sources.slice(0, 4).forEach((u, i) => {
      let host = u;
      try { host = new URL(u).hostname.replace(/^www\./, ''); } catch { /* keep the raw string */ }
      p.append(i ? ', ' : '', el('a', { href: u, target: '_blank', rel: 'noopener', textContent: host }));
    });
    card.append(p);
  }
}

function syncPanel(editing = null) {
  const look = currentLook(), pal = rig.pal;
  $('horseSel').value = state.horse.id;
  renderCard();
  $('resetLook').textContent = `Reset to ${state.horse.en}`;
  document.querySelectorAll('[data-coat]').forEach((b) => b.classList.toggle('on', b.dataset.coat === (look.coat.key ?? 'kage')));
  $('greyRow').hidden = $('dappleRow').hidden = look.coat.key !== 'ashige';
  $('greyness').value = look.coat.greyness ?? 0.5;
  $('dapple').value = pal.dapple ?? 0;
  $('gearOn').checked = !state.custom.gearOff;
  $('riderOn').checked = !state.custom.noRider;
  $('gearOn').disabled = !state.horse.gear;
  for (const [id, col] of [['cCoat', pal.coat], ['cMane', pal.mane], ['cLegs', pal.legs]]) if (id !== editing) $(id).value = toCss(col);
  $('faceSel').value = MARKS[look.face] ? look.face : 'none';
  for (const id of ['LF', 'RF', 'LH', 'RH']) $(`leg${id}`).value = look.legs[id] ?? 'none';
  const withers = look.size.withersCm ?? Math.round(REF_WITHERS * rig.scale), kg = look.size.typicalKg ?? (look.size.weightKg ? (look.size.weightKg[0] + look.size.weightKg[1]) / 2 : REF_KG);
  $('withers').value = withers;
  $('withersOut').textContent = `${withers} cm`;
  $('weight').value = Math.round(kg);
  $('weightOut').textContent = `${Math.round(kg)} kg`;
  $('maneLen').value = look.maneLen;
  for (const [group, table] of [['conf', CONF_CONTROLS], ['run', RUN_CONTROLS]]) {
    for (const [key, , min] of table) {
      const v = look[group][key] ?? ctlDefault(min), neutral = v === ctlDefault(min);
      $(`${group}-${key}`).value = v;
      $(`${group}-${key}-out`).textContent = neutral ? '' : (+v).toFixed(2); // only a horse's own (non-average) values show
    }
  }
  $('tailLen').value = look.tailLen;
}

/* ---------- start-up + main loop ---------- */
const timer = new THREE.Timer();
timer.connect(document);
buildPickers();
try { if (localStorage.getItem('lph-panel') === '1' || (localStorage.getItem('lph-panel') == null && window.innerWidth >= 900)) panelEl.hidden = false; } catch { panelEl.hidden = window.innerWidth < 900; }
panelBtn.setAttribute('aria-expanded', String(!panelEl.hidden));
panelBtn.classList.toggle('on', !panelEl.hidden);
const init = readHash();
state.horse = HORSE_LIST.find((h) => h.id === init.h) ?? HORSE_LIST[0];
state.race = init.race;
rig = buildHorse(currentLook()); // sized first: the world's stride count depends on the horse's scale
rig.tackKey = tackKey();
scene.add(rig.root);
setLocation(LOC_LIST.find((l) => l.id === init.l)?.id ?? window.DEFAULT_LOCATION ?? LOC_LIST[0].id);
if (init.g && GAITS[init.g]) setGait(init.g);
syncTitle();
syncPanel();
setPlaying(true);
applyPhase(0); // pose the horse and place the props before resize() draws the first frame
resize();

renderer.setAnimationLoop((ts) => {
  timer.update(ts);
  const dt = Math.min(timer.getDelta(), 0.1);
  if (playing) {
    const B = rig.blend, rate = B ? lerp(1 / B.from.period, 1 / rig.gait.period, smooth01(B.t / B.dur)) : 1 / rig.gait.period; // loops per second
    loopPhase = wrap01(loopPhase + dt * speed * rate);
    raceT += (dt * speed * W * rate) / RACE.speed; // story time: ground covered at 16 m/s
    for (const r of [rig, ...extras.flatMap((e) => e.rigs)]) if (r.blend && (r.blend.t += dt * speed) >= r.blend.dur) r.blend = null;
  }
  applyPhase(loopPhase);
  controls.update();
  renderNow();
});

window.__horse = {
  get period() { return rig.gait.period; },
  get strides() { return rig.gait.strides; },
  setPhase, resume, setView, setHorse, setLocation, setGait, toeWorld, gaits: GAITS, rebuild: () => rebuildHorse(),
  renderer, scene, camera, controls,
  get horse() { return rig.root; }, get rig() { return rig; }, get world() { return world; }, get extras() { return extras; }, state,
  get raceT() { return raceT; }, set raceT(t) { raceT = t; }, get racePlan() { return racePlan; }, RACE,
};
</script>
</body>
</html>
