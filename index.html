      return Math.abs(zs - T.inner) < 3.2 && rnd() < 0.6 ? c.lerp(worn, 0.5) : c; // the rail lane is worn
    };
    const marks = [...T.rails, T.standFront].map((zs) => zs * S);
    return {
      dx: 4, Z: rowsWith(marks, 640), seed: 27, jit: 0.025,
      height(x, z) {
        const zs = z * S;
        if (inPond(x, zs)) return -0.4;
        return smoothstep(Math.abs(T.bOuter) + 30, 640, Math.abs(zs)) * 10 * (0.5 + 0.5 * Math.sin(k * harm(130) * x + zs * 0.013));
      },
      color(x, z, rnd) {
        const zs = z * S;
        if (zs > T.outer) return zs < T.standFront ? apron.clone() : outside.clone().lerp(apron, rnd() * 0.5);
        if (zs >= T.inner) return turfAt(x, zs, rnd);
        if (zs > T.dOut) return verge.clone();
        if (zs >= T.dIn) return dirt.clone().offsetHSL(0, 0, (rnd() - 0.5) * 0.03);
        if (zs > T.bdIn) {
          if (inPond(x, zs)) return water.clone().offsetHSL(0, 0, (rnd() - 0.5) * 0.04);
          if (inPond(x, zs, 3)) return colorOf('#8c8f72');
          return lawn.clone().lerp(turfB, rnd() * 0.3);
        }
        if (zs >= T.bdOut) return dirt.clone().offsetHSL(0, 0, (rnd() - 0.5) * 0.03);
        if (zs > T.bInner) return verge.clone();
        if (zs >= T.bOuter) return turfAt(x, zs, rnd);
        return outside.clone().lerp(lawn, rnd() * 0.4);
      },
    };
  },
};

// Instanced props, laid out over one world period and repeated like the ground. Props receive but do not cast shadows: the shadow
// map only covers the horse, so a scrolling caster's shadow would pop in and out at its edge.
function makeKit(loc, heightAt, S) {
  const rnd = mulberry32(loc.seed ?? 2024), sets = [];
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9 });
  const tintMat = new THREE.MeshStandardMaterial({ flatShading: true, roughness: 0.9 });
  const colored = (geo, h, amt = 0.05) => paint(geo, flat(hex(h), rnd, amt));
  const addSet = (geo, material, items) => {
    if (!items.length) return;
    // laid out once over COPIES+1 periods (like the ground); each frame only the mesh offset moves
    const mesh = new THREE.InstancedMesh(geo, material, items.length * (COPIES + 1));
    items.forEach((it, i) => {
      for (let c = 0; c <= COPIES; c++) {
        _p.set(it.x + c * W, it.y, it.z);
        _s.set((it.sx ?? 1) * it.s, it.s, it.s);
        mesh.setMatrixAt(i * (COPIES + 1) + c, _m.compose(_p, it.q, _s));
        mesh.setColorAt(i * (COPIES + 1) + c, it.color ?? WHITE_C);
      }
    });
    mesh.receiveShadow = true;
    mesh.frustumCulled = false;
    sets.push({ mesh, items });
  };
  const item = (x, z, s, rotY = rnd() * TAU, sink = 0, extra = {}) => ({
    x, z, y: heightAt(x, z) - sink, s, q: new THREE.Quaternion().setFromEuler(new THREE.Euler(extra.tilt ?? 0, rotY, extra.tiltZ ?? 0)), ...extra,
  });
  return { rnd, sets, mat, tintMat, colored, addSet, item, heightAt, S };
}

// A fence/rail line along x: posts every ~gap metres, one board per height in o.rails.
function fenceLine(k, z, o) {
  const { rnd, item, colored, mat, addSet } = k;
  const n = Math.round(W / o.gap), gap = W / n, postH = o.postH ?? 1.1, r = o.postR ?? 0.055, wob = o.wobble ?? 0.06, tint = o.tint ?? 0.3;
  const postGeo = colored(jitter(new THREE.CylinderGeometry(r, r * 1.25, postH + 0.2, o.postSeg ?? 5), r * 0.22, 301).translate(0, postH / 2 - 0.1, 0), o.post);
  const railGeo = colored(jitter(new THREE.BoxGeometry(1, o.boardH ?? 0.075, o.boardD ?? 0.045), 0.008, 302), o.rail);
  const posts = [], rails = [];
  const shadeOf = () => new THREE.Color().setScalar(1 - tint / 2 + rnd() * tint);
  for (let i = 0; i < n; i++) {
    const x = i * gap;
    posts.push(item(x, z, 1, rnd() * TAU, 0.05, { tilt: (rnd() - 0.5) * wob, tiltZ: (rnd() - 0.5) * wob, color: shadeOf() }));
    for (const y of o.rails) {
      const it = item(x + gap / 2, z, 1, 0, -y + (rnd() - 0.5) * wob * 0.6, { tiltZ: (rnd() - 0.5) * wob * 0.6, color: shadeOf() });
      it.sx = gap + 0.12;
      rails.push(it);
    }
  }
  addSet(postGeo, mat, posts);
  addSet(railGeo, mat, rails);
}

function rockSet(k, count, zOf) {
  const { rnd, item, colored, mat, addSet } = k;
  const rockGeo = colored(jitter(new THREE.DodecahedronGeometry(1, 0), 0.22, 303).scale(1, 0.62, 0.85), 0xffffff, 0.08);
  const rocks = [];
  for (let i = 0; i < count; i++) {
    const z = zOf(rnd), s = (Math.abs(z) < 6 ? 0.08 + rnd() * 0.14 : 0.15 + rnd() * 0.6) * (rnd() < 0.1 ? 2 : 1);
    rocks.push(item(rnd() * W, z, s, rnd() * TAU, s * 0.25, { color: colorOf(PAL.rock[i % 3]) }));
  }
  addSet(rockGeo, mat, rocks);
}

// grass tufts (5 leaning blades), tinted per instance
function tuftGeo(rnd) {
  const blades = [];
  for (let b = 0; b < 5; b++) {
    const a = (b / 5) * TAU + rnd();
    const bl = new THREE.ConeGeometry(0.035, 0.34 + rnd() * 0.16, 3, 1).translate(0, 0.17, 0);
    bl.rotateZ(Math.cos(a) * 0.35).rotateX(Math.sin(a) * 0.35).translate(Math.cos(a) * 0.05, 0, Math.sin(a) * 0.05);
    blades.push(paint(bl, flat(0xffffff, rnd, 0.1)));
  }
  return merge(blades);
}
function tuftSet(k, count, zOf, colors, golden = PAL.golden) {
  const { rnd, item, mat, addSet } = k;
  const tufts = [];
  for (let i = 0; i < count; i++) {
    const gc = colorOf(colors[i % colors.length]).lerp(colorOf(golden), rnd() * 0.5).multiplyScalar(0.8);
    tufts.push(item(rnd() * W, zOf(rnd), 0.7 + rnd() * 0.8, rnd() * TAU, 0.02, { color: gc }));
  }
  addSet(tuftGeo(rnd), mat, tufts);
}

function flowerSet(k, count, zOf, colors) {
  const { rnd, item, tintMat, addSet } = k;
  const flowers = [];
  for (let i = 0; i < count; i++) flowers.push(item(rnd() * W, zOf(rnd), 0.7 + rnd() * 0.6, rnd() * TAU, 0, { color: colorOf(colors[i % colors.length]) }));
  addSet(new THREE.OctahedronGeometry(0.05, 0).translate(0, 0.22, 0), tintMat, flowers);
}

// trees: round broadleaf + conifer; canopies take the instance colour, trunks stay bark-brown
// `blossom`: canopy colours for flowering broadleaf trees (cherry); conifers keep their leaves.
function treeSet(k, count, zOf, leaves, { conifer = 0.38, autumn = 0.22, size = [0.55, 0.55], blossom = null, bloom = 0.75 } = {}) {
  const { rnd, item, colored, mat, addSet } = k;
  const trunkG = (h) => colored(jitter(new THREE.CylinderGeometry(0.1, 0.16, h, 5), 0.02, 310).translate(0, h / 2, 0), PAL.bark);
  const white = (geo) => colored(geo, 0xffffff, 0.08);
  const broad = merge([
    white(jitter(new THREE.IcosahedronGeometry(1, 0), 0.18, 311).scale(1.5, 1.25, 1.5).translate(0, 2.4, 0)),
    white(jitter(new THREE.IcosahedronGeometry(1, 0), 0.18, 312).scale(1.05, 0.95, 1.05).translate(0.35, 3.35, 0.1)),
  ]);
  const con = merge([
    white(jitter(new THREE.ConeGeometry(1.2, 2.4, 6), 0.12, 313).translate(0, 1.9, 0)),
    white(jitter(new THREE.ConeGeometry(0.85, 1.9, 6), 0.1, 314).translate(0, 3.2, 0)),
  ]);
  const broadItems = [], conItems = [];
  for (let i = 0; i < count; i++) {
    const leaf = rnd() < autumn ? PAL.autumn[i % 3] : leaves[i % leaves.length];
    const it = item(rnd() * W, zOf(rnd), size[0] + rnd() * size[1], rnd() * TAU, 0.1, { color: colorOf(leaf) });
    const isConifer = rnd() < conifer;
    // index-based so a blossom list never shifts the random layout of the trees
    if (blossom && !isConifer && ((i * 7919) % 100) / 100 < bloom) it.color = colorOf(blossom[i % blossom.length]);
    (isConifer ? conItems : broadItems).push(it);
  }
  const barkOf = (items) => items.map((it) => ({ ...it, color: new THREE.Color().setScalar(0.85 + rnd() * 0.3) }));
  addSet(trunkG(1.6), mat, barkOf(broadItems));
  addSet(broad, mat, broadItems);
  addSet(trunkG(0.9), mat, barkOf(conItems));
  addSet(con, mat, conItems);
}

// Hokkaido birch: white bark with dark marks, a slim light-green crown
function birchSet(k, count, zOf) {
  const { rnd, item, colored, mat, addSet } = k;
  const trunk = paint(jitter(new THREE.CylinderGeometry(0.08, 0.12, 4.2, 5, 5), 0.015, 320).translate(0, 2.1, 0), () => shade(rnd() < 0.22 ? 0x3a3330 : 0xe9e6de, rnd, 0.03));
  const crown = merge([
    colored(jitter(new THREE.IcosahedronGeometry(1, 0), 0.15, 321).scale(0.95, 1.5, 0.95).translate(0, 4.3, 0), 0xffffff, 0.08),
    colored(jitter(new THREE.IcosahedronGeometry(1, 0), 0.15, 322).scale(0.7, 1.1, 0.7).translate(0.3, 5.4, 0.1), 0xffffff, 0.08),
  ]);
  const items = [];
  for (let i = 0; i < count; i++) items.push(item(rnd() * W, zOf(rnd), 0.75 + rnd() * 0.5, rnd() * TAU, 0.1, { color: colorOf(pick(['#9cbf5e', '#8db454', '#a9c76a'], rnd)) }));
  addSet(trunk, mat, items.map((it) => ({ ...it, color: new THREE.Color(1, 1, 1) })));
  addSet(crown, mat, items);
}

// wrapped round bales lying on their sides, in little groups
function haySet(k, groups, zOf) {
  const { rnd, item, colored, mat, addSet } = k;
  const geo = colored(jitter(new THREE.CylinderGeometry(0.66, 0.66, 1.2, 8, 1), 0.02, 330).rotateZ(Math.PI / 2).translate(0, 0.62, 0), 0xffffff, 0.04);
  const items = [];
  for (let g = 0; g < groups; g++) {
    const x0 = rnd() * W, z0 = zOf(rnd), wrap = pick(['#eef0ec', '#eef0ec', '#dfe8d6', '#e8ece3'], rnd);
    for (let i = 0, n = 1 + Math.floor(rnd() * 3); i < n; i++) items.push(item(x0 + i * 1.7 + rnd() * 0.4, z0 + (rnd() - 0.5) * 1.2, 1, (rnd() - 0.5) * 0.4, 0.04, { color: colorOf(wrap) }));
  }
  addSet(geo, mat, items);
}

// farm buildings: a barn with a red gable roof and a silo, one set per period
function farmSet(k, z, xFrac = 0.35) {
  const { rnd, item, colored, mat, addSet } = k;
  const roof = colored(new THREE.CylinderGeometry(7.4, 7.4, 16, 3, 1).rotateZ(Math.PI / 2).rotateX(Math.PI / 6).scale(1, 0.42, 1).translate(0, 7.3, 0), 0xa3412e, 0.04);
  const barn = merge([
    colored(new THREE.BoxGeometry(15, 5.2, 11).translate(0, 2.6, 0), 0xe7dfcf, 0.03),
    roof,
    colored(new THREE.BoxGeometry(2.8, 3.2, 0.2).translate(-3.5, 1.6, 5.55), 0x7a3528, 0.03),
    colored(new THREE.CylinderGeometry(2.1, 2.1, 10, 8).translate(10, 5, -1), 0xd3cdbf, 0.03),
    colored(new THREE.ConeGeometry(2.4, 2.2, 8).translate(10, 11.1, -1), 0x6f7e86, 0.04),
  ].map(noUV));
  addSet(barn, mat, [item(W * xFrac, z, 1, 0.3 + (rnd() - 0.5) * 0.2, 0.2)]);
}

// Steeplechase fences in the infield (Nakayama's 大竹柵 brush fence and 大生垣 hedge, 1.6 m high)
function jumpSet(k, f, T) {
  const { rnd, item, colored, mat, addSet, S } = k;
  const brush = colored(jitter(new THREE.BoxGeometry(16, 1.6, 2.05, 8, 2, 2), 0.16, 501).translate(0, 0.8, 0), 0x55603a, 0.1);
  const hedge = colored(jitter(new THREE.BoxGeometry(16, 1.6, 2.4, 8, 2, 2), 0.2, 502).translate(0, 0.8, 0), 0x3d6b33, 0.07);
  const B = [], Hs = [];
  for (let i = 0; i < (f.count ?? 4); i++) {
    const zs = T.dIn - 22 - rnd() * (f.depthM ?? 120);
    (i % 2 ? Hs : B).push(item(((i + rnd() * 0.5) / (f.count ?? 4)) * W, zs * S, 1, Math.PI / 2 + (rnd() < 0.5 ? 0.55 : -0.55), 0.05));
  }
  addSet(brush, mat, B);
  addSet(hedge, mat, Hs);
}

// Grandstand: a stepped seating bowl, a glazed block of floors behind it, fins and a roof canopy.
// Built along x (centred), seats rising away from the track (+z); placed at the stand front, once per period.
function standGeometry(st, rnd) {
  const len = st.lengthM, floors = st.floors ?? 6, fl = 4.3, H = 6 + floors * fl;
  const c = { body: 0xd9d6cf, roof: 0xe9ecee, glass: 0x7f97a8, seats: 0x8b9aa6, ...Object.fromEntries(Object.entries(st.colors ?? {}).map(([k, v]) => [k, hex(v)])) };
  const parts = [];
  const box = (w, h, d, x, y, z, fn) => parts.push(paint(noUV(new THREE.BoxGeometry(w, h, d).translate(x, y, z)), fn));
  const by = (hexv, amt = 0.03) => flat(hexv, rnd, amt);
  const steps = 9, stepD = 2.3, rise = 1.25;
  for (let i = 0; i < steps; i++) box(len, rise * (i + 1), stepD, 0, (rise * (i + 1)) / 2, i * stepD + stepD / 2, (q, n) => shade(n.y > 0.5 ? c.seats : 0xbab6ac, rnd, 0.04));
  const z0 = steps * stepD, depth = st.depthM ?? 24;
  box(len, H, depth, 0, H / 2, z0 + depth / 2 + 0.6, by(c.body));
  for (let f = 0; f < floors; f++) {
    const y0 = rise * steps + 1 + f * fl;
    if (y0 + fl > H) break;
    box(len, fl - 1.1, 0.6, 0, y0 + (fl - 1.1) / 2, z0 + 0.3, by(c.glass, 0.05));
    box(len, 1.1, 0.9, 0, y0 + fl - 0.55, z0 + 0.35, by(c.body));
  }
  for (let x = -len / 2 + 6; x < len / 2; x += 18) box(0.9, H - 2, 1.4, x, (H - 2) / 2 + 2, z0 + 0.2, by(c.body));
  const roofD = z0 + depth + 6;
  box(len + 6, 1.1, roofD, 0, H + 1.6, roofD / 2 - 6, by(c.roof));
  for (let x = -len / 2 + 9; x < len / 2; x += 36) box(0.7, H + 1.6 - rise * steps, 0.7, x, (H + 1.6 + rise * steps) / 2, 1.2, by(c.body)); // canopy columns
  return merge(parts);
}

function standSet(k, loc, T) {
  const { rnd, item, mat, addSet, S } = k;
  const st = { ...loc.stand, lengthM: Math.min(loc.stand.lengthM ?? 220, W - 60) };
  addSet(standGeometry(st, rnd), mat, [item(W / 2, T.standFront * S, 1, S > 0 ? 0 : Math.PI, 0)]);
}

const PROP_BUILDERS = {
  country(k) {
    const { rnd } = k;
    fenceLine(k, -3.3, { gap: 2.7, post: PAL.post, rail: PAL.rail, rails: [0.52, 0.92], postH: 1.1 });
    rockSet(k, perLoop(48), (r) => { const side = r() < 0.62 ? -1 : 1; return side * (side < 0 ? 2.6 + 26 * r() ** 1.6 : 3.4 + 26 * r() ** 1.4); });
    tuftSet(k, perLoop(275), (r) => (r() < 0.55 ? -1 : 1) * (2.2 + 34 * r() ** 1.8), PAL.grass);
    flowerSet(k, perLoop(137), (r) => (r() < 0.55 ? -1 : 1) * (2.4 + 24 * r() ** 1.5), PAL.flowers);
    treeSet(k, perLoop(32), (r) => (r() < 0.75 ? -(22 + 45 * r() ** 1.2) : 26 + 30 * r()), PAL.leaf);
    void rnd;
  },
  pasture(k, loc) {
    const white = loc.fence?.color ?? '#f3f1ea';
    const board = { gap: 3, post: white, rail: white, rails: [0.42, 0.8, 1.18], postH: 1.35, postR: 0.06, postSeg: 4, boardH: 0.17, boardD: 0.035, wobble: 0.012, tint: 0.07 };
    fenceLine(k, -3.6, board);
    fenceLine(k, -27, board);
    fenceLine(k, 11, board);
    rockSet(k, perLoop(10), (r) => (r() < 0.5 ? -1 : 1) * (4 + 30 * r()));
    tuftSet(k, perLoop(300), (r) => (r() < 0.5 ? -1 : 1) * (1.9 + 34 * r() ** 1.7), loc.ground?.grass ?? ['#6f9a45', '#77a24b', '#80a852'], '#b8c46a');
    flowerSet(k, perLoop(170), (r) => (r() < 0.5 ? -1 : 1) * (2 + 26 * r() ** 1.5), ['#f2d23c', '#f2d23c', '#f4f1e6', '#b49bd3']);
    birchSet(k, perLoop(22), (r) => (r() < 0.7 ? -(30 + 40 * r()) : 16 + 34 * r()));
    treeSet(k, perLoop(14), (r) => (r() < 0.8 ? -(45 + 40 * r()) : 30 + 30 * r()), PAL.leaf, { autumn: 0, conifer: 0.5 });
    haySet(k, perLoop(5), (r) => (r() < 0.6 ? -(31 + 12 * r()) : 14 + 16 * r())); // outside the grazers' paddock
    farmSet(k, -68);
    const muzzles = [];
    for (const e of loc.extras ?? []) {
      if (e.mode !== 'grazer') continue;
      const yaw = e.rotY ?? 0, mx = e.x + Math.cos(yaw) * 1.25, mz = e.z - Math.sin(yaw) * 1.25;
      for (let i = 0; i < 4; i++) muzzles.push(k.item(mx + (k.rnd() - 0.5) * 0.5, mz + (k.rnd() - 0.5) * 0.5, 1.5 + k.rnd() * 0.6, k.rnd() * TAU, 0, { color: colorOf('#6d9a45') }));
    }
    k.addSet(tuftGeo(k.rnd), k.mat, muzzles);
  },
  track(k, loc) {
    const T = trackLayout(loc), { S } = k, rail = loc.rails?.color ?? '#f4f4f0';
    for (const zs of T.rails) fenceLine(k, zs * S, { gap: 3, post: rail, rail, rails: [0.95], postH: 0.95, postR: 0.045, postSeg: 4, boardH: 0.11, boardD: 0.11, wobble: 0.004, tint: 0.05 });
    if (loc.stand) standSet(k, loc, T);
    const infield = (r) => S * (T.dIn - 8 - r() * (T.D - T.turfW - T.dirtW - 30)); // somewhere between the two dirt courses
    tuftSet(k, perLoop(60), (r) => S * (T.dIn - 2 - r() * 60), ['#6f9a46', '#78a24c'], '#a6b660');
    const blossom = loc.blossom ? [loc.blossom].flat() : null;
    treeSet(k, perLoop(loc.infieldTrees ?? 14), infield, loc.leaf ?? PAL.leaf, { autumn: loc.autumn ?? 0.1, conifer: 0.3, size: [0.8, 0.7], blossom });
    treeSet(k, perLoop(40), (r) => S * (T.bOuter - 8 - r() * 70), loc.leaf ?? PAL.leaf, { autumn: loc.autumn ?? 0.1, conifer: 0.45, size: [1.1, 0.9], blossom, bloom: 0.45 }); // beyond the back straight
    treeSet(k, perLoop(12), (r) => S * (T.standFront + 70 + r() * 80), loc.leaf ?? PAL.leaf, { autumn: loc.autumn ?? 0.1, conifer: 0.3, size: [1, 0.6], blossom }); // behind the stands
    for (const f of loc.infield ?? []) {
      if (f.type === 'jumps') jumpSet(k, f, T);
      // trees on the near bank: between the inner dirt rail and the water (never out on the courses)
      const bankIn = -(f.distM - 4), bankOut = Math.max(bankIn, T.dIn - 4);
      if (f.type === 'pond') treeSet(k, 8, (r) => S * (bankIn + r() * (bankOut - bankIn)), ['#4f7a3c', '#5f8a45'], { autumn: 0.15, conifer: 0.2, size: [0.7, 0.4] });
    }
  },
};

// The strip [0, (COPIES+1)W) slides left by the scroll, so it always covers +-COPIES*W/2.
function updateProps(sets, scroll) {
  for (const { mesh } of sets) mesh.position.x = -(COPIES / 2) * W - scroll;
}

// Sun direction from elevation/azimuth (deg; azimuth 0 = from behind the camera, + = toward +X).
function sunDirOf(t, S) {
  const el = (t.sunElevDeg ?? 40) * DEG, az = (t.sunAzimDeg ?? -20) * DEG;
  return V(Math.sin(az) * Math.cos(el), Math.sin(el), S * Math.cos(az) * Math.cos(el)).normalize();
}

const DEFAULT_SKY = { top: PAL.skyTop, mid: PAL.skyMid, horizon: PAL.horizon, sun: PAL.sun };
const DEFAULT_RANGES = [
  { r: 460, base: 0x9c9ab6, h: [24, 54], step: 0.2, haze: 0.58 },
  { r: 360, base: 0x9d9a90, h: [8, 24], step: 0.13, haze: 0.4 },
];

function buildWorld(loc) {
  const S = loc.hand === 'right' ? -1 : 1, t = loc.time ?? {};
  W = loc.W ?? 65;
  const fogFar = t.fogFar ?? 92, reach = fogFar + (loc.stand ? Math.min(loc.stand.lengthM ?? 220, W - 60) / 2 : 12);
  COPIES = 1;
  while ((COPIES * W) / 2 < reach) COPIES += 2; // odd, so the strip and the wrap agree; its edge stays in the fog
  const sunDir = sunDirOf(t, S), sky = { ...DEFAULT_SKY, ...(t.sky ?? {}) };
  const ground = buildGround(GROUND[loc.builder](loc, S));
  const kit = makeKit(loc, ground.heightAt, S);
  PROP_BUILDERS[loc.builder](kit, loc);
  const group = new THREE.Group();
  group.add(ground.mesh);
  kit.sets.forEach((s) => group.add(s.mesh));
  const back = loc.backdrop ?? {};
  const statics = new THREE.Group();
  statics.add(buildSky(sunDir, sky), buildBackdrop(sunDir, { horizon: sky.horizon, ranges: back.ranges ?? DEFAULT_RANGES, landmarks: back.landmarks, clouds: back.clouds, seed: back.seed }, S));
  return { loc, S, group, statics, ground, props: kit.sets, sunDir, sky, fog: [t.fogNear ?? 24, fogFar] };
}

// Dust kicked up at each hoof strike; a pure function of gait phase (one puff per hoof per stride).
function buildDust() {
  const group = new THREE.Group(), rnd = mulberry32(555), puffs = [];
  const geo = jitter(new THREE.IcosahedronGeometry(1, 0), 0.12, 556);
  const m = new THREE.MeshLambertMaterial({ color: PAL.dust, flatShading: true, transparent: true, depthWrite: false });
  for (const L of LEGS) {
    const mats = m.clone(), parts = [];
    for (let i = 0; i < 6; i++) {
      const mesh = new THREE.Mesh(geo, mats);
      const a = rnd() * TAU;
      parts.push({ mesh, dx: Math.cos(a) * (0.5 + rnd()) - 0.6, dz: Math.sin(a) * (0.5 + rnd()), up: 0.4 + rnd(), r: 0.07 + rnd() * 0.07 });
      group.add(mesh);
    }
    puffs.push({ L, m: mats, parts, big: L.fore ? 0.8 : 1 });
  }
  return { group, puffs, on: true, setColor(c) { puffs.forEach((pf) => pf.m.color.set(hex(c))); } };
}
function updateDust(dust, g, rig) {
  const LIFE = 0.55, G = rig.gait, s = rig.scale, live = dust.on && G.dust;
  for (const pf of dust.puffs) {
    const P = pf.L.fore ? G.fore : G.hind, z = pf.L.side * (pf.L.fore ? FORE.z : HIND.z) * s;
    const x0 = (P.xc + G.stanceLen / 2) * s;
    const a = wrap01(g - G.land[pf.L.id]), t = a / LIFE;
    const on = live && t < 1;
    pf.m.opacity = on ? 0.5 * smoothstep(0, 0.06, t) * (1 - t) ** 2 : 0;
    const spread = 0.12 + 0.55 * (1 - (1 - Math.min(t, 1)) ** 2);
    for (const p of pf.parts) {
      p.mesh.visible = on;
      if (!on) continue;
      p.mesh.position.set(x0 - G.stride * s * a + p.dx * spread * 0.5, 0.03 + p.up * 0.22 * t + p.r * 0.5, z + p.dz * spread * 0.35);
      p.mesh.scale.setScalar(p.r * pf.big * (0.5 + 1.4 * t));
    }
  }
}

// Generic (non-roster) horses for the background: a plausible random coat, simple markings.
function genericLook(rnd) {
  const key = pick(['kage', 'kage', 'kurokage', 'kuri', 'kuri', 'ashige', 'aokage', 'tochikuri'], rnd);
  const leg = () => (rnd() < 0.18 ? pick(['coronet', 'pastern', 'sock'], rnd) : 'none');
  return {
    coat: { key, greyness: 0.3 + 0.6 * rnd(), tone: (rnd() - 0.5) * 0.8 },
    face: pick(['none', 'none', 'star', 'stripe', 'star-stripe', 'blaze', 'star-snip'], rnd),
    legs: { LF: leg(), RF: leg(), LH: leg(), RH: leg() },
    size: { typicalKg: 430 + rnd() * 90 },
  };
}

// Camera presets: dir = direction from the target to the camera (z follows the location's grandstand

function fitDistance(v) {
  const w = window.innerWidth, h = window.innerHeight, full = h + barReserve, k = rig?.scale ?? 1;
  const tanV = Math.tan((camera.fov * DEG) / 2);
  return k * Math.max((v.hw * full) / ((w - panelReserve) * tanV), (v.hh * full) / ((h - barReserve) * tanV));
}

const STYLES = { nige: ['逃げ', 'Front-runner'], senko: ['先行', 'Stalker'], sashi: ['差し', 'Closer'], oikomi: ['追込', 'Deep closer'] };
const MARKS = { none: 'None', star: 'Star', stripe: 'Stripe', 'star-stripe': 'Star + stripe', blaze: 'Blaze', 'wide-blaze': 'Wide blaze', bald: 'Bald face', snip: 'Snip', 'star-snip': 'Star + snip', 'star-stripe-snip': 'Star, stripe + snip' };
const LEG_MARKS = { none: 'None', coronet: 'Coronet', pastern: 'Pastern', fetlock: 'Fetlock', sock: 'Sock', stocking: 'Stocking' };

const state = { horse: HORSE_LIST[0], custom: {}, loc: LOC_LIST[0], gait: 'gallop', lead: 'L' };
let rig = null, world = null, extras = [], wireOn = false;
let loopPhase = 0, playing = true, speed = 1;

// A roster horse with the viewer's overrides on top, as a buildHorse() look.
function currentLook() {
  const h = state.horse, c = state.custom;
  return {
    coat: { ...h.coat, ...c.coat },
    face: c.face ?? h.face?.type ?? 'none',
    legs: { ...h.legs, ...c.legs },
    size: { ...h.size, ...c.size },
    maneLen: c.maneLen ?? h.maneLen ?? 1,
    tailLen: c.tailLen ?? h.tailLen ?? 1,
  };
}

function disposeTree(root) {
  const mats = new Set();
  root.traverse((o) => {
    o.geometry?.dispose();
    if (o.material) [].concat(o.material).forEach((m) => mats.add(m));
    if (o.isInstancedMesh) o.dispose();
    if (o.isSkinnedMesh) o.skeleton.dispose();
  });
  mats.forEach((m) => m.dispose());
}

function rebuildHorse() {
  if (rig) { scene.remove(rig.root); disposeTree(rig.root); }
  rig = buildHorse(currentLook());
  rig.materials.forEach((m) => { m.wireframe = wireOn; });
  scene.add(rig.root);
  setGait(state.gait);
}

// Gait of the hero (and the companions walking with it); the loop length follows the hero.
function setGait(key) {
  state.gait = GAITS[key] && !GAITS[key].stand ? key : 'gallop';
  if (rig) {
    rig.gait = makeGait(state.gait, rig.scale, W, state.lead);
    loopPeriod = rig.gait.period;
  }
  for (const ex of extras) if (ex.mode === 'companion') ex.rigs[0].gait = makeGait(state.gait, ex.rigs[0].scale, W, state.lead);
  syncBar();
  writeHash();
}

const blobGeo = new THREE.CircleGeometry(1, 12).rotateX(-Math.PI / 2);
const blobMat = new THREE.MeshBasicMaterial({ color: 0x1b140f, transparent: true, opacity: 0.22, depthWrite: false });
function blobShadow() {
  const m = new THREE.Mesh(blobGeo, blobMat);
  m.scale.set(1.05, 1, 0.42);
  m.position.set(0.05, 0.02, 0);
  return m;
}

// Background horses (generic coats). Companions walk beside the hero at its speed, so they never need
// wrapping; grazers stand on the scrolling ground and are drawn once per scenery copy, like the props.
function spawnExtras() {
  for (const ex of extras) for (const r of ex.rigs) { scene.remove(r.root); disposeTree(r.root); }
  extras = [];
  const rnd = mulberry32(4242);
  (state.loc.extras ?? []).forEach((spec, n) => {
    const look = genericLook(rnd), seed = 900 + n * 17, phaseOffset = rnd(), grazer = spec.mode === 'grazer';
    const rigs = [];
    for (let c = 0; c < (grazer ? COPIES : 1); c++) {
      const r = buildHorse(look, seed);
      r.phaseOffset = phaseOffset;
      r.gait = makeGait(grazer ? 'stand' : state.gait, r.scale, W, state.lead);
      r.root.rotation.y = spec.rotY ?? 0;
      r.root.position.set(spec.x, grazer ? world.ground.heightAt(spec.x, spec.z) : 0, spec.z);
      if (grazer) {
        r.root.traverse((o) => { o.castShadow = false; }); // a scrolling caster would pop at the shadow map's edge
        r.root.add(blobShadow());
      }
      r.materials.forEach((m) => { m.wireframe = wireOn; });
      scene.add(r.root);
      rigs.push(r);
    }
    extras.push({ ...spec, rigs, phase: rnd() });
  });
  // the shadow map covers the hero, plus any companion
  const reach = 2.8 + Math.max(0, ...extras.filter((e) => e.mode === 'companion').map((e) => Math.hypot(e.x, e.z)));
  Object.assign(sun.shadow.camera, { left: -reach, right: reach, top: reach, bottom: -reach, near: 4, far: 26 });
  sun.shadow.camera.updateProjectionMatrix();
}

function setLocation(id) {
  const loc = LOC_LIST.find((l) => l.id === id) ?? LOC_LIST[0];
  if (world) { scene.remove(world.group, world.statics); disposeTree(world.group); disposeTree(world.statics); }
  state.loc = loc;
  world = buildWorld(loc);
  scene.add(world.group, world.statics);
  const t = loc.time ?? {};
  scene.fog = new THREE.Fog(hex(world.sky.horizon), world.fog[0], world.fog[1]);
  scene.background = colorOf(world.sky.horizon);
  hemi.color.set(hex(t.hemiSky ?? 0xdfe6f0));
  hemi.groundColor.set(hex(t.hemiGround ?? 0x8a7550));
  hemi.intensity = t.hemiIntensity ?? 1.25;
  sun.color.set(hex(t.sunColor ?? 0xffe7c4));
  sun.intensity = t.sunIntensity ?? 2.9;
  sun.position.copy(world.sunDir).multiplyScalar(14);
  fill.position.set(-world.sunDir.x, Math.max(0.35, world.sunDir.y), -world.sunDir.z).multiplyScalar(14);
  fill.intensity = t.fillIntensity ?? 0.55;
  renderer.toneMappingExposure = t.exposure ?? 1.02;
  dust.on = loc.dust !== null;
  dust.setColor(loc.dust ?? PAL.dust);
  state.lead = loc.lead ?? 'L';
  spawnExtras();
  setGait(loc.gait ?? 'gallop');
  syncTitle();
  if ($('locSel')) $('locSel').value = loc.id;
  setView(currentView);
}

function setHorse(id) {
  state.horse = HORSE_LIST.find((h) => h.id === id) ?? HORSE_LIST[0];
  state.custom = {};
  rebuildHorse();
  syncTitle();
  syncPanel();
  setView(currentView);
}

function applyPhase(p) {
  const g = wrap01(p * rig.gait.strides);
  pose(rig, g, p);
  const scroll = p * W;
  world.ground.mesh.position.x = -(COPIES / 2) * W - scroll;
  updateProps(world.props, scroll);
  updateDust(dust, g, rig);
  for (const ex of extras) {
    ex.rigs.forEach((r, c) => {
      if (ex.mode === 'grazer') r.root.position.x = wrapCentered(ex.x - W / 2 - scroll) + (c - (COPIES - 1) / 2) * W;
      pose(r, wrap01(p * r.gait.strides + ex.phase), p);
    });
  }
}
function renderNow() { renderer.render(scene, camera); }

function setView(name) {
  const v = VIEWS[name];
  if (!v) return;
  currentView = name;
  userOrbited = false;
  controls.enableDamping = false;
  controls.update(); // flush any pending damped motion
  const k = rig?.scale ?? 1, target = V(v.tx * k, TARGET_Y * k, 0), dir = V(...v.dir);
  dir.z *= world?.S ?? 1;
  camera.position.copy(target).addScaledVector(dir.normalize(), fitDistance(v));
  controls.target.copy(target);
  controls.update();
  controls.enableDamping = true;
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === name));
  if (rig && world) renderNow();
}
// Hook: jump to loop phase p and hold it (shown as paused in the UI); resume() plays on from there.
function setPhase(p) {
  setPlaying(false);
  loopPhase = wrap01(p);
  applyPhase(loopPhase);
  renderNow();
}
function resume() { setPlaying(true); }

// World position of a hoof's toe (for slip checks): the front of the sole, in the hoof joint's frame.
function toeWorld(id, r = rig) {
  const L = r.legs.find((l) => l.id === id);
  return L.hoof.localToWorld(V(HOOF_TOE, SOLE - COFFIN_Y, 0));
}

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  barReserve = clamp(Math.round(h - barEl.getBoundingClientRect().top), 0, h / 3);
  document.documentElement.style.setProperty('--bar-h', `${barReserve}px`);
  const wide = w >= 900;
  panelReserve = wide && !panelEl.hidden ? Math.round(panelEl.getBoundingClientRect().right + 8) : 0;
  camera.fov = w < h ? 46 : 32;
  camera.aspect = (w + panelReserve) / (h + barReserve);
  camera.setViewOffset(w + panelReserve, h + barReserve, 0, barReserve, w, h); // also updates the projection
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // may change when the window moves between screens
  renderer.setSize(w, h);
  controls.maxDistance = Math.max(18, fitDistance(VIEWS.side) * 1.4);
  if (!userOrbited) setView(currentView);
}
window.addEventListener('resize', resize);
controls.addEventListener('start', () => { userOrbited = true; });

// ----- panel: pickers, the horse's card, coat / markings / build controls -----
function buildPickers() {
  const hs = $('horseSel'), years = new Map();
  for (const h of ROSTER) {
    const label = `Born ${h.bornApprox ? 'c.' : ''}${h.born}`;
    if (!years.has(label)) years.set(label, el('optgroup', { label }));
    years.get(label).append(el('option', { value: h.id, textContent: `${h.en}　${h.jp}` }));
  }
  hs.append(...years.values(), el('optgroup', { label: 'Custom' }, [el('option', { value: STUDIO.id, textContent: STUDIO.en })]));
  hs.addEventListener('change', () => setHorse(hs.value));

  const ls = $('locSel'), groups = new Map();
  const groupOf = (name) => {
    if (!groups.has(name)) groups.set(name, el('optgroup', { label: name }));
    return groups.get(name);
  };
  for (const l of LOC_LIST) groupOf(l.group ?? 'Other').append(el('option', { value: l.id, textContent: l.jp ? `${l.en}　${l.jp}` : l.en }));
  for (const q of window.LOCATION_QUEUE ?? []) groupOf(q.group).append(el('option', { value: '', disabled: true, textContent: `${q.en} — soon` }));
  ls.append(...groups.values());
  ls.addEventListener('change', () => { if (ls.value) setLocation(ls.value); });

  const sw = $('coatSwatches');
  for (const [key, c] of Object.entries(COATS)) {
    const b = el('button', { type: 'button', title: `${c.jp} ${c.en}`, ariaLabel: `${c.en} (${c.jp})` });
    b.dataset.coat = key;
    b.style.background = toCss(c.grey ? 0xb8b5b0 : c.coat);
    b.addEventListener('click', () => tweak((x) => { x.coat = { key, coatHex: null, mane: null, tail: null, pointsHex: null }; }));
    sw.append(b);
  }
  $('greyness').addEventListener('input', (e) => tweak((x) => { x.coat = { ...x.coat, greyness: +e.target.value }; }));
  $('dapple').addEventListener('input', (e) => tweak((x) => { x.coat = { ...x.coat, dapple: +e.target.value }; }));
  $('cCoat').addEventListener('input', (e) => tweak((x) => { x.coat = { ...x.coat, coatHex: e.target.value }; }, 'cCoat'));
  $('cMane').addEventListener('input', (e) => tweak((x) => { x.coat = { ...x.coat, mane: e.target.value, tail: null }; }, 'cMane'));
  $('cLegs').addEventListener('input', (e) => tweak((x) => { x.coat = { ...x.coat, pointsHex: e.target.value }; }, 'cLegs'));
  const fs = $('faceSel');
  fs.append(...Object.entries(MARKS).map(([v, t]) => el('option', { value: v, textContent: t })));
  fs.addEventListener('change', () => tweak((x) => { x.face = fs.value; }));
  for (const id of ['LF', 'RF', 'LH', 'RH']) {
    const s = $(`leg${id}`);
    s.append(...Object.entries(LEG_MARKS).map(([v, t]) => el('option', { value: v, textContent: t })));
    s.addEventListener('change', () => tweak((x) => { x.legs = { ...x.legs, [id]: s.value }; }));
  }
  $('withers').addEventListener('input', (e) => tweak((x) => { x.size = { ...x.size, withersCm: +e.target.value }; }));
  $('weight').addEventListener('input', (e) => tweak((x) => { x.size = { ...x.size, typicalKg: +e.target.value, weightKg: null }; }));
  $('maneLen').addEventListener('input', (e) => tweak((x) => { x.maneLen = +e.target.value; }));
  $('tailLen').addEventListener('input', (e) => tweak((x) => { x.tailLen = +e.target.value; }));
  $('resetLook').addEventListener('click', () => { state.custom = {}; rebuildHorse(); syncPanel(); });
}

// Apply a tweak to the viewer's overrides; rebuild the horse at most once per frame.
let pendingRebuild = 0;
function tweak(fn, editing = null) {
  fn(state.custom);
  if (pendingRebuild) return;
  pendingRebuild = requestAnimationFrame(() => {
    pendingRebuild = 0;
    rebuildHorse();
    syncPanel(editing);
  });
}

function sizeText(s = {}) {
  const kg = s.weightKg ? `${s.weightKg[0]}–${s.weightKg[1]} kg` : s.typicalKg ? `${Math.round(s.typicalKg)} kg` : null;
  return [kg, s.withersCm ? `${s.withersCm} cm at the withers` : null, s.build].filter(Boolean).join(' · ') || '—';
}
function markingText(h) {
  const legs = Object.entries(h.legs ?? {}).filter(([, v]) => v && v !== 'none').map(([k, v]) => `${k} ${LEG_MARKS[v]?.toLowerCase() ?? v}`);
  return [MARKS[h.face?.type ?? 'none'], legs.length ? `white ${legs.join(', ')}` : null].filter(Boolean).join('; ');
}
function renderCard() {
  const h = state.horse, card = $('horseCard');
  card.replaceChildren();
  if (h.studio) {
    card.append(el('p', { className: 'note', textContent: 'The original studio horse, not a roster horse. Customize it freely.' }));
    return;
  }
  const c = COATS[h.coat.key] ?? COATS.kage, st = STYLES[h.style?.primary];
  const rows = [
    ['Born', [`${h.bornApprox ? 'c. ' : ''}${h.born}`, SEX[h.sex], h.realName ? `real name ${h.realName}` : null].filter(Boolean).join(' · ')],
    ['Coat', `${h.coat.reg ?? c.jp} · ${c.en}${h.coat.key === 'ashige' && h.coat.greyness != null ? ` (${Math.round(h.coat.greyness * 100)}% grey)` : ''}`],
    ['Markings', markingText(h)],
    ['Style', st ? `${st[0]} ${st[1]}${h.style.secondary && STYLES[h.style.secondary] ? ` / ${STYLES[h.style.secondary][1].toLowerCase()}` : ''}` : 'n/a (never raced)'],
    ['Size', sizeText(h.size)],
    ['Gear', Object.entries({ shadowRoll: 'shadow roll', blinkers: 'blinkers', hood: 'hood' }).filter(([k]) => h.gear?.[k]).map(([, v]) => v).join(', ') || 'none noted'],
    ['Silks', h.silks?.desc || '—'],
    ['Career', h.career || '—'],
  ];
  const dl = el('dl');
  for (const [k, v] of rows) dl.append(el('dt', { textContent: k }), el('dd', { textContent: v }));
  if (h.style?.why) dl.children[7].title = h.style.why;
  card.append(dl);
  if (h.uncertain?.length) card.append(el('p', { className: 'note', textContent: `Unconfirmed: ${h.uncertain.join(', ')}` }));
  if (h.sources?.length) {
    const p = el('p', { className: 'note' }, ['Sources: ']);
    h.sources.slice(0, 4).forEach((u, i) => {
      let host = u;
      try { host = new URL(u).hostname.replace(/^www\./, ''); } catch { /* keep the raw string */ }
      p.append(i ? ', ' : '', el('a', { href: u, target: '_blank', rel: 'noopener', textContent: host }));
    });
    card.append(p);
  }
}

function syncPanel(editing = null) {
  const look = currentLook(), pal = rig.pal;
  $('horseSel').value = state.horse.id;
  renderCard();
  $('resetLook').textContent = `Reset to ${state.horse.en}`;
  document.querySelectorAll('[data-coat]').forEach((b) => b.classList.toggle('on', b.dataset.coat === (look.coat.key ?? 'kage')));
  $('greyRow').hidden = $('dappleRow').hidden = look.coat.key !== 'ashige';
  $('greyness').value = look.coat.greyness ?? 0.5;
  $('dapple').value = pal.dapple ?? 0;
  for (const [id, col] of [['cCoat', pal.coat], ['cMane', pal.mane], ['cLegs', pal.legs]]) if (id !== editing) $(id).value = toCss(col);
  $('faceSel').value = MARKS[look.face] ? look.face : 'none';
  for (const id of ['LF', 'RF', 'LH', 'RH']) $(`leg${id}`).value = look.legs[id] ?? 'none';
  const withers = look.size.withersCm ?? Math.round(REF_WITHERS * rig.scale), kg = look.size.typicalKg ?? (look.size.weightKg ? (look.size.weightKg[0] + look.size.weightKg[1]) / 2 : REF_KG);
  $('withers').value = withers;
  $('withersOut').textContent = `${withers} cm`;
  $('weight').value = Math.round(kg);
  $('weightOut').textContent = `${Math.round(kg)} kg`;
  $('maneLen').value = look.maneLen;
  $('tailLen').value = look.tailLen;
}

/* ---------- start-up + main loop ---------- */
const timer = new THREE.Timer();
timer.connect(document);
buildPickers();
try { if (localStorage.getItem('lph-panel') === '1' || (localStorage.getItem('lph-panel') == null && window.innerWidth >= 900)) panelEl.hidden = false; } catch { panelEl.hidden = window.innerWidth < 900; }
panelBtn.setAttribute('aria-expanded', String(!panelEl.hidden));
panelBtn.classList.toggle('on', !panelEl.hidden);
const init = readHash();
state.horse = HORSE_LIST.find((h) => h.id === init.h) ?? HORSE_LIST[0];
rig = buildHorse(currentLook()); // sized first: the world's stride count depends on the horse's scale
scene.add(rig.root);
setLocation(LOC_LIST.find((l) => l.id === init.l)?.id ?? window.DEFAULT_LOCATION ?? LOC_LIST[0].id);
if (init.g && GAITS[init.g]) setGait(init.g);
syncTitle();
syncPanel();
setPlaying(true);
applyPhase(0); // pose the horse and place the props before resize() draws the first frame
resize();

renderer.setAnimationLoop((ts) => {
  timer.update(ts);
  const dt = Math.min(timer.getDelta(), 0.1);
  if (playing) loopPhase = wrap01(loopPhase + (dt * speed) / rig.gait.period);
  applyPhase(loopPhase);
  controls.update();
  renderNow();
});

window.__horse = {
  get period() { return rig.gait.period; },
  get strides() { return rig.gait.strides; },
  setPhase, resume, setView, setHorse, setLocation, setGait, toeWorld,
  renderer, scene, camera, controls,
  get horse() { return rig.root; }, get rig() { return rig; }, get world() { return world; }, get extras() { return extras; }, state,
};
</script>
</body>
</html>
